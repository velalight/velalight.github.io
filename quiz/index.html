<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:radial-gradient(ellipse at top,#1a0f2e,#0d0618 60%,#000);color:#fff;min-height:100vh;display:flex;justify-content:center;padding:16px;overflow-x:hidden}
#app{max-width:480px;width:100%;margin:auto;position:relative}
.screen{display:none;animation:fade .5s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(255,209,102,.3)}50%{box-shadow:0 0 35px rgba(255,209,102,.6)}}
h1{font-size:1.9rem;color:#ffd166;margin-bottom:12px;line-height:1.3;text-shadow:0 0 20px rgba(255,209,102,.3)}
h2{font-size:1.4rem;color:#ffd166;margin-bottom:12px}
p.sub{opacity:.88;line-height:1.8;margin-bottom:22px;font-size:1rem}
button{background:linear-gradient(135deg,#ff6b9d,#ff4d88);color:#fff;border:none;padding:16px;font-size:1.05rem;border-radius:14px;cursor:pointer;font-weight:bold;width:100%;transition:.25s;margin-top:10px;font-family:inherit;box-shadow:0 4px 15px rgba(255,107,157,.3)}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,107,157,.5)}
button:disabled{opacity:.4;cursor:not-allowed}
button.sec{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);box-shadow:none}
button.sec:hover{background:rgba(255,255,255,.15);transform:none}

input::placeholder{color:rgba(255,255,255,.4)}
input:focus{border-color:#ff6b9d;box-shadow:0 0 15px rgba(255,107,157,.3)}
.progress{width:100%;height:5px;background:rgba(255,255,255,.1);border-radius:10px;margin-bottom:22px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#ffd166,#ff6b9d);transition:width .4s;box-shadow:0 0 10px rgba(255,107,157,.6)}
.qnum{font-size:.85rem;opacity:.6;margin-bottom:8px;letter-spacing:1px}
.qtext{font-size:1.25rem;font-weight:bold;margin-bottom:22px;line-height:1.6;min-height:70px}

.result-hero .emoji{font-size:4rem;margin-bottom:12px}

.menu-grid{display:grid;gap:14px;margin-top:20px}
.menu-item{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:18px;cursor:pointer;transition:.25s;display:flex;align-items:center;justify-content:space-between;text-align:right}

.menu-item .mi-left{display:flex;align-items:center;gap:14px;flex:1}
.menu-item .mi-icon{font-size:1.8rem}
.menu-item .mi-title{font-weight:bold;margin-bottom:4px}
.menu-item .mi-sub{font-size:.8rem;opacity:.6}
.share-box{background:rgba(255,255,255,.06);padding:14px;border-radius:12px;margin-bottom:12px;font-size:.75rem;word-break:break-all;opacity:.85;direction:ltr;text-align:left;border:1px solid rgba(255,255,255,.1)}
.score-big{font-size:4.5rem;font-weight:bold;color:#ffd166;margin:16px 0;text-align:center;text-shadow:0 0 30px rgba(255,209,102,.5)}
.msg{font-size:1.05rem;line-height:1.7;text-align:center;margin-bottom:20px}
.powered{text-align:center;font-size:.72rem;opacity:.35;margin-top:32px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08)}
.streak-box{display:flex;justify-content:center;gap:6px;margin:20px 0;flex-wrap:wrap}
.streak-day{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:.9rem}
.streak-day.done{background:linear-gradient(135deg,#ff6b9d,#ff4d88);font-weight:bold;box-shadow:0 0 15px rgba(255,107,157,.5)}
.daily-q{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:22px;margin-bottom:16px}
.daily-q .dq-text{font-size:1.15rem;font-weight:bold;margin-bottom:18px;line-height:1.6}
.dq-opt{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);padding:14px;border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:.95rem;transition:.2s;display:flex;justify-content:space-between;align-items:center;line-height:1.5}
.dq-opt:hover{background:rgba(255,255,255,.12)}
.dq-opt .pct{color:#ffd166;font-weight:bold;font-size:.9rem;min-width:40px}
.back-btn{background:transparent;border:none;color:#fff;opacity:.7;padding:8px 0;text-align:right;font-size:.9rem;width:auto;cursor:pointer;margin-bottom:16px;box-shadow:none}
.back-btn:hover{opacity:1;transform:none}
.copy-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000;animation:fade .3s}
.copy-modal-inner{background:#1a0f2e;border:2px solid #ffd166;border-radius:20px;padding:24px;max-width:400px;width:100%}
.copy-modal textarea{width:100%;height:100px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:12px;color:#fff;font-family:monospace;font-size:.85rem;direction:ltr;text-align:left;margin-bottom:12px;resize:none}
.scent-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.scent-card{background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12);border-radius:16px;padding:16px 8px;cursor:pointer;text-align:center;transition:.25s}
.scent-card:hover{background:rgba(255,209,102,.15);border-color:rgba(255,209,102,.5);transform:translateY(-2px)}
.scent-card .emoji{font-size:1.8rem;margin-bottom:6px}
.scent-card .name{font-weight:bold;font-size:.8rem;line-height:1.3}
</style>
</head>

const app = document.getElementById('app');
const store = {
  get:k=>{try{return JSON.parse(localStorage.getItem('vela_'+k))}catch{return null}},
  set:(k,v)=>localStorage.setItem('vela_'+k,JSON.stringify(v)),
  del:k=>localStorage.removeItem('vela_'+k)
};

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}
function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function dec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(decodeURIComponent(escape(atob(s))))}
function today(){return new Date().toISOString().slice(0,10)}
function render(html){app.innerHTML=`<div class="screen active">${html}</div>`;window.scrollTo(0,0)}

async function copyText(text){
  try {
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch(e){}
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    ta.style.top = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch(e){ return false; }
}

function showCopyModal(text){
  const div = document.createElement('div');
  div.className = 'copy-modal';
  div.innerHTML = `
    <div class="copy-modal-inner">
      <h2 style="margin-bottom:12px">📋 انسخ الرابط</h2>
      <p style="opacity:.7;font-size:.85rem;margin-bottom:12px">اضغط مطولاً أو Ctrl+A ثم Ctrl+C</p>
      <textarea readonly>${esc(text)}</textarea>
      <button onclick="this.closest('.copy-modal').remove()">تم</button>
    </div>
  `;
  document.body.appendChild(div);
  const ta = div.querySelector('textarea');
  ta.focus();
  ta.select();
}

async function shareOrCopy(text){
  const ok = await copyText(text);
  if(ok){
    alert('✓ اتنسخ!');
  } else if(navigator.share){
    try { await navigator.share({text}); return; } catch(e){}
    showCopyModal(text);
  } else {
    showCopyModal(text);
  }
}

function startGuess(){
  const name = document.getElementById('guesser-name').value.trim();
  if(name.length<2) return alert('اكتب اسمك');
  CHALLENGE.guesser = name;
  CHALLENGE.guesses = [];
  CHALLENGE.gIdx = 0;
  renderGuessQ();
}

function renderGuessQ(){
  const q = DEEP_QUESTIONS[CHALLENGE.gIdx];
  const pct = (CHALLENGE.gIdx/DEEP_QUESTIONS.length)*100;
  render(`
    <div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="qnum">سؤال ${CHALLENGE.gIdx+1} من 10 — بتخمن إجابات ${esc(CHALLENGE.n)}</div>
    <div class="qtext">${q.q}</div>
    ${q.opts.map((o,i)=>`<button class="opt" onclick="guessAnswer(${i})">${o.t}</button>`).join('')}
  `);
}

function guessAnswer(i){
  CHALLENGE.guesses.push(i);
  CHALLENGE.gIdx++;
  if(CHALLENGE.gIdx >= DEEP_QUESTIONS.length){
    showGuessResult();
  } else {
    renderGuessQ();
  }
}

function showGuessResult(){
  const correct = CHALLENGE.a.filter((a,i)=>a===CHALLENGE.guesses[i]).length;
  const total = CHALLENGE.a.length;
  const pct = Math.round((correct/total)*100);
  let msg;
  if(pct>=80) msg = `${esc(CHALLENGE.n)} مش هيقدر يخبي عنك حاجة — إنت فاهمه بجد 💎`;
  else if(pct>=60) msg = `مش وحش! لسه فيه أسرار بينكم`;
  else if(pct>=40) msg = `نص نص — محتاجين تتكلموا أكتر 😅`;
  else if(pct>=20) msg = `شكلك محتاج تعيد تعرف ${esc(CHALLENGE.n)} من الأول 😂`;
  else msg = `مفيش ولا نقطة؟! تعالى نتعرف من جديد 😂`;
  
  const resultData = {p:CHALLENGE.p,on:CHALLENGE.n,gn:CHALLENGE.guesser,a:CHALLENGE.a,g:CHALLENGE.guesses,s:correct};
  const resultUrl = `${location.origin}${location.pathname}?r=${enc(resultData)}`;
  const shareText = `خمنت إجابات ${CHALLENGE.n} على 10 أسئلة نفسية عميقة\nالنتيجة: ${correct}/${total} (${pct}%)\n\n${resultUrl}`;
  
  render(`
    <h1>النتيجة 🎯</h1>
    <div class="score-big">${correct}/${total}</div>
    <p class="msg" style="color:#ffd166;font-size:1.3rem;font-weight:bold">${pct}% فهم</p>
    <p class="msg">${msg}</p>
    <button onclick="shareOrCopy('${esc(shareText)}')">📤 ابعت النتيجة لـ ${esc(CHALLENGE.n)}</button>
    <button class="sec" onclick="location.href=location.pathname">🎮 العب إنت كمان</button>
    <div class="powered">Powered by VelaLight</div>
  `);
}

// 📊 استقبال النتيجة
// ================================================================
function showResultBack(data){
  const key = 'leader_'+data.p+'_'+data.on;
  const leaders = store.get(key) || [];
  leaders.push({name:data.gn, score:data.s, total:data.a.length, date:Date.now()});
  leaders.sort((a,b)=>b.score-a.score);
  store.set(key,leaders.slice(0,20));
  
  const pct = Math.round((data.s/data.a.length)*100);
  render(`
    <h1>${esc(data.gn)} خمّن إجاباتك! 🎯</h1>
    <div class="score-big">${data.s}/${data.a.length}</div>
    <p class="msg" style="color:#ffd166;font-size:1.4rem;font-weight:bold">${pct}% فهم</p>
    <p class="msg">النتيجة اتحفظت في لوحة الشرف</p>
    <button onclick="location.href=location.pathname">🏠 الرئيسية</button>
    <div class="powered">Powered by VelaLight</div>
  `);
}

// ================================================================
// 🔥 سؤال اليوم + Streak
// ================================================================
function showDaily(){
  const todayDone = store.get('dailyDate')===today();
  if(todayDone) return showDailyResult();
  
  const q = DAILY_POOL[new Date().getDate() % DAILY_POOL.length];
  render(`
    <button class="back-btn" onclick="showHome()">← رجوع</button>
    <h1>🔥 سؤال اليوم</h1>
    <p class="sub">جاوب، وشوف نسبة الناس اللي اختارت زيك</p>
    <div class="daily-q">
      <div class="dq-text">${q.q}</div>
      ${q.o.map((o,i)=>`<div class="dq-opt" onclick="answerDaily(${i})">${o}<span class="pct" id="pct-${i}"></span></div>`).join('')}
    </div>
    <div class="powered">Powered by VelaLight</div>
  `);
}

function answerDaily(i){
  const q = DAILY_POOL[new Date().getDate() % DAILY_POOL.length];
  const fake = [45,25,15,15];
  const shuffled = [...fake].sort(()=>Math.random()-0.5);
  q.o.forEach((_,idx)=>{
    const el = document.getElementById('pct-'+idx);
    el.textContent = (idx===i ? fake[0] : shuffled[idx]) + '%';
    if(idx===i) el.style.color = '#ff6b9d';
  });
  store.set('dailyDate',today());
  
  const s = store.get('streak') || {days:[],count:0};
  const t = today();
  if(!s.days.includes(t)){
    s.days.push(t);
    if(s.days.length>30) s.days = s.days.slice(-30);
    s.count = s.days.length;
    store.set('streak',s);
  }
  
  setTimeout(()=>{
    render(`
      <h1>✓ تم!</h1>
      <p class="msg">شوفت إجاباتك. تعالى بكرة عشان سؤال جديد</p>
      <div class="streak-box">
        ${s.days.slice(-7).map(()=>`<div class="streak-day done">🔥</div>`).join('')}
      </div>
      <p class="msg" style="color:#ffd166;font-size:1.3rem">${s.count} يوم متتالي</p>
      <button onclick="showHome()">رجوع للرئيسية</button>
      <div class="powered">Powered by VelaLight</div>
    `);
  }, 900);
}

function showDailyResult(){
  const s = store.get('streak') || {days:[],count:0};
  render(`
    <button class="back-btn" onclick="showHome()">← رجوع</button>
    <h1>🔥 سؤال اليوم</h1>
    <p class="sub">جاوبت سؤال النهارده! ارجع بكرة عشان سؤال جديد</p>
    <div class="streak-box">
      ${s.days.slice(-7).map(()=>`<div class="streak-day done">🔥</div>`).join('')}
    </div>
    <p class="msg" style="color:#ffd166;font-size:1.3rem">${s.count} يوم متتالي</p>
    <button onclick="showHome()">رجوع للرئيسية</button>
    <div class="powered">Powered by VelaLight</div>
  `);
}

// ابدأ
init();
</script>
</body>
</html>
