<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مين يعرفك أكتر؟ | VelaLight</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #2d1b4e, #4a2c7a);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 12px;
      color: #ffd166;
    }
    p.subtitle {
      font-size: 1.1rem;
      opacity: 0.9;
      margin-bottom: 32px;
      line-height: 1.7;
    }
    button.start-btn {
      background: #ff6b9d;
      color: #fff;
      border: none;
      padding: 16px 48px;
      font-size: 1.2rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s, background 0.2s;
    }
    button.start-btn:hover {
      background: #ff4d88;
      transform: scale(1.05);
    }
    .powered {
      margin-top: 40px;
      font-size: 0.8rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>مين يعرفك أكتر؟</h1>
    <p class="subtitle">جاوب 10 أسئلة عن نفسك، وابعت التحدي لأصحابك.<br>مين فيهم هيعرفك أكتر؟ ❤️</p>
    <button class="start-btn" onclick="alert('اللعبة هتشتغل قريبًا!')">ابدأ التحدي</button>
    <div class="powered">Powered by VelaLight</div>
  </div>
</body>
</html>
