const app = document.getElementById('app');
const store = {
  get:k=>{try{return JSON.parse(localStorage.getItem('vela_'+k))}catch{return null}},
  set:(k,v)=>localStorage.setItem('vela_'+k,JSON.stringify(v)),
  del:k=>localStorage.removeItem('vela_'+k)
};

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}

function enc(obj){
  const phaseMap = {partner:'p', friends:'f', family:'m'};
  const compact = { p: phaseMap[obj.p] || 'p', n: obj.n, a: obj.a.join('') };
  return btoa(unescape(encodeURIComponent(JSON.stringify(compact)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function dec(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4) s+='=';
  const obj = JSON.parse(decodeURIComponent(escape(atob(s))));
  const phaseMap = {p:'partner', f:'friends', m:'family'};
  return { p: phaseMap[obj.p] || 'partner', n: obj.n, a: obj.a.split('').map(Number) };
}

async function copyText(text){
  try { if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; } } catch(e){}
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px'; ta.style.top = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok = document.execCommand('copy'); document.body.removeChild(ta); return ok;
  } catch(e){ return false; }
}
function showCopyModal(text){
  const div = document.createElement('div');
  div.className = 'copy-modal';
  div.innerHTML = `<div class="copy-modal-inner"><h2 style="margin-bottom:12px">📋 انسخ الرابط</h2><p style="opacity:.7;font-size:.85rem;margin-bottom:12px">اضغط مطولاً على النص ← تحديد الكل ← نسخ</p><textarea readonly onclick="this.select()">${esc(text)}</textarea><button onclick="this.closest('.copy-modal').remove()">تم</button></div>`;
  document.body.appendChild(div);
  const ta = div.querySelector('textarea'); ta.focus(); ta.select();
}
function shareWhatsApp(text){
  if(!text) text = window._vlShareText || '';
  if(!text){ alert('لا يوجد نص للمشاركة'); return; }
  const url = 'https://wa.me/?text=' + encodeURIComponent(text);
  try { const w = window.open(url, '_blank'); if(!w) location.href = url; } catch(e){ location.href = url; }
}
async function shareOrCopy(text){
  if(!text) text = window._vlShareText || '';
  if(!text){ alert('لا يوجد نص للنسخ'); return; }
  const ok = await copyText(text);
  if(ok){ alert('✓ اتنسخ! الصقه في واتساب أو أي تطبيق'); return; }
  if(navigator.share){ try { await navigator.share({text}); return; } catch(e){} }
  showCopyModal(text);
}

// ================================================================
function generateStoryImage(personaType, personaEmoji, extraText) {
  const canvas = document.createElement('canvas');
  canvas.width = 1080;
  canvas.height = 1920;
  const ctx = canvas.getContext('2d');

  // خلفية متدرجة
  const grad = ctx.createLinearGradient(0, 0, 1080, 1920);
  grad.addColorStop(0, '#1a0f2e');
  grad.addColorStop(0.5, '#2d1b4e');
  grad.addColorStop(1, '#4a2c7a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1080, 1920);

  // دوائر ديكورية
  ctx.fillStyle = 'rgba(255,209,102,0.1)';
  ctx.beginPath();
  ctx.arc(150, 300, 200, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(950, 1600, 250, 0, Math.PI*2);
  ctx.fill();

  // شعار VelaLight
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd166';
  ctx.font = 'bold 70px "Segoe UI", Tahoma, sans-serif';
  ctx.fillText('VelaLight', 540, 200);

  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '30px "Segoe UI", Tahoma, sans-serif';
  ctx.fillText('Luxury Candle Studio', 540, 250);

  // إيموجي الشخصية (نرسمه في المنتصف)
  ctx.font = '200px "Segoe UI", Tahoma, sans-serif';
  ctx.fillText(personaEmoji || '🧠', 540, 700);

  // اسم الشخصية
  ctx.fillStyle = '#ffd166';
  ctx.font = 'bold 110px "Segoe UI", Tahoma, sans-serif';
  ctx.fillText(personaType, 540, 950);

  // النص الإضافي (مثل Streak)
  if (extraText) {
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 80px "Segoe UI", Tahoma, sans-serif';
    const lines = extraText.split('\n');
    let y = 1150;
    lines.forEach(line => {
      ctx.fillText(line, 540, y);
      y += 110;
    });
  }

  // Footer
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = '45px "Segoe UI", Tahoma, sans-serif';
  ctx.fillText('Powered by VelaLight', 540, 1750);

  ctx.fillStyle = 'rgba(255,209,102,0.8)';
  ctx.font = 'bold 40px "Segoe UI", Tahoma, sans-serif';
  ctx.fillText('دوامة الريحة', 540, 1820);

  // تحميل الصورة
  const link = document.createElement('a');
  link.download = 'velalight-story.png';
  link.href = canvas.toDataURL('image/png');
  link.click();

  setTimeout(() => {
    alert('✅ الصورة اتحملت! افتح إنستجرام واعمل ستوري بالصورة.');
  }, 600);
}

// ================================================================
function autoAdvance(callback, duration){
  duration = duration || 6000;
  let advanced = false;
  const advance = () => {
    if(advanced) return;
    advanced = true;
    clearInterval(timer);
    const screen = app.querySelector('.screen');
    if(screen) screen.removeEventListener('click', clickHandler);
    const btn = document.getElementById('manualNextBtn');
    if(btn) btn.removeEventListener('click', advance);
    callback();
  };
  const clickHandler = function(e){
    if(e.target.tagName === 'BUTTON') return;
    if(window.getSelection().toString()) return;
    advance();
  };
  const startTime = Date.now();
  const timer = setInterval(() => {
    if(advanced){ clearInterval(timer); return; }
    const elapsed = Date.now() - startTime;
    const pct = Math.min(100, (elapsed / duration) * 100);
    const fill = document.getElementById('autoAdvanceFill');
    if(fill) fill.style.width = pct + '%';
    if(elapsed >= duration){ advance(); }
  }, 50);
  const screen = app.querySelector('.screen');
  if(screen) screen.addEventListener('click', clickHandler);
  const btn = document.getElementById('manualNextBtn');
  if(btn) btn.addEventListener('click', advance);
}

function renderDeepQ(){
  const p = store.get('progress');
  const q = DEEP_QUESTIONS[p.idx];
  const pct = (p.idx/DEEP_QUESTIONS.length)*100;
  
  let backBtnHTML = '';
  if(p.idx > 0){
    backBtnHTML = `<button class="back-icon" onclick="event.stopPropagation();prevDeep()" title="السؤال السابق">→</button>`;
  } else {
    backBtnHTML = `<button class="back-icon" onclick="event.stopPropagation();showExitConfirm('personality')" title="إلغاء">✕</button>`;
  }
  
  render(`
    <div class="top-nav">
      ${backBtnHTML}
      <div class="nav-title">${p.idx+1} / ${DEEP_QUESTIONS.length}</div>
      <button class="nav-skip" onclick="event.stopPropagation();showExitConfirm('personality')">إلغاء</button>
    </div>
    <div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="qtext">${q.q}</div>
    ${q.opts.map((o,i)=>`<button class="opt" onclick="event.stopPropagation();answerDeep(${i})">${o.t}</button>`).join('')}
  `);
}

function prevDeep(){
  const p = store.get('progress');
  if(p.idx > 0){ p.idx--; p.answers.pop(); store.set('progress',p); renderDeepQ(); }
}

function answerDeep(i){
  const p = store.get('progress');
  const opt = DEEP_QUESTIONS[p.idx].opts[i];
  p.answers.push(opt.persona);
  store.set('progress',p);
  showInsight(opt.insight, opt.persona);
}

function showInsight(text, persona){
  const a = ARCHETYPES[persona];
  render(`
    <div class="insight">
      <div class="insight-icon">💡</div>
      <div class="insight-text">"${text}"</div>
      <div class="insight-tag">${a.emoji} ${persona}</div>
    </div>
    <div class="auto-advance-bar"><div class="auto-advance-fill" id="autoAdvanceFill"></div></div>
    <p class="auto-hint">⏱ بيتحول تلقائي في 6 ثواني</p>
    <button class="sec" id="manualNextBtn" style="margin-top:16px">التالي ←</button>
  `);
  autoAdvance(nextDeep, 6000);
}

function nextDeep(){
  const p = store.get('progress');
  p.idx++;
  if(p.idx >= DEEP_QUESTIONS.length){ finishDeep(p.answers); }
  else { store.set('progress',p); renderDeepQ(); }
}

function finishDeep(answers){
  const counts = {};

function renderPhaseQ(){
  const p = store.get('progress');
  let qs;
  if (p.phase === 'partner') qs = PARTNER_QUESTIONS;
  else if (p.phase === 'friends') qs = FRIENDS_QUESTIONS;
  else qs = FAMILY_QUESTIONS;
  
  const q = qs[p.idx];

  let backBtnHTML = '';
  if(p.idx > 0){
    backBtnHTML = `<button class="back-icon" onclick="event.stopPropagation();prevPhase()" title="السؤال السابق">→</button>`;

  }
  
  render(`

function prevPhase(){
  const p = store.get('progress');
  if(p.idx > 0){ p.idx--; p.answers.pop(); store.set('progress',p); renderPhaseQ(); }
}

function answerPhase(i){
  const p = store.get('progress');
  p.answers.push(i);
  p.idx++;
  
  let qs;
  if (p.phase === 'partner') qs = PARTNER_QUESTIONS;
  else if (p.phase === 'friends') qs = FRIENDS_QUESTIONS;
  else qs = FAMILY_QUESTIONS;

  if(p.idx >= qs.length){ finishPhase(p); }
  else { store.set('progress',p); renderPhaseQ(); }
}

    <button class="back-btn" onclick="event.stopPropagation();showHome()">← رجوع</button>
    <h1>🔥 سؤال اليوم</h1>
    <p class="sub">جاوب، وشوف نسبة الناس اللي اختارت زيك</p>
    <div class="daily-q">
      <div class="dq-text">${q.q}</div>
      ${q.o.map((o,i)=>`<div class="dq-opt" onclick="event.stopPropagation();answerDaily(${i})">${o}<span class="pct" id="pct-${i}"></span></div>`).join('')}
    </div>
    <div class="powered">Powered by VelaLight</div>
  `);
}

function answerDaily(i){
  const q = DAILY_POOL[new Date().getDate() % DAILY_POOL.length];
  const fake = [45,25,15,15];
  const shuffled = [...fake].sort(()=>Math.random()-0.5);
  q.o.forEach((_,idx)=>{
    const el = document.getElementById('pct-'+idx);
    el.textContent = (idx===i ? fake[0] : shuffled[idx]) + '%';
    if(idx===i) el.style.color = '#ff6b9d';
  });
  store.set('dailyDate',today());
  const s = store.get('streak') || {days:[],count:0};
  const t = today();
  if(!s.days.includes(t)){
    s.days.push(t);
    if(s.days.length>30) s.days = s.days.slice(-30);
    s.count = s.days.length;
    store.set('streak',s);
  }
  setTimeout(()=>{
    const extraText = `🔥 ${s.count} يوم متتالي\nفي دوامة الريحة`;
    window._vlShareText = `كملت ${s.count} أيام متتالية في دوامة الريحة 🔥\nإنت مين؟ اعرف شخصيتك:\n${location.origin}${location.pathname}`;
    render(`
      <h1>✓ تم!</h1>
      <p class="msg">شوفت إجاباتك. تعالى بكرة عشان سؤال جديد</p>
      <div class="streak-box">${s.days.slice(-7).map(()=>`<div class="streak-day done">🔥</div>`).join('')}</div>
      <p class="msg" style="color:#ffd166;font-size:1.3rem">${s.count} يوم متتالي</p>
      <button class="insta" onclick="event.stopPropagation();generateStoryImage('الـ Streak','🔥','${extraText}')">📸 شارك على إنستجرام</button>
      <div class="shop-cta">
        <p>عايز تشوف عطور تناسب ذوقك؟</p>
        <a href="https://velalight.github.io/products.html" class="btn-shop-link">اكتشف شموع VelaLight ←</a>
      </div>
      <button onclick="event.stopPropagation();showHome()">رجوع للرئيسية</button>
      <div class="powered">Powered by VelaLight</div>
    `);
  }, 900);
}
