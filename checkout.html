<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إتمام الطلب | VelaLight</title>
<meta name="description" content="إتمام طلبك من VelaLight — بيانات الشحن والدفع والتأكيد.">
<meta name="theme-color" content="#faf6f0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=El+Messiri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Tajawal', sans-serif; }
  .co-header { background: #fff; border-bottom: 1px solid var(--line); padding: 14px 0; position: sticky; top: 0; z-index: 10; }
  .co-header .wrap { display: flex; align-items: center; justify-content: space-between; }
  .co-logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); }
  .co-logo b { font-family: 'El Messiri', serif; font-size: 1.3rem; color: var(--gold2); }
  .co-logo small { display: block; font-size: 0.7rem; color: var(--mut); }
  .co-back { color: var(--mut); text-decoration: none; font-size: 0.9rem; padding: 8px 14px; border-radius: 99px; border: 1px solid var(--line); transition: 0.2s; }
  .co-back:hover { border-color: var(--gold); color: var(--gold2); }
  .co-main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 80px; }
  .co-title { text-align: center; margin-bottom: 24px; }
  .co-title h1 { font-family: 'El Messiri', serif; font-size: 1.6rem; color: var(--ink); margin: 0 0 4px; }
  .co-title p { color: var(--mut); font-size: 0.9rem; margin: 0; }
  .co-layout { display: grid; grid-template-columns: 1fr 380px; gap: 28px; align-items: start; }
  @media (max-width: 900px) { .co-layout { grid-template-columns: 1fr; } }
  .co-card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
  .co-card h2 { font-family: 'El Messiri', serif; font-size: 1.1rem; margin: 0 0 18px; color: var(--ink); display: flex; align-items: center; gap: 8px; }
  .co-form { display: flex; flex-direction: column; gap: 14px; }
  .co-field label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--mut); margin-bottom: 6px; }
  .co-field input, .co-field select, .co-field textarea { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px; font-family: inherit; font-size: 0.95rem; background: var(--bg2, #faf6f0); color: var(--ink); transition: 0.2s; }
  .co-field input:focus, .co-field select:focus, .co-field textarea:focus { outline: none; border-color: var(--gold); background: #fff; }
  .co-field textarea { resize: vertical; min-height: 70px; }
  .co-field small { display: block; font-size: 0.72rem; color: var(--dim); margin-top: 4px; }
  .co-pay-opts { display: flex; flex-direction: column; gap: 10px; }
  .co-pay-opt { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; transition: 0.2s; background: var(--bg2, #faf6f0); }
  .co-pay-opt:hover { border-color: var(--gold); }
  .co-pay-opt.selected { border-color: var(--gold); background: #fffaf0; }
  .co-pay-opt input { margin: 0; accent-color: var(--gold); }
  .co-pay-opt-text { flex: 1; }
  .co-pay-opt-text b { display: block; font-size: 0.92rem; color: var(--ink); }
  .co-pay-opt-text small { display: block; font-size: 0.75rem; color: var(--mut); margin-top: 2px; }
  .co-pay-opt .ico { font-size: 1.3rem; }
  .co-pay-note { background: #fffaf0; border: 1px dashed var(--gold); border-radius: 10px; padding: 12px 14px; font-size: 0.82rem; color: var(--mut); line-height: 1.6; margin-top: 14px; }
  .co-summary { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 20px; position: sticky; top: 80px; }
  .co-summary h3 { font-family: 'El Messiri', serif; font-size: 1.05rem; margin: 0 0 16px; color: var(--ink); }
  .co-summary-items { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px dashed var(--line); max-height: 320px; overflow-y: auto; }
  .co-summary-item { display: flex; gap: 10px; align-items: center; }
  .co-summary-item img { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; background: var(--bg2, #faf6f0); flex-shrink: 0; }
  .co-summary-item-info { flex: 1; min-width: 0; }
  .co-summary-item-info b { display: block; font-size: 0.85rem; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .co-summary-item-info small { display: block; font-size: 0.72rem; color: var(--mut); margin-top: 2px; }
  .co-summary-item-price { font-size: 0.85rem; font-weight: 700; color: var(--gold2); white-space: nowrap; }
  .co-summary-row { display: flex; justify-content: space-between; font-size: 0.88rem; margin-bottom: 8px; color: var(--mut); }
  .co-summary-row.total { font-size: 1.05rem; font-weight: 800; color: var(--ink); border-top: 2px solid var(--line); padding-top: 12px; margin-top: 12px; }
  .co-summary-row.total span:last-child { color: var(--gold2); }
  .co-ship-free { background: #eafaf1; border: 1px solid #27ae60; color: #1e8449; padding: 10px 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; text-align: center; margin-bottom: 12px; }
  .co-btn { display: block; width: 100%; padding: 16px; border: none; border-radius: 12px; background: #25d366; color: #fff; font-family: inherit; font-size: 1.05rem; font-weight: 800; cursor: pointer; transition: 0.2s; text-align: center; text-decoration: none; }
  .co-btn:hover { background: #1eaa50; }
  .co-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .co-empty { text-align: center; padding: 60px 20px; }
  .co-empty .icon { font-size: 3rem; margin-bottom: 16px; opacity: 0.7; }
  .co-empty h2 { font-family: 'El Messiri', serif; font-size: 1.4rem; color: var(--gold2); margin: 0 0 8px; }
  .co-empty p { color: var(--mut); margin: 0 0 20px; font-size: 0.9rem; }
  .co-empty .co-btn { display: inline-block; width: auto; padding: 12px 32px; background: var(--gold); }
  .co-success { text-align: center; padding: 40px 20px; }
  .co-success .icon { font-size: 4rem; margin-bottom: 16px; }
  .co-success h2 { font-family: 'El Messiri', serif; font-size: 1.6rem; color: #27ae60; margin: 0 0 12px; }
  .co-success p { color: var(--mut); font-size: 0.95rem; line-height: 1.7; margin: 0 0 8px; }
  .co-success .order-id { display: inline-block; background: var(--bg2, #faf6f0); border: 1px dashed var(--gold); padding: 8px 16px; border-radius: 8px; font-family: monospace; font-size: 1rem; color: var(--gold2); font-weight: 700; margin: 12px 0; }
  .co-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 12px 24px; border-radius: 99px; font-size: 0.9rem; z-index: 9999; opacity: 0; transition: 0.3s; pointer-events: none; }
  .co-toast.show { opacity: 1; }
  @media (max-width: 600px) {
    .co-card { padding: 18px; }
    .co-summary { position: static; }
    .co-title h1 { font-size: 1.3rem; }
  }
</style>
</head>
<body>

<header class="co-header">
  <div class="wrap">
    <a href="index.html" class="co-logo">
      <span style="font-size:1.5rem;">🕯️</span>
      <div><b>VelaLight</b><small>Luxury Candle Studio</small></div>
    </a>
    <a href="javascript:history.back()" class="co-back">← رجوع</a>
  </div>
</header>

<main class="co-main" id="coMain"></main>
<div class="co-toast" id="coToast"></div>

<script>
(function(){
'use strict';
const WHATSAPP = '201223526105';
const FREE_SHIPPING_THRESHOLD = 3000;
const GOVS = ['القاهرة','الجيزة','الإسكندرية','القليوبية','الدقهلية','الشرقية','الغربية','المنوفية','البحيرة','كفر الشيخ','دمياط','بورسعيد','الإسماعيلية','السويس','شمال سيناء','جنوب سيناء','البحر الأحمر','الفيوم','بني سويف','المنيا','أسيوط','سوهاج','قنا','الأقصر','أسوان','الوادي الجديد','مطروح'];

function getCart(){try{return JSON.parse(localStorage.getItem('vl_cart')||'[]')}catch(e){return[]}}
function saveCart(c){try{localStorage.setItem('vl_cart',JSON.stringify(c))}catch(e){}}
function getUser(){try{return JSON.parse(localStorage.getItem('vl_user')||'{}')}catch(e){return{}}}
function saveUser(u){try{localStorage.setItem('vl_user',JSON.stringify(u))}catch(e){}}
function money(n){return Number(n||0).toLocaleString('en-US')+' ج.م'}
function toast(msg){const t=document.getElementById('coToast');t.textContent=msg;t.classList.add('show');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove('show'),2800)}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

let paymentMethod = 'instapay';

function init(){
  const cart = getCart();
  if(!cart.length){ renderEmpty(); return; }
  renderCheckout(cart);
}

function renderEmpty(){
  document.getElementById('coMain').innerHTML = `
    <div class="co-empty">
      <div class="icon">🕯️</div>
      <h2>سلتك فاضية</h2>
      <p>اختار شمعتك المفضلة وابدأ لحظتك الخاصة</p>
      <a href="products.html" class="co-btn">تصفح المنتجات ✨</a>
    </div>`;
}

function renderCheckout(cart){
  const user = getUser();
  const subtotal = cart.reduce((s,i)=>s+Number(i.price||0)*Number(i.qty||1),0);
  const shippingFree = subtotal >= FREE_SHIPPING_THRESHOLD;

  document.getElementById('coMain').innerHTML = `
    <div class="co-title">
      <h1>🛍️ إتمام الطلب</h1>
      <p>املأ بياناتك واختار طريقة الدفع، وبعدها اضغط "تأكيد الطلب"</p>
    </div>
    <div class="co-layout">
      <div>
        <div class="co-card">
          <h2>📦 بيانات الشحن</h2>
          <div class="co-form">
            <div class="co-field"><label for="coName">الاسم بالكامل *</label><input id="coName" type="text" autocomplete="name" value="${escapeHtml(user.name||'')}" placeholder="مثال: أحمد محمد"></div>
            <div class="co-field"><label for="coPhone">رقم الموبايل *</label><input id="coPhone" type="tel" autocomplete="tel" inputmode="tel" value="${escapeHtml(user.phone||'')}" placeholder="01XXXXXXXXX"></div>
            <div class="co-field"><label for="coEmail">الإيميل (اختياري)</label><input id="coEmail" type="email" autocomplete="email" value="${escapeHtml(user.email||'')}" placeholder="you@example.com"><small>هنبعت عليه تأكيد الطلب</small></div>
            <div class="co-field"><label for="coCity">المحافظة *</label><select id="coCity"><option value="">اختر المحافظة</option>${GOVS.map(g=>`<option value="${g}" ${user.city===g?'selected':''}>${g}</option>`).join('')}</select></div>
            <div class="co-field"><label for="coAddr">العنوان بالتفصيل *</label><textarea id="coAddr" autocomplete="street-address" placeholder="الشارع، رقم العمارة، الدور، علامة مميزة">${escapeHtml(user.addr||'')}</textarea></div>
            <div class="co-field"><label for="coNotes">ملاحظات (اختياري)</label><textarea id="coNotes" placeholder="أي تفاصيل إضافية للطلب">${escapeHtml(user.notes||'')}</textarea></div>
          </div>
        </div>
        <div class="co-card">
          <h2>💳 طريقة الدفع</h2>
          <div class="co-pay-opts">
            <label class="co-pay-opt selected"><input type="radio" name="pay" value="instapay" checked><span class="ico">💳</span><div class="co-pay-opt-text"><b>InstaPay</b><small>تحويل فوري عبر تطبيق InstaPay</small></div></label>
            <label class="co-pay-opt"><input type="radio" name="pay" value="vodafone"><span class="ico">📱</span><div class="co-pay-opt-text"><b>فودافون كاش</b><small>تحويل عبر محفظة فودافون كاش</small></div></label>
            <label class="co-pay-opt"><input type="radio" name="pay" value="orange"><span class="ico">📲</span><div class="co-pay-opt-text"><b>أورنج كاش</b><small>تحويل عبر محفظة أورنج كاش</small></div></label>
          </div>
          <div class="co-pay-note">💡 <b>ملحوظة:</b> قيمة المنتجات بتتحول مقدمًا عبر الطريقة اللي هتختارها. تفاصيل التحويل هتوصلك على واتساب فور تأكيد الطلب. <b>تكلفة الشحن تُدفع كاش لمندوب الشحن عند الاستلام.</b></div>
        </div>
      </div>
      <aside class="co-summary">
        <h3>🛍️ ملخص الطلب (${cart.length} منتج)</h3>
        ${shippingFree?'<div class="co-ship-free">🎉 مبروك! الشحن مجاني على طلبك</div>':''}
        <div class="co-summary-items">
          ${cart.map(item=>`<div class="co-summary-item"><img src="${escapeHtml(item.img||'velalight-wooden-luxury-set-3candles-detail.webp')}" alt="" onerror="this.style.display='none'"><div class="co-summary-item-info"><b>${escapeHtml(item.name||'منتج')}</b><small>${escapeHtml(item.scent||'')} • × ${item.qty||1}${item.isGift?' • 🎁 هدية':''}</small></div><div class="co-summary-item-price">${Number(item.price)===0?'مجاني':money(Number(item.price||0)*Number(item.qty||1))}</div></div>`).join('')}
        </div>
        <div class="co-summary-row"><span>قيمة المنتجات</span><span>${money(subtotal)}</span></div>
        <div class="co-summary-row"><span>الشحن</span><span>${shippingFree?'🎉 مجاني':'يُدفع كاش للمندوب'}</span></div>
        <div class="co-summary-row total"><span>الإجمالي</span><span>${money(subtotal)}</span></div>
        <button class="co-btn" id="confirmBtn" style="margin-top:16px;">💬 تأكيد الطلب عبر واتساب</button>
        <p style="font-size:0.75rem;color:var(--mut);text-align:center;margin:10px 0 0;line-height:1.5;">بالضغط على الزر، هيتحولك على واتساب برسالة فيها كل تفاصيل طلبك</p>
      </aside>
    </div>`;

  bindEvents(cart);
}

function bindEvents(cart){
  document.querySelectorAll('.co-pay-opt input').forEach(inp=>{
    inp.addEventListener('change',e=>{
      paymentMethod=e.target.value;
      document.querySelectorAll('.co-pay-opt').forEach(el=>el.classList.remove('selected'));
      e.target.closest('.co-pay-opt').classList.add('selected');
    });
  });
  document.getElementById('confirmBtn').addEventListener('click',()=>confirmOrder(cart));
}

function validate(){
  const name=document.getElementById('coName').value.trim();
  const phone=document.getElementById('coPhone').value.trim().replace(/\s/g,'');
  const city=document.getElementById('coCity').value;
  const addr=document.getElementById('coAddr').value.trim();
  if(!name){toast('⚠️ اكتب الاسم بالكامل');document.getElementById('coName').focus();return false}
  if(!phone){toast('⚠️ اكتب رقم الموبايل');document.getElementById('coPhone').focus();return false}
  if(!/^01[0-9]{9}$/.test(phone)){toast('⚠️ رقم الموبايل غير صحيح (11 رقم يبدأ بـ 01)');document.getElementById('coPhone').focus();return false}
  if(!city){toast('⚠️ اختر المحافظة');document.getElementById('coCity').focus();return false}
  if(!addr){toast('⚠️ اكتب العنوان بالتفصيل');document.getElementById('coAddr').focus();return false}
  return true;
}

function saveShippingToUser(){
  const user=getUser();
  user.name=document.getElementById('coName').value.trim();
  user.phone=document.getElementById('coPhone').value.trim();
  user.email=document.getElementById('coEmail').value.trim();
  user.city=document.getElementById('coCity').value;
  user.addr=document.getElementById('coAddr').value.trim();
  user.notes=document.getElementById('coNotes').value.trim();
  saveUser(user);
}

function confirmOrder(cart){
  if(!validate())return;
  saveShippingToUser();
  const user=getUser();
  const subtotal=cart.reduce((s,i)=>s+Number(i.price||0)*Number(i.qty||1),0);
  const orderId='VL-'+Math.random().toString(36).slice(2,8).toUpperCase();
  const payNames={instapay:'InstaPay',vodafone:'فودافون كاش',orange:'أورنج كاش'};

  let msg='';
  msg+='✨ أهلاً VelaLight!\n\n';
  msg+='🕯️ طلب جديد\n';
  msg+=`🧾 رقم الطلب: ${orderId}\n`;
  msg+='━━━━━━━━━━━━━━━━━━━━\n\n';
  msg+='🛍️ المنتجات:\n';
  cart.forEach(item=>{
    msg+=`• ${item.name}${item.scent?' ('+item.scent+')':''} × ${item.qty||1}`;
    if(item.isGift)msg+=' [هدية]';
    msg+=` = ${money(Number(item.price||0)*Number(item.qty||1))}\n`;
  });
  msg+='\n━━━━━━━━━━━━━━━━━━━━\n';
  msg+=`💰 إجمالي المنتجات: ${money(subtotal)}\n`;
  msg+=`💳 طريقة الدفع: ${payNames[paymentMethod]||'InstaPay'}\n`;
  msg+='🚚 الشحن: كاش للمندوب عند الاستلام\n';
  msg+='\n━━━━━━━━━━━━━━━━━━━━\n';
  msg+=`👤 الاسم: ${user.name}\n`;
  msg+=`📱 الموبايل: ${user.phone}\n`;
  if(user.email)msg+=`📧 الإيميل: ${user.email}\n`;
  msg+=`🏙️ المحافظة: ${user.city||''}\n`;
  msg+=`📍 العنوان: ${user.addr}\n`;
  if(user.notes)msg+=`📝 ملاحظات: ${user.notes}\n`;
  msg+='\n━━━━━━━━━━━━━━━━━━━━\n';
  msg+='🎁 هدية: كود THANKS10 لخصم 10% على طلبك الجاي\n\n';
  msg+='⏳ في انتظار تأكيد الطلب وتفاصيل الدفع 📱\n\n';
  msg+='شكراً ليك! 🕯️';

  const waUrl=`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`;
  window.open(waUrl,'_blank');
  saveCart([]);
  renderSuccess(orderId);
}

function renderSuccess(orderId){
  document.getElementById('coMain').innerHTML = `
    <div class="co-success">
      <div class="icon">🎉</div>
      <h2>تم تسجيل طلبك بنجاح!</h2>
      <p>لو واتساب مفتحش تلقائياً، اضغط على الزرار تحت عشان تبعته.</p>
      <div class="order-id">${orderId}</div>
      <p style="font-size:0.85rem;">هنتواصل معاك قريب لتأكيد الدفع والشحن.</p>
      <div style="margin-top:24px;"><a href="products.html" class="co-btn" style="display:inline-block;width:auto;padding:12px 32px;background:var(--gold);">🕯️ تصفح منتجات تانية</a></div>
    </div>`;
}

if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init)}else{init()}

})();
</script>

</body>
</html>
