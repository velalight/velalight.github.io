<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة التحكم | VelaLight</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=El+Messiri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.login-box{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:2.5rem;width:min(400px,92vw);text-align:center}
.login-box h2{font-family:var(--fd);color:var(--gold2);margin-bottom:1.5rem}
.login-box input{margin-bottom:1rem;text-align:center}
.adm-top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 0;flex-wrap:wrap}
.adm-top h1{font-family:var(--fd);color:var(--gold2);font-size:1.4rem}
.adm-nav{display:flex;gap:.5rem;flex-wrap:wrap}
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
<div class="login-box">
<h2>🔐 لوحة تحكم VelaLight</h2>
<input id="loginEmail" type="email" placeholder="الإيميل">
<input id="loginPass" type="password" placeholder="كلمة المرور">
<button class="btn" id="loginBtn" style="width:100%">تسجيل الدخول</button>
<p id="loginErr" style="color:var(--bad);font-size:.82rem;margin-top:.8rem"></p>
</div>
</div>

<div id="adminScreen" class="hidden">
<div class="wrap">

<div class="adm-top">
<h1>⚙️ لوحة التحكم</h1>
<div class="adm-nav">
<a class="btn ghost sm" href="index.html">↩ المتجر</a>
<button class="btn danger sm" id="logoutBtn">تسجيل خروج</button>
</div>
</div>

<div class="adm-head" id="statsRow">
<div class="adm-stat"><b id="stOrders">0</b><span>📦 الطلبات</span></div>
<div class="adm-stat"><b id="stProducts">0</b><span>🕯️ المنتجات</span></div>
<div class="adm-stat"><b id="stReviews">0</b><span>⭐ المراجعات</span></div>
<div class="adm-stat"><b id="stRevenue">0</b><span>💰 الإيرادات</span></div>
</div>

<div class="adm-tabs">
<button class="btn sm" data-tab="orders">📦 الطلبات</button>
<button class="btn sm ghost" data-tab="products">🕯️ المنتجات</button>
<button class="btn sm ghost" data-tab="reviews">⭐ المراجعات</button>
</div>

<div id="tab-orders">
<table class="adm">
<thead><tr><th>رقم الطلب</th><th>التاريخ</th><th>العميل</th><th>الموبايل</th><th>الإجمالي</th><th>الحالة</th></tr></thead>
<tbody id="ordersBody"></tbody>
</table>
</div>

<div id="tab-products" class="hidden">
<button class="btn sm" id="addProductBtn" style="margin-bottom:1rem">➕ إضافة / تعديل منتج (بدون تعديل كود)</button>

<div class="pform hidden" id="productForm">
<h3 style="color:var(--gold2);margin-bottom:1rem" id="formTitle">منتج جديد</h3>
<div class="g">
<div><label>اسم المنتج (عربي) *</label><input id="pf_name"></div>
<div><label>الاسم الإنجليزي (للرابط/SEO) *</label><input id="pf_nameEn"></div>
</div>
<div class="g">
<div><label>السعر (ج.م) *</label><input id="pf_price" type="number"></div>
<div><label>السعر قبل الخصم</label><input id="pf_old" type="number"></div>
</div>
<div class="g">
<div><label>التصنيف</label>
<select id="pf_cat">
<option value="wood">شموع خشبية</option>
<option value="glass">شموع زجاجية</option>
<option value="crystal">شموع كريستالية</option>
<option value="metal">شموع معدنية</option>
<option value="massage">شموع المساج</option>
<option value="gift">الهدايا</option>
<option value="bride">بوكس العروسة</option>
</select>
</div>
<div><label>الصورة (اسم الملف في الريبو أو رابط)</label><input id="pf_img"></div>
</div>
<div class="g">
<div><label>بادج عربي (اختياري)</label><input id="pf_badge" placeholder="خصم / الأكثر مبيعًا"></div>
<div><label>مدة الاشتعال</label><input id="pf_hours" placeholder="72 ساعة اشتعال"></div>
</div>
<label>الوصف العربي</label><textarea id="pf_desc" rows="3"></textarea>
<label>الوصف الإنجليزي</label><textarea id="pf_descEn" rows="2"></textarea>
<label>العطور المتاحة (افصل بفاصلة)</label><input id="pf_scents" placeholder="عود, فانيليا, مسك أبيض">
<div style="display:flex;gap:.6rem;margin-top:1rem">
<button class="btn sm" id="saveProductBtn">💾 حفظ المنتج</button>
<button class="btn ghost sm" id="cancelProductBtn">إلغاء</button>
</div>
</div>

<table class="adm">
<thead><tr><th></th><th>المنتج</th><th>التصنيف</th><th>السعر</th><th>ظهور</th><th>إجراءات</th></tr></thead>
<tbody id="productsBody"></tbody>
</table>
</div>

<div id="tab-reviews" class="hidden">
<table class="adm">
<thead><tr><th>الاسم</th><th>المنتج</th><th>التقييم</th><th>المراجعة</th><th>إجراءات</th></tr></thead>
<tbody id="reviewsBody"></tbody>
</table>
</div>

</div>
</div>

<div id="toasts"></div>

<script src="data.js"></script>
<script type="module" src="firebase.js"></script>
<script>
(function(){
"use strict";

let loggedIn=false;

document.addEventListener("DOMContentLoaded",()=>{
checkAuth();
initTabs();
initProductForm();
});

window.addEventListener("fb-ready",()=>{
if(sessionStorage.getItem("vl_admin")==="1"){
showAdmin();
}
});

function checkAuth(){
if(window.FB&&window.FB.authUser()){
loggedIn=true;
showAdmin();
}
}

function showAdmin(){
loggedIn=true;
sessionStorage.setItem("vl_admin","1");
$("#loginScreen").classList.add("hidden");
$("#adminScreen").classList.remove("hidden");
loadOrders();
loadProducts();
loadReviews();
}

/* ═══ تسجيل الدخول ═══ */
document.addEventListener("click",e=>{
if(e.target.id==="loginBtn"){
const email=$("#loginEmail").value.trim();
const pass=$("#loginPass").value;
if(!email||!pass){$("#loginErr").textContent="⚠️ اكتب الإيميل والباسورد";return}
$("#loginErr").textContent="";
$("#loginBtn").textContent="⏳ جاري الدخول...";

if(window.FB&&window.FB.admin){
window.FB.admin(email,pass).then(()=>{
showAdmin();
}).catch(err=>{
$("#loginErr").textContent="❌ الإيميل أو الباسورد غير صحيح";
$("#loginBtn").textContent="تسجيل الدخول";
});
}else{
$("#loginErr").textContent="⚠️ Firebase لم يتم تحميله بعد، جرب تاني";
$("#loginBtn").textContent="تسجيل الدخول";
}
}
if(e.target.id==="logoutBtn"){
sessionStorage.removeItem("vl_admin");
if(window.FB&&window.FB.auth)window.FB.auth.signOut();
location.reload();
}
});

/* ═══ التبويبات ═══ */
function initTabs(){
$$(".adm-tabs button").forEach(b=>b.addEventListener("click",()=>{
$$(".adm-tabs button").forEach(x=>{x.classList.remove("on");x.classList.add("ghost")});
b.classList.add("on");b.classList.remove("ghost");
const tab=b.dataset.tab;
$("#tab-orders").classList.toggle("hidden",tab!=="orders");
$("#tab-products").classList.toggle("hidden",tab!=="products");
$("#tab-reviews").classList.toggle("hidden",tab!=="reviews");
}));
}

/* ═══ الطلبات ═══ */
function loadOrders(){
if(!window.FB)return;
window.FB.watch("orders",orders=>{
orders.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
$("#stOrders").textContent=orders.length;
const rev=orders.reduce((a,o)=>a+(o.total||0),0);
$("#stRevenue").textContent=money(rev);

$("#ordersBody").innerHTML=orders.map(o=>{
const d=o.createdAt?new Date(o.createdAt).toLocaleDateString("ar-EG"):"-";
const stOpts=STATUS.map((s,i)=>`<option value="${i}"${o.status===i?" selected":""}>${s}</option>`).join("");
return `<tr>
<td style="direction:ltr;font-size:.78rem">${o.id||"-"}</td>
<td>${d}</td>
<td>${o.name||"-"}</td>
<td style="direction:ltr">${o.phone||"-"}</td>
<td>${money(o.total||0)}</td>
<td><select data-oid="${o._fid||o.id}">${stOpts}</select></td>
</tr>`;
}).join("");

$$("#ordersBody select").forEach(s=>s.addEventListener("change",()=>{
window.FB.update("orders",s.dataset.oid,{status:+s.value}).then(()=>toast("✅ تم تحديث الحالة")).catch(()=>toast("⚠️ فشل التحديث"));
}));
});
}

/* ═══ المنتجات ═══ */
function loadProducts(){
if(!window.FB)return;
window.FB.list("products").then(cloud=>{
const map=new Map(PRODUCTS.map(p=>[p.id,{...p,_fid:null}]));
(cloud||[]).forEach(d=>{
const slug=d.id_||d.slug||d.pid;
if(!slug)return;
if(d.active===false){map.delete(slug);return}
map.set(slug,{...(map.get(slug)||{}),...d,id:slug,_fid:d.id});
});
const list=[...map.values()];
$("#stProducts").textContent=list.length;

$("#productsBody").innerHTML=list.map(p=>`<tr>
<td><img class="adm-thumb" src="${imgOf(p)}" alt=""></td>
<td><b>${p.name||""}</b><br><small style="color:var(--dim);font-size:.7rem">ID: ${p.id}</small></td>
<td>${CATS.ar[p.cat]||p.cat||""}</td>
<td>${money(p.price||0)}</td>
<td>${p.active===false?"❌ مخفي":"✅ ظاهر"}</td>
<td style="display:flex;gap:.3rem;flex-wrap:wrap">
<button class="btn sm ghost" data-edit="${p.id}">✏️ تعديل</button>
<button class="btn sm ghost" data-toggle="${p.id}" data-fid="${p._fid||""}" data-active="${p.active!==false}">${p.active===false?"👁️ إظهار":"🙈 إخفاء"}</button>
<button class="btn sm danger" data-del="${p.id}" data-fid="${p._fid||""}">🗑️</button>
</td>
</tr>`).join("");

bindProductActions(list);
}).catch(e=>console.warn(e));
}

function bindProductActions(list){
$$("#productsBody [data-edit]").forEach(b=>b.addEventListener("click",()=>{
const p=list.find(x=>x.id===b.dataset.edit);
if(p)openProductForm(p);
}));
$$("#productsBody [data-toggle]").forEach(b=>b.addEventListener("click",()=>{
const fid=b.dataset.fid;
const id=b.dataset.toggle;
const newActive=b.dataset.active!=="true";
if(fid){
window.FB.update("products",fid,{active:newActive}).then(()=>{toast(newActive?"👁️ تم الإظهار":"🙈 تم الإخفاء");loadProducts()}).catch(()=>toast("⚠️ فشل"));
}else{
window.FB.set("products",id,{id_:id,active:newActive}).then(()=>{toast(newActive?"👁️ تم الإظهار":"🙈 تم الإخفاء");loadProducts()}).catch(()=>toast("⚠️ فشل"));
}
}));
$$("#productsBody [data-del]").forEach(b=>b.addEventListener("click",()=>{
if(!confirm("متأكدة إنك عايزة تحذفي/تخفي المنتج ده؟"))return;
const fid=b.dataset.fid;
const id=b.dataset.del;
if(fid){
window.FB.update("products",fid,{active:false}).then(()=>{toast("🗑️ تم الإخفاء");loadProducts()}).catch(()=>toast("⚠️ فشل"));
}else{
window.FB.set("products",id,{id_:id,active:false}).then(()=>{toast("🗑️ تم الإخفاء");loadProducts()}).catch(()=>toast("⚠️ فشل"));
}
}));
}

/* ═══ فورم المنتج ═══ */
function initProductForm(){
$("#addProductBtn")?.addEventListener("click",()=>openProductForm(null));
$("#cancelProductBtn")?.addEventListener("click",()=>$("#productForm").classList.add("hidden"));

$("#saveProductBtn")?.addEventListener("click",()=>{
const name=$("#pf_name").value.trim();
const nameEn=$("#pf_nameEn").value.trim();
const price=+($("#pf_price").value||0);
if(!name||!nameEn||price<=0){toast("⚠️ كمّل الحقول المطلوبة (*)");return}

const existingId=$("#productForm").dataset.editId||"";
const scents=$("#pf_scents").value.split(",").map(s=>s.trim()).filter(Boolean);

const data={
name,nameEn,price,
old:+($("#pf_old").value||0),
cat:$("#pf_cat").value,
img:$("#pf_img").value.trim(),
badge:$("#pf_badge").value.trim(),
badgeEn:$("#pf_badge").value.trim(),
hours:$("#pf_hours").value.trim(),
hoursEn:$("#pf_hours").value.trim(),
desc:$("#pf_desc").value.trim(),
descEn:$("#pf_descEn").value.trim(),
scents,
active:true
};

if(existingId){
data.id_=existingId;
window.FB.set("products",existingId,data).then(()=>{
toast("💾 تم حفظ المنتج");
$("#productForm").classList.add("hidden");
loadProducts();
}).catch(e=>{console.error(e);toast("⚠️ فشل الحفظ — راجع Firestore Rules")});
}else{
const newId="p"+Date.now().toString(36)+Math.random().toString(16).slice(2,5);
data.id_=newId;
data.createdAt=Date.now();
data.sold=0;
window.FB.set("products",newId,data).then(()=>{
toast("💾 تم حفظ المنتج");
$("#productForm").classList.add("hidden");
loadProducts();
}).catch(e=>{console.error(e);toast("⚠️ فشل الحفظ — راجع Firestore Rules")});
}
});
}

function openProductForm(p){
const f=$("#productForm");
f.classList.remove("hidden");
if(p){
f.dataset.editId=p.id;
$("#formTitle").textContent="تعديل: "+(p.name||"");
$("#pf_name").value=p.name||"";
$("#pf_nameEn").value=p.nameEn||"";
$("#pf_price").value=p.price||"";
$("#pf_old").value=p.old||"";
$("#pf_cat").value=p.cat||"wood";
$("#pf_img").value=p.img||"";
$("#pf_badge").value=p.badge||"";
$("#pf_hours").value=p.hours||"";
$("#pf_desc").value=p.desc||"";
$("#pf_descEn").value=p.descEn||"";
$("#pf_scents").value=(p.scents||[]).join(", ");
}else{
f.dataset.editId="";
$("#formTitle").textContent="منتج جديد";
["pf_name","pf_nameEn","pf_price","pf_old","pf_img","pf_badge","pf_hours","pf_desc","pf_descEn","pf_scents"].forEach(id=>$("#"+id).value="");
$("#pf_cat").value="wood";
}
f.scrollIntoView({behavior:"smooth"});
}

/* ═══ المراجعات ═══ */
function loadReviews(){
if(!window.FB)return;
window.FB.list("reviews").then(revs=>{
$("#stReviews").textContent=revs.length;
$("#reviewsBody").innerHTML=revs.map(r=>`<tr>
<td>${r.name||"-"}</td>
<td>${r.productSlug||r.pid||"-"}</td>
<td>${"★".repeat(r.rating||5)}</td>
<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis">${r.text||""}</td>
<td style="display:flex;gap:.3rem">
${r.approved!==true?`<button class="btn sm" data-approve="${r.id}">✅ موافقة</button>`:"<span style='color:var(--ok)'>✅</span>"}
<button class="btn sm danger" data-delrev="${r.id}">🗑️</button>
</td>
</tr>`).join("");

$$("#reviewsBody [data-approve]").forEach(b=>b.addEventListener("click",()=>{
window.FB.update("reviews",b.dataset.approve,{approved:true}).then(()=>{toast("✅ تم الموافقة");loadReviews()}).catch(()=>toast("⚠️ فشل"));
}));
$$("#reviewsBody [data-delrev]").forEach(b=>b.addEventListener("click",()=>{
if(!confirm("حذف المراجعة؟"))return;
window.FB.remove("reviews",b.dataset.delrev).then(()=>{toast("🗑️ تم الحذف");loadReviews()}).catch(()=>toast("⚠️ فشل"));
}));
}).catch(e=>console.warn(e));
}

})();
</script>
</body>
</html>
