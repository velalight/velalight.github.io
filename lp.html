<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منتج | VelaLight</title>
  <meta property="og:type" content="product">
  <meta property="og:site_name" content="VelaLight">
  <meta property="og:title" content="منتج | VelaLight">
  <meta property="og:description" content="شموع يدوية فاخرة">
  <meta property="og:image" content="https://velalight.github.io/RRRR.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&family=El+Messiri:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK (النسخة 9 compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  
  <style>
    /* ===== نفس أنماط product.html ===== */
    :root {
      --bg: #faf6f0;
      --panel: #fff;
      --ink: #1a1512;
      --gold: #d9ab5f;
      --gold2: #b8863f;
      --mut: #5a4a3a;
      --line: rgba(0,0,0,.1);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding-bottom: 100px;
    }
    .container { width: min(1180px, 92%); margin: auto; }
    
    /* ===== الهيدر ===== */
    .header {
      background: var(--panel);
      padding: 1rem 0;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-family: 'El Messiri', serif;
      font-size: 1.3rem;
      font-weight: 700;
    }
    .back-link { color: var(--gold2); text-decoration: none; }
    
    /* ===== تخطيط الصفحة ===== */
    .layout {
      display: flex;
      gap: 2rem;
      margin-top: 1.5rem;
    }
    .gallery {
      flex: 1;
      position: sticky;
      top: 80px;
    }
    .main-img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      border-radius: 16px;
      background: #f5efe5;
    }
    .thumbs {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.8rem;
      overflow-x: auto;
    }
    .thumb {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 10px;
      cursor: pointer;
      border: 2px solid transparent;
      opacity: 0.6;
      flex-shrink: 0;
    }
    .thumb.on { border-color: var(--gold); opacity: 1; }
    
    .info { flex: 1; }
    h1 {
      font-family: 'El Messiri', serif;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    .price {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--gold2);
      margin-bottom: 1rem;
    }
    .old-price {
      text-decoration: line-through;
      color: #aaa;
      font-size: 1.2rem;
      font-weight: 400;
      margin-right: 0.5rem;
    }
    .desc {
      color: var(--mut);
      line-height: 1.8;
      margin-bottom: 1.5rem;
      white-space: pre-line;
    }
    
    /* ===== صندوق العطور ===== */
    .scent-box {
      background: var(--panel);
      padding: 1rem;
      border-radius: 12px;
      border: 1px solid var(--line);
      margin: 1.5rem 0;
    }
    .scent-box label {
      display: block;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .scent-box select {
      width: 100%;
      padding: 0.9rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 1rem;
      background: #fff;
    }
    
    /* ===== الأزرار ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-weight: 800;
      padding: 0.9rem 1.5rem;
      border-radius: 99px;
      margin: 0.5rem 0.3rem 0 0;
      cursor: pointer;
      border: none;
      font-size: 1rem;
      transition: 0.3s;
      text-decoration: none;
      color: #fff;
    }
    .btn-wa { background: #25D366; }
    .btn-wa:hover { background: #1da851; }
    .btn-cart { background: var(--gold); }
    .btn-cart:hover { background: var(--gold2); }
    
    /* ===== الشريط السفلي الثابت ===== */
    .sticky {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--panel);
      border-top: 1px solid var(--line);
      padding: 0.8rem;
      display: none;
      gap: 0.8rem;
      align-items: center;
      box-shadow: 0 -4px 20px rgba(0,0,0,.1);
      z-index: 100;
    }
    .sticky-price {
      font-weight: 800;
      font-size: 1.2rem;
      color: var(--gold2);
      white-space: nowrap;
    }
    .sticky .btn {
      padding: 0.7rem 1rem;
      font-size: 0.9rem;
      margin: 0;
      flex: 1;
    }
    
    /* ===== رسائل الحالة ===== */
    .loading, .error {
      text-align: center;
      padding: 3rem;
      font-size: 1.3rem;
      color: var(--mut);
    }
    .error { color: #c0392b; }
    
    /* ===== التجاوب ===== */
    @media (max-width: 768px) {
      .layout { flex-direction: column; }
      .gallery { position: static; }
    }
  </style>
</head>
<body>

  <!-- ===== الهيدر ===== -->
  <header class="header">
    <div class="container">
      <div class="logo">VelaLight</div>
      <a href="https://velalight.github.io/" class="back-link">← العودة</a>
    </div>
  </header>

  <!-- ===== المحتوى الرئيسي ===== -->
  <main class="container" id="main">
    <div class="loading">⏳ جاري تحميل المنتج...</div>
  </main>

  <!-- ===== الشريط السفلي الثابت ===== -->
  <div class="sticky" id="sticky">
    <div class="sticky-price" id="sPrice">0 ج.م</div>
    <button class="btn btn-cart" id="sCart">أضيفي للسلة</button>
    <a href="#" class="btn btn-wa" id="sWa" target="_blank">واتساب</a>
  </div>

  <script>
    // ================================================================
    // 1️⃣ إعدادات Firebase - 🔥 استبدل هذه القيم بقيم مشروعك من Firebase
    // ================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyB3...",          // ⚠️ ضع المفتاح الصحيح هنا
      authDomain: "your-project.firebaseapp.com",
      databaseURL: "https://your-project-default-rtdb.firebaseio.com/",
      projectId: "your-project",
      storageBucket: "your-project.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    // تهيئة Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ================================================================
    // 2️⃣ قراءة ID المنتج من الرابط
    // ================================================================
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id') || urlParams.get('product');

    // ================================================================
    // 3️⃣ المتغيرات العامة
    // ================================================================
    let currentProduct = null;
    let selectedScent = '';
    const WA_NUMBER = '201223526105'; // رقم واتساب - غيّره حسب رغبتك

    // ================================================================
    // 4️⃣ جلب المنتج من Firebase وعرضه
    // ================================================================
    async function loadProduct() {
      const mainEl = document.getElementById('main');
      
      // التحقق من وجود ID في الرابط
      if (!productId) {
        mainEl.innerHTML = `<div class="error">❌ لم يتم تحديد المنتج. أضف ?id=رقم_المنتج في الرابط.</div>`;
        return;
      }

      try {
        // جلب جميع المنتجات من Firebase
        const snapshot = await db.ref('products').once('value');
        const data = snapshot.val();
        
        if (!data) {
          mainEl.innerHTML = `<div class="error">❌ لا توجد منتجات في قاعدة البيانات.</div>`;
          return;
        }

        // البحث عن المنتج بالـ id (يدعم id أو id_ أو مفتاح العقدة)
        let product = null;
        for (const key in data) {
          const item = data[key];
          if (String(item.id || item.id_ || key) === String(productId)) {
            product = { ...item, firebaseKey: key };
            break;
          }
        }

        if (!product) {
          mainEl.innerHTML = `<div class="error">❌ المنتج برقم ${productId} غير موجود.</div>`;
          return;
        }

        currentProduct = product;
        renderProduct(product);
        document.getElementById('sticky').style.display = 'flex';

      } catch (err) {
        console.error('خطأ في جلب البيانات:', err);
        mainEl.innerHTML = `<div class="error">❌ حدث خطأ في الاتصال بقاعدة البيانات: ${err.message}</div>`;
      }
    }

    // ================================================================
    // 5️⃣ عرض المنتج في الصفحة (بنفس هيكل product.html)
    // ================================================================
    function renderProduct(p) {
      // --- تجميع الصور ---
      let images = [];
      if (p.imgs && Array.isArray(p.imgs)) images = p.imgs;
      else if (p.images && Array.isArray(p.images)) images = p.images;
      else if (p.img) {
        if (typeof p.img === 'string' && p.img.includes(',')) {
          images = p.img.split(',').map(s => s.trim());
        } else {
          images = [p.img];
        }
      }
      if (images.length === 0) images = ['placeholder.jpg'];

      // تصحيح المسارات (إضافة domain إذا كان الرابط نسبيًا)
      const fullImages = images.map(src => 
        src.startsWith('http') ? src : `https://velalight.github.io/${src}`
      );
      const mainImg = fullImages[0] || '';

      // --- بناء HTML ---
      const html = `
        <div class="layout">
          <div class="gallery">
            <img src="${mainImg}" class="main-img" alt="${p.name || 'منتج'}" id="mainImg">
            ${fullImages.length > 1 ? `
              <div class="thumbs">
                ${fullImages.map((src, i) => `
                  <img src="${src}" class="thumb ${i===0?'on':''}" onclick="changeImage('${src}', this)">
                `).join('')}
              </div>
            ` : ''}
          </div>
          <div class="info">
            <h1>${p.name || 'منتج'}</h1>
            <div class="price">
              ${p.price || 0} ج.م
              ${p.old ? `<span class="old-price">${p.old} ج.م</span>` : ''}
            </div>
            <div class="desc">${p.desc || ''}</div>
            
            <div class="scent-box">
              <label for="scentSelect">✨ اختاري العطر</label>
              <select id="scentSelect" onchange="selectedScent=this.value; updateWaLinks()">
                <option value="">-- اختار العطر --</option>
                ${(p.scents || []).map(s => `<option value="${s}">${s}</option>`).join('')}
              </select>
            </div>

            <div>
              <button class="btn btn-cart" onclick="addToCart()">🛒 أضيفي للسلة</button>
              <a href="#" class="btn btn-wa" id="waBtn" target="_blank">📱 اطلبي عبر واتساب</a>
            </div>
          </div>
        </div>
      `;

      document.getElementById('main').innerHTML = html;
      
      // تحديث الشريط السفلي
      document.getElementById('sPrice').textContent = `${p.price || 0} ج.م`;
      
      // ربط أزرار الشريط السفلي
      document.getElementById('sCart').onclick = addToCart;
      document.getElementById('sWa').onclick = function(e) {
        e.preventDefault();
        window.open(this.href, '_blank');
      };

      // تحديث روابط واتساب
      updateWaLinks();

      // تغيير عنوان الصفحة
      document.title = `${p.name || 'منتج'} | VelaLight`;
    }

    // ================================================================
    // 6️⃣ تغيير الصورة الرئيسية عند النقر على الصورة المصغرة
    // ================================================================
    function changeImage(src, el) {
      document.getElementById('mainImg').src = src;
      document.querySelectorAll('.thumb').forEach(t => t.classList.remove('on'));
      el.classList.add('on');
    }

    // ================================================================
    // 7️⃣ تحديث روابط واتساب (في الزر الرئيسي والشريط السفلي)
    // ================================================================
    function updateWaLinks() {
      if (!currentProduct) return;
      const name = currentProduct.name || 'منتج';
      const price = currentProduct.price || 0;
      const scent = selectedScent || 'لم يختار';
      const msg = encodeURIComponent(`أريد طلب ${name} بسعر ${price} ج.م\nالعطر: ${scent}`);
      const link = `https://wa.me/${WA_NUMBER}?text=${msg}`;
      
      const waBtn = document.getElementById('waBtn');
      const sWa = document.getElementById('sWa');
      if (waBtn) waBtn.href = link;
      if (sWa) sWa.href = link;
    }

    // ================================================================
    // 8️⃣ إضافة للسلة
    // ================================================================
    function addToCart() {
      if (!currentProduct) return;
      if (!selectedScent) {
        alert('⚠️ من فضلك اختاري العطر أولاً');
        document.getElementById('scentSelect')?.focus();
        return;
      }
      
      // يمكنك هنا استدعاء دالة الإضافة من data.js إذا كانت موجودة
      // أو تنفيذ منطقك الخاص (مثل التخزين في localStorage)
      
      alert(`✅ تم إضافة ${currentProduct.name} (العطر: ${selectedScent}) إلى السلة`);
      
      // اختياري: فتح واتساب مباشرة لإتمام الطلب
      // document.getElementById('waBtn')?.click();
    }

    // ================================================================
    // 9️⃣ تشغيل التطبيق عند تحميل الصفحة
    // ================================================================
    window.addEventListener('DOMContentLoaded', loadProduct);
  </script>
</body>
</html>
