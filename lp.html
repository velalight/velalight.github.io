<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منتج | VelaLight</title>
  <meta property="og:type" content="product">
  <meta property="og:site_name" content="VelaLight">
  <meta property="og:title" content="منتج | VelaLight">
  <meta property="og:description" content="شموع يدوية فاخرة">
  <meta property="og:image" content="https://velalight.github.io/RRRR.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&family=El+Messiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#faf6f0; --panel:#fff; --ink:#1a1512; --gold:#d9ab5f; --gold2:#b8863f; --mut:#5a4a3a; --line:rgba(0,0,0,.1); }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Tajawal',sans-serif; background:var(--bg); color:var(--ink); padding-bottom:100px; }
    .container { width:min(1180px,92%); margin:auto; }
    .header { background:var(--panel); padding:1rem 0; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:50; }
    .header .container { display:flex; justify-content:space-between; align-items:center; }
    .logo { font-family:'El Messiri',serif; font-size:1.3rem; font-weight:700; }
    .layout { display:flex; gap:2rem; margin-top:1.5rem; }
    .gallery { flex:1; position:sticky; top:80px; }
    .main-img { width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:16px; background:#f5efe5; }
    .thumbs { display:flex; gap:0.5rem; margin-top:0.8rem; overflow-x:auto; }
    .thumb { width:70px; height:70px; object-fit:cover; border-radius:10px; cursor:pointer; border:2px solid transparent; opacity:0.6; }
    .thumb.on { border-color:var(--gold); opacity:1; }
    .info { flex:1; }
    h1 { font-family:'El Messiri',serif; font-size:2rem; margin-bottom:0.5rem; }
    .price { font-size:1.8rem; font-weight:800; color:var(--gold2); margin-bottom:1rem; }
    .desc { color:var(--mut); line-height:1.8; margin-bottom:1.5rem; white-space:pre-line; }
    .scent-box { background:var(--panel); padding:1rem; border-radius:12px; border:1px solid var(--line); margin:1.5rem 0; }
    .scent-box label { display:block; font-weight:700; margin-bottom:0.5rem; }
    .scent-box select { width:100%; padding:0.9rem; border:1px solid var(--line); border-radius:10px; font-size:1rem; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:0.5rem; font-weight:800; padding:0.9rem 1.5rem; border-radius:99px; margin:0.5rem 0.3rem 0 0; cursor:pointer; border:none; font-size:1rem; transition:0.3s; }
    .btn-wa { background:#25D366; color:#fff; }
    .btn-cart { background:var(--gold); color:#fff; }
    .sticky { position:fixed; bottom:0; left:0; right:0; background:var(--panel); border-top:1px solid var(--line); padding:0.8rem; display:flex; gap:0.8rem; align-items:center; box-shadow:0 -4px 20px rgba(0,0,0,.1); z-index:100; }
    .sticky-price { font-weight:800; font-size:1.2rem; color:var(--gold2); white-space:nowrap; }
    .sticky .btn { padding:0.7rem 1rem; font-size:0.9rem; margin:0; flex:1; }
    @media(max-width:768px) { .layout { flex-direction:column; } .gallery { position:static; } }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="logo">VelaLight</div>
      <a href="https://velalight.github.io/" style="color:var(--gold2)">← العودة</a>
    </div>
  </header>

  <main class="container" id="main">
    <div style="text-align:center;padding:3rem">جاري التحميل...</div>
  </main>

  <div class="sticky" id="sticky" style="display:none">
    <div class="sticky-price" id="sPrice">0 ج.م</div>
    <button class="btn btn-cart" id="sCart">أضيفي للسلة</button>
    <a href="#" class="btn btn-wa" id="sWa" target="_blank">واتساب</a>
  </div>

  <script src="data.js?v=13"></script>
  <script>
    const pid = new URLSearchParams(window.location.search).get('id');
    let selScent = '';

    // 🔥 انتظار تحميل data.js تماماً
    window.addEventListener('load', async () => {
      try {
        // محاولة تحميل من Firebase لو موجود
        let P = null;
        if (window.DB && typeof DB.list === 'function') {
          try {
            const products = await DB.list('products');
            P = products.find(x => String(x.id) === String(pid) || String(x.id_) === String(pid));
          } catch(e) { console.log('Firebase error:', e); }
        }
        
        // لو مفيش Firebase، دور في PRODUCTS
        if (!P && typeof PRODUCTS !== 'undefined') {
          P = PRODUCTS.find(x => String(x.id) === String(pid));
        }

        if (!P) {
          document.getElementById('main').innerHTML = '<div style="text-align:center;padding:3rem"><h2>المنتج مش موجود</h2><a href="https://velalight.github.io/" class="btn btn-cart">العودة</a></div>';
          return;
        }

        // جلب الصور
        const imgs = [];
        if (P.imgs && Array.isArray(P.imgs)) imgs.push(...P.imgs);
        else if (P.images && Array.isArray(P.images)) imgs.push(...P.images);
        else if (P.img) {
          if (typeof P.img === 'string' && P.img.includes(',')) imgs.push(...P.img.split(',').map(s=>s.trim()));
          else imgs.push(P.img);
        }

        const mainImg = imgs[0] || '';
        const imgUrl = mainImg.startsWith('http') ? mainImg : `https://velalight.github.io/${mainImg}`;
        const name = P.name || 'منتج';
        const price = P.price || 0;
        const desc = P.desc || '';
        const scents = P.scents || [];
        
        // تحديث العنوان
        document.title = `${name} | VelaLight`;

        // بناء HTML
        let html = `<div class="layout">
          <div class="gallery">
            <img src="${imgUrl}" class="main-img" alt="${name}" id="mainImg">
            ${imgs.length > 1 ? `<div class="thumbs">${imgs.map((img,i) => {
              const src = img.startsWith('http') ? img : `https://velalight.github.io/${img}`;
              return `<img src="${src}" class="thumb ${i===0?'on':''}" onclick="chgImg('${src}',this)">`;
            }).join('')}</div>` : ''}
          </div>
          <div class="info">
            <h1>${name}</h1>
            <div class="price">${price} ج.م</div>
            <div class="desc">${desc}</div>
            
            <div class="scent-box">
              <label> اختاري العطر</label>
              <select id="scent" onchange="selScent=this.value;updWa()">
                <option value="">-- اختار العطر --</option>
                ${scents.map(s => `<option value="${s}">${s}</option>`).join('')}
              </select>
            </div>

            <div>
              <button class="btn btn-cart" onclick="addToCart()">أضيفي للسلة</button>
              <a href="#" class="btn btn-wa" id="waBtn" target="_blank">اطلبي عبر واتساب</a>
            </div>
          </div>
        </div>`;

        document.getElementById('main').innerHTML = html;
        document.getElementById('sticky').style.display = 'flex';
        document.getElementById('sPrice').textContent = `${price} ج.م`;
        updWa();
        
        document.getElementById('sCart').onclick = addToCart;

      } catch(err) {
        console.error('Error:', err);
        document.getElementById('main').innerHTML = '<div style="text-align:center;padding:3rem;color:red">حدث خطأ في تحميل الصفحة</div>';
      }
    });

    function chgImg(src, el) {
      document.getElementById('mainImg').src = src;
      document.querySelectorAll('.thumb').forEach(t => t.classList.remove('on'));
      el.classList.add('on');
    }

    function updWa() {
      const name = document.querySelector('h1')?.textContent || 'منتج';
      const price = document.querySelector('.price')?.textContent || '0';
      const scent = selScent || 'لم يختار';
      const msg = encodeURIComponent(`أريد طلب ${name} بسعر ${price}\nالعطر: ${scent}`);
      const link = `https://wa.me/201223526105?text=${msg}`;
      const waBtn = document.getElementById('waBtn');
      const sWa = document.getElementById('sWa');
      if (waBtn) waBtn.href = link;
      if (sWa) sWa.href = link;
    }

    function addToCart() {
      if (!selScent) {
        alert('من فضلك اختاري العطر أولاً');
        document.getElementById('scent').focus();
        return;
      }
      
      // محاولة استخدام addToCart من data.js لو موجود
      if (typeof addToCartGlobal === 'function' && typeof P !== 'undefined') {
        addToCartGlobal(P, {scent: selScent, qty: 1});
        alert('✅ تم الإضافة');
      } else {
        // لو مفيش، افتح واتساب مباشرة
        alert('سيتم تحويلك للواتساب لإتمام الطلب');
        document.getElementById('waBtn')?.click();
      }
    }
  </script>
</body>
</html>
