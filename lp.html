<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>منتج فاخر | VelaLight</title>
  <meta name="description" content="شموع يدوية فاخرة بعطور مميزة - صناعة يدوية 100%">
  <meta property="og:type" content="product">
  <meta property="og:site_name" content="VelaLight">
  <meta property="og:title" content="منتج فاخر | VelaLight">
  <meta property="og:description" content="اكتشف مجموعتنا الفاخرة من الشموع اليدوية.">
  <meta property="og:image" content="https://velalight.github.io/RRRR.jpg">
  <meta property="og:url" content="https://velalight.github.io/lp.html">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=El+Messiri:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #faf6f0; --bg2: #f5efe5; --panel: #ffffff; --ink: #1a1512; --mut: #5a4a3a; --dim: #8a7a64;
      --gold: #d9ab5f; --gold2: #b8863f; --amber: #ff9d45; --ok: #4a8a5c; --bad: #c24a3a;
      --line: rgba(26,21,18,.10);
      --ff: 'Tajawal', sans-serif; --fd: 'El Messiri', serif;
      --sh: 0 10px 30px -12px rgba(100,70,30,.12);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--ff); background: var(--bg); color: var(--ink); line-height: 1.7; overflow-x: hidden; padding-bottom: 100px; }
    img { max-width: 100%; height: auto; display: block; }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
    .container { width: min(1180px, 92%); margin-inline: auto; }

    /* Header */
    .lp-header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 0.8rem 0; position: sticky; top: 0; z-index: 50; backdrop-filter: blur(10px); background: rgba(250,246,240,0.95); }
    .lp-header .container { display: flex; justify-content: space-between; align-items: center; }
    .lp-logo { font-family: var(--fd); font-size: 1.3rem; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 0.3rem; }
    .back-link { font-size: 0.85rem; color: var(--gold2); font-weight: 600; transition: 0.3s; }
    .back-link:hover { color: var(--gold); }

    /* Loading */
    .loading { text-align: center; padding: 4rem 1rem; }
    .loading-spinner { width: 50px; height: 50px; border: 4px solid var(--bg2); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Hero Layout */
    .hero-layout { display: flex; gap: 2rem; margin-top: 1.5rem; align-items: flex-start; }
    
    /* Gallery */
    .gallery-wrap { flex: 1; position: sticky; top: 80px; }
    .main-img-wrap { position: relative; background: var(--bg2); border-radius: 16px; overflow: hidden; aspect-ratio: 1/1; box-shadow: var(--sh); }
    .main-img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
    .main-img:hover { transform: scale(1.02); }
    .badge-overlay { position: absolute; top: 12px; inset-inline-start: 12px; background: linear-gradient(135deg, var(--gold), #b8863f); color: #fff; font-size: 0.75rem; font-weight: 800; padding: 0.3rem 0.8rem; border-radius: 99px; z-index: 2; }
    .thumbs { display: flex; gap: 0.5rem; margin-top: 0.8rem; overflow-x: auto; padding-bottom: 0.5rem; }
    .thumb { width: 70px; height: 70px; object-fit: cover; border-radius: 10px; cursor: pointer; border: 2px solid transparent; opacity: 0.7; transition: 0.3s; flex-shrink: 0; background: var(--bg2); }
    .thumb.active { border-color: var(--gold); opacity: 1; }
    .thumb:hover { opacity: 1; }

    /* Product Info */
    .product-info { flex: 1; padding: 0 0 2rem; }
    .product-info h1 { font-family: var(--fd); font-size: clamp(1.6rem, 4vw, 2.2rem); color: var(--ink); margin-bottom: 0.5rem; line-height: 1.3; }
    .price-wrap { display: flex; align-items: baseline; gap: 0.8rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .price { font-size: 1.8rem; font-weight: 800; color: var(--gold2); }
    .old-price { font-size: 1.1rem; color: var(--dim); text-decoration: line-through; }
    .discount-badge { background: var(--ok); color: #fff; padding: 0.2rem 0.6rem; border-radius: 6px; font-size: 0.8rem; font-weight: 700; }
    .desc { color: var(--mut); font-size: 1rem; margin-bottom: 1.5rem; line-height: 1.8; }

    /* Features Grid */
    .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.8rem; margin: 1.5rem 0; }
    .feature-box { background: var(--panel); padding: 0.8rem; border-radius: 12px; border: 1px solid var(--line); text-align: center; }
    .feature-box .icon { font-size: 1.3rem; margin-bottom: 0.3rem; }
    .feature-box h4 { font-family: var(--fd); font-size: 0.85rem; margin-bottom: 0.2rem; color: var(--ink); }
    .feature-box p { font-size: 0.75rem; color: var(--mut); }

    /* Scents */
    .scents-section { margin: 2rem 0; }
    .scents-section h3 { font-family: var(--fd); font-size: 1.2rem; margin-bottom: 0.8rem; color: var(--ink); }
    .scents-section h3::before { content: "🌸 "; }
    .scent-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .scent-tag { background: rgba(217,171,95,0.1); color: var(--gold2); padding: 0.4rem 0.9rem; border-radius: 99px; font-weight: 600; font-size: 0.85rem; border: 1px solid rgba(217,171,95,0.3); transition: 0.3s; }
    .scent-tag:hover { background: var(--gold); color: #fff; }

    /* Actions */
    .actions { display: flex; gap: 0.8rem; margin: 2rem 0; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; font-weight: 800; padding: 0.9rem 1.5rem; border-radius: 99px; font-size: 1rem; transition: 0.3s; flex: 1; min-width: 140px; }
    .btn:active { transform: scale(0.98); }
    .btn-wa { background: linear-gradient(135deg, #25D366, #128C7E); color: #fff; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4); }
    .btn-wa:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6); }
    .btn-cart { background: linear-gradient(135deg, var(--gold), #b8863f); color: #fff; box-shadow: 0 4px 15px rgba(217,171,95,0.4); }
    .btn-cart:hover { transform: translateY(-2px); }
    .btn-wish { background: var(--panel); color: var(--gold2); border: 2px solid var(--gold); min-width: 50px; flex: 0; padding: 0.9rem; }
    .btn-wish:hover { background: var(--gold); color: #fff; }
    .btn-wish.active { background: var(--gold); color: #fff; }

    /* Specs */
    .specs-section { background: var(--panel); padding: 1.5rem; border-radius: 16px; border: 1px solid var(--line); margin: 2rem 0; }
    .specs-section h3 { font-family: var(--fd); font-size: 1.2rem; margin-bottom: 1rem; color: var(--ink); }
    .specs-section h3::before { content: "📋 "; }
    .spec-row { display: flex; justify-content: space-between; padding: 0.6rem 0; border-bottom: 1px solid var(--line); font-size: 0.95rem; }
    .spec-row:last-child { border-bottom: none; }
    .spec-label { color: var(--mut); font-weight: 600; }
    .spec-value { color: var(--ink); font-weight: 700; }

    /* Sticky Bottom Bar */
    .sticky-cta {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--panel); border-top: 1px solid var(--line);
      padding: 0.8rem 1rem; display: flex; align-items: center; gap: 0.8rem;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.08); z-index: 100;
    }
    .sticky-price { font-weight: 800; font-size: 1.2rem; color: var(--gold2); white-space: nowrap; }
    .sticky-btns { display: flex; gap: 0.5rem; flex: 1; }
    .sticky-btns .btn { padding: 0.7rem 1rem; font-size: 0.9rem; min-width: auto; }

    /* Toast */
    .toast-container { position: fixed; top: 80px; inset-inline-end: 1rem; z-index: 1000; display: flex; flex-direction: column; gap: 0.5rem; }
    .toast { background: var(--ink); color: #fff; padding: 0.8rem 1.2rem; border-radius: 10px; font-size: 0.9rem; box-shadow: var(--sh); animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

    /* Not Found */
    .not-found { text-align: center; padding: 4rem 1rem; }
    .not-found h2 { font-family: var(--fd); font-size: 1.8rem; margin-bottom: 1rem; color: var(--ink); }
    .not-found p { color: var(--mut); margin-bottom: 1.5rem; }

    @media (max-width: 768px) {
      body { padding-bottom: 120px; }
      .hero-layout { flex-direction: column; gap: 1.5rem; }
      .gallery-wrap { position: static; }
      .product-info { padding: 0; }
      .actions { flex-direction: column; }
      .btn { width: 100%; }
      .btn-wish { width: 100%; flex: 1; }
    }
  </style>
</head>
<body>

  <header class="lp-header">
    <div class="container">
      <div class="lp-logo">🕯️ VelaLight</div>
      <a href="https://velalight.github.io/" class="back-link">← <span data-i18n="back_home">العودة للمتجر</span></a>
    </div>
  </header>

  <main class="container" id="productContainer">
    <div class="loading">
      <div class="loading-spinner"></div>
      <p>جاري تحميل بيانات المنتج...</p>
    </div>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <!-- شريط الطلب الثابت للموبايل -->
  <div class="sticky-cta" id="stickyCta" style="display:none;">
    <div class="sticky-price" id="stickyPrice">0 ج.م</div>
    <div class="sticky-btns">
      <button class="btn btn-cart" id="stickyCartBtn">️ <span data-i18n="add_cart">أضيفي للسلة</span></button>
      <a href="#" class="btn btn-wa" id="stickyWaBtn" target="_blank" rel="noopener">💬 واتساب</a>
    </div>
  </div>

  <!-- استدعاء ملف البيانات الأساسي -->
  <script src="data.js?v=10"></script>
  
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    // دالة Toast
    function showToast(msg) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    // دالة الحصول على الصور
    function getImages(P) {
      if (P.imgs && Array.isArray(P.imgs) && P.imgs.length > 0) return P.imgs;
      if (P.images && Array.isArray(P.images) && P.images.length > 0) return P.images;
      if (P.img) {
        if (typeof P.img === 'string') {
          if (P.img.includes(',')) return P.img.split(',').map(s => s.trim());
          return [P.img];
        }
        if (Array.isArray(P.img)) return P.img;
      }
      return [];
    }

    // دالة الحصول على رابط الصورة
    function getImageUrl(img) {
      if (!img) return 'https://velalight.github.io/RRRR.jpg';
      if (img.startsWith('http')) return img;
      if (img.startsWith('data:')) return img;
      return `https://velalight.github.io/${img}`;
    }

    // دالة حساب نسبة الخصم
    function getDiscountPercent(P) {
      if (!P.old || P.old <= P.price) return 0;
      return Math.round(((P.old - P.price) / P.old) * 100);
    }

    window.addEventListener('DOMContentLoaded', async () => {
      // 🔥 انتظار تحميل البيانات من Firebase
      if (typeof loadAll === 'function') {
        await loadAll();
      }

      const P = ALL_PRODUCTS.find(p => String(p.id) === String(productId));

      if (!P) {
        document.getElementById('productContainer').innerHTML = `
          <div class="not-found">
            <h2>😕 عذراً، المنتج غير موجود</h2>
            <p>ربما تم إزالة هذا المنتج أو أن الرابط غير صحيح.</p>
            <a href="https://velalight.github.io/" class="btn btn-cart">العودة للمتجر الرئيسي</a>
          </div>`;
        return;
      }

      // تحديث وسوم Meta
      const images = getImages(P);
      const mainImgUrl = images.length > 0 ? getImageUrl(images[0]) : 'https://velalight.github.io/RRRR.jpg';
      const productName = pname(P);
      const productDesc = pdesc(P);
      
      document.title = `${productName} | VelaLight`;
      document.querySelector('meta[property="og:title"]').setAttribute("content", `${productName} | VelaLight`);
      document.querySelector('meta[property="og:description"]').setAttribute("content", productDesc);
      document.querySelector('meta[property="og:image"]').setAttribute("content", mainImgUrl);
      document.querySelector('meta[property="og:url"]').setAttribute("content", window.location.href);

      // بناء معرض الصور
      const thumbsHtml = images.length > 1 ? images.map((img, idx) => 
        `<img src="${getImageUrl(img)}" class="thumb ${idx === 0 ? 'active' : ''}" onclick="changeImage(this, '${getImageUrl(img)}')" alt="${productName} ${idx + 1}">`
      ).join('') : '';

      // بناء نوتات العطر (كل الـ 23 عطر)
      const allScentsHtml = SCENTS.map(s => {
        const scentName = LANG === 'en' ? s[1] : s[0];
        return `<span class="scent-tag">${scentName}</span>`;
      }).join('');

      // رابط الواتساب
      const waMessage = encodeURIComponent(`مرحباً، أريد طلب *${productName}* بسعر ${P.price} ج.م. يرجى تأكيد الطلب وتفاصيل الدفع.`);
      const waLink = `https://wa.me/201223526105?text=${waMessage}`;

      // نسبة الخصم
      const discountPercent = getDiscountPercent(P);
      const badgeText = pbadge(P);

      // حقن البيانات في HTML
      document.getElementById('productContainer').innerHTML = `
        <div class="hero-layout">
          <div class="gallery-wrap">
            <div class="main-img-wrap">
              ${badgeText ? `<div class="badge-overlay">${badgeText}</div>` : ''}
              <img id="mainImage" src="${mainImgUrl}" alt="${productName}" class="main-img" loading="eager">
            </div>
            ${images.length > 1 ? `<div class="thumbs">${thumbsHtml}</div>` : ''}
          </div>
          
          <div class="product-info">
            <h1>${productName}</h1>
            
            <div class="price-wrap">
              <span class="price">${money(P.price)}</span>
              ${P.old && P.old > P.price ? `
                <span class="old-price">${money(P.old)}</span>
                <span class="discount-badge">-${discountPercent}%</span>
              ` : ''}
            </div>

            <p class="desc">${productDesc}</p>

            <div class="features-grid">
              <div class="feature-box">
                <div class="icon">️</div>
                <h4>مدة الاشتعال</h4>
                <p>${phours(P)}</p>
              </div>
              <div class="feature-box">
                <div class="icon">🌿</div>
                <h4>الخامات</h4>
                <p>شمع صويا طبيعي 100%</p>
              </div>
              <div class="feature-box">
                <div class="icon">🎁</div>
                <h4>التغليف</h4>
                <p>فاخر ومجاني</p>
              </div>
              <div class="feature-box">
                <div class="icon">🚚</div>
                <h4>الشحن</h4>
                <p>لكل محافظات مصر</p>
              </div>
            </div>

            <div class="scents-section">
              <h3>العطور المتاحة (${SCENTS.length} عطر)</h3>
              <div class="scent-tags">${allScentsHtml}</div>
            </div>

            <div class="specs-section">
              <h3>المواصفات</h3>
              <div class="spec-row">
                <span class="spec-label">التصنيف</span>
                <span class="spec-value">${cat(P.cat)}</span>
              </div>
              <div class="spec-row">
                <span class="spec-label">مدة الاشتعال</span>
                <span class="spec-value">${phours(P)}</span>
              </div>
              <div class="spec-row">
                <span class="spec-label">نوع الشمع</span>
                <span class="spec-value">شمع صويا طبيعي 100%</span>
              </div>
              <div class="spec-row">
                <span class="spec-label">الصناعة</span>
                <span class="spec-value">يدوية 100%</span>
              </div>
            </div>

            <div class="actions">
              <button class="btn btn-cart" onclick="addToCartFromLP()">️ <span data-i18n="add_cart">أضيفي للسلة</span></button>
              <button class="btn btn-wish" id="wishBtn" onclick="toggleWishFromLP()">🤍</button>
              <a href="${waLink}" class="btn btn-wa" target="_blank" rel="noopener">💬 اطلبي عبر واتساب</a>
            </div>
          </div>
        </div>
      `;

      // تفعيل الشريط السفلي
      document.getElementById('stickyCta').style.display = 'flex';
      document.getElementById('stickyPrice').textContent = money(P.price);
      document.getElementById('stickyWaBtn').href = waLink;
      document.getElementById('stickyCartBtn').onclick = addToCartFromLP;

      // تحديث زر المفضلة
      updateWishButton();
    });

    // دالة تغيير الصورة
    function changeImage(thumb, newSrc) {
      document.getElementById('mainImage').src = newSrc;
      document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
      thumb.classList.add('active');
    }

    // دالة إضافة للسلة
    function addToCartFromLP() {
      const productId = urlParams.get('id');
      const P = ALL_PRODUCTS.find(p => String(p.id) === String(productId));
      if (!P) return;
      
      if (typeof addToCart === 'function') {
        addToCart(P, { qty: 1 });
        showToast('✅ تم الإضافة للسلة');
      }
    }

    // دالة المفضلة
    function toggleWishFromLP() {
      const productId = urlParams.get('id');
      if (typeof toggleWishlist === 'function') {
        const isInWish = toggleWishlist(productId);
        updateWishButton();
        showToast(isInWish ? '❤️ تم الإضافة للمفضلة' : '💔 تم الإزالة من المفضلة');
      }
    }

    function updateWishButton() {
      const productId = urlParams.get('id');
      const btn = document.getElementById('wishBtn');
      if (!btn) return;
      if (typeof isInWishlist === 'function' && isInWishlist(productId)) {
        btn.textContent = '❤️';
        btn.classList.add('active');
      } else {
        btn.textContent = '🤍';
        btn.classList.remove('active');
      }
    }
  </script>
</body>
</html>
