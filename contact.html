*{margin:0;padding:0;box-sizing:border-box;}
body{ font-family:'Tajawal',sans-serif; background:var(--cream); color:var(--cocoa); line-height:1.9; }

.contact-item{

text-align:right;
transition:.25s;
}
.contact-item:hover{ transform:translateY(-3px); box-shadow:0 12px 26px rgba(43,27,18,.1); }
.contact-item i{ font-size:22px; color:var(--brass); width:26px; text-align:center; }
.contact-item .label{ font-size:13px; color:#8a725c; }
.contact-item .value{ font-weight:bold; color:var(--espresso); }
.cta{
display:inline-block;
margin-top:20px;
padding:15px 34px;
border-radius:30px;
background:linear-gradient(135deg,var(--brass),var(--brass-light));
