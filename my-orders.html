<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>طلباتي | VelaLight</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=El+Messiri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
.mo-top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.2rem 0;flex-wrap:wrap}
.mo-top h1{font-family:var(--fd);color:var(--gold2);font-size:1.5rem;margin:0}
.mo-wrap{padding:1rem 0 4rem}
.order-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:1.2rem;margin-bottom:1rem;box-shadow:var(--sh)}
.order-head{display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap;margin-bottom:.8rem}
.oid{font-family:var(--fd);color:var(--gold2);font-size:1rem;display:block}
.odate{color:var(--dim);font-size:.75rem}
.status-badge{padding:.3rem .9rem;border-radius:99px;font-size:.72rem;font-weight:700;color:#fff}
.st-review{background:#e67e22}.st-prep{background:#3498db}.st-ship{background:#9b59b6}.st-done{background:#27ae60}.st-cancel{background:#e74c3c}
.order-items{list-style:none;margin:.6rem 0;padding:.6rem;background:var(--panel2);border-radius:12px;font-size:.85rem}
.order-items li{padding:.25rem 0}
.order-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:.7rem;font-size:.9rem}
.order-foot b{color:var(--gold2);font-family:var(--fd)}
.order-actions{margin-top:.8rem;display:flex;gap:.5rem;flex-wrap:wrap}
.loading,.empty,.error{text-align:center;padding:3rem 1rem;color:var(--dim);font-size:.95rem}
.login-card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:2.5rem;text-align:center;max-width:420px;margin:3rem auto}
.login-card h2{font-family:var(--fd);color:var(--gold2);margin-bottom:1rem}
</style>
</head>
<body>

<div class="wrap">
  <div class="mo-top">
    <h1>📦 طلباتي</h1>
    <div style="display:flex;gap:.5rem">
      <a class="btn ghost sm" href="index.html">↩ المتجر</a>
    </div>
  </div>

  <div class="mo-wrap" id="ordersContainer">
    <div class="loading">⏳ جاري التحميل...</div>
  </div>
</div>

<script src="data.js"></script>
<script type="module" src="firebase.js"></script>
<script type="module" src="auth.js"></script>

<script>
(function(){
"use strict";
const STATUS_AR=["قيد المراجعة","قيد التجهيز","تم الشحن","تم التسليم","ملغي"];
const STATUS_CLS=["st-review","st-prep","st-ship","st-done","st-cancel"];
const box=document.getElementById("ordersContainer");

let started=false;
function tryStart(){ if(started)return; if(window.FB&&window.FB.auth){started=true;init();} }
tryStart();
window.addEventListener("fb-ready",tryStart);
let tries=0;
const poll=setInterval(()=>{tries++;tryStart();if(started||tries>30)clearInterval(poll);},400);

function init(){
  window.FB.auth.onAuthStateChanged(user=>{
    if(user){ loadOrders(user); }
    else{ showLogin(); }
  });
}

function showLogin(){
  box.innerHTML=`
    <div class="login-card">
      <h2>🔐 سجّل الدخول أولاً</h2>
      <p style="color:var(--mut);font-size:.88rem;margin-bottom:1.2rem">عشان تشوف طلباتك، لازم تسجّل الدخول بحسابك.</p>
      <button class="btn" style="width:100%" onclick="if(window.openAuthModal)openAuthModal();else location.href='index.html'">👤 تسجيل الدخول</button>
    </div>`;
}

async function loadOrders(user){
  box.innerHTML='<div class="loading">⏳ جاري تحميل طلباتك...</div>';
  try{
    const all=await window.FB.list("orders");
    const mine=(all||[]).filter(o=>o.userId===user.uid||(o.userEmail&&o.userEmail===user.email));
    mine.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    if(!mine.length){
      box.innerHTML=`<div class="empty">🕯️ لسه مفيش طلبات.<br><br><a class="btn" href="index.html#products">🛍️ ابدأ التسوق</a></div>`;
      return;
    }
    box.innerHTML=mine.map(orderCard).join("");
  }catch(e){
    console.error(e);
    box.innerHTML='<div class="error">⚠️ تعذر تحميل الطلبات. جرب تاني.</div>';
  }
}

function orderCard(o){
  const idx=Number(o.status||0);
  const date=o.createdAt?new Date(o.createdAt).toLocaleDateString("ar-EG",{year:"numeric",month:"long",day:"numeric"}):"-";
  const items=(o.products||o.items||[]).map(it=>{
    const name=it.name||it.title||"منتج";
    const qty=it.quantity||it.qty||1;
    const scent=(it.scentName||it.scent)?` (${it.scentName||it.scent})`:"";
    return `<li>🕯️ ${name}${scent} × ${qty}</li>`;
  }).join("")||"<li>منتجات متعددة</li>";
  return `
  <div class="order-card">
    <div class="order-head">
      <div><b class="oid">📋 ${o.orderId||o.id||"-"}</b><small class="odate">📅 ${date}</small></div>
      <span class="status-badge ${STATUS_CLS[idx]||"st-review"}">${STATUS_AR[idx]||"قيد المراجعة"}</span>
    </div>
    <ul class="order-items">${items}</ul>
    <div class="order-foot"><span>💰 الإجمالي</span><b>${o.total||0} جنيه</b></div>
    <div class="order-actions"><a class="btn ghost sm" href="index.html#products">🛍️ تسوق المزيد</a></div>
  </div>`;
}
})();
</script>
</body>
</html>
