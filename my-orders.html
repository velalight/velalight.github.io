<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>طلباتي | VelaLight</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=El+Messiri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
.mo-top{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.2rem 0;flex-wrap:wrap}
.mo-top h1{font-family:var(--fd);color:var(--gold2);font-size:1.5rem;margin:0}
.mo-wrap{padding:1rem 0 4rem}
.order-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:1.2rem;margin-bottom:1rem;box-shadow:var(--sh);transition:.3s}
.order-card.cancelled{opacity:0.5;border-color:#e74c3c;background:var(--panel2)}
.order-card .order-head{display:flex;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap;margin-bottom:.8rem}
.order-card .oid{font-family:var(--fd);color:var(--gold2);font-size:1rem;display:block}
.order-card .odate{color:var(--dim);font-size:.75rem}
.order-card .status-badge{padding:.3rem .9rem;border-radius:99px;font-size:.72rem;font-weight:700;color:#fff;white-space:nowrap}
.order-card .st-review{background:#e67e22}
.order-card .st-prep{background:#3498db}
.order-card .st-ready{background:#9b59b6}
.order-card .st-ship{background:#27ae60}
.order-card .st-cancel{background:#e74c3c}
.order-card .st-done{background:#2ecc71}
.order-card .order-items{list-style:none;margin:.6rem 0;padding:.6rem;background:var(--panel2);border-radius:12px;font-size:.85rem}
.order-card .order-items li{padding:.25rem 0;border-bottom:1px solid rgba(0,0,0,0.03)}
.order-card .order-items li:last-child{border-bottom:0}
.order-card .order-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:.7rem;font-size:.9rem}
.order-card .order-foot b{color:var(--gold2);font-family:var(--fd)}
.order-card .order-actions{margin-top:.8rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.order-card .payment-status{font-size:.7rem;color:var(--dim);margin-top:.3rem}
.loading,.empty,.error{text-align:center;padding:3rem 1rem;color:var(--dim);font-size:.95rem}
.login-card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:2.5rem;text-align:center;max-width:420px;margin:3rem auto}
.login-card h2{font-family:var(--fd);color:var(--gold2);margin-bottom:1rem}
.btn.danger.sm{background:#e74c3c;color:#fff;border:0;padding:.3rem .8rem;border-radius:8px;font-size:.7rem;font-weight:700;cursor:pointer;transition:.2s}
.btn.danger.sm:hover{background:#c0392b;transform:scale(1.02)}
.btn.danger.sm:disabled{opacity:0.5;cursor:not-allowed}
.btn.outline.sm{background:transparent;border:1px solid var(--line);padding:.3rem .8rem;border-radius:8px;font-size:.7rem;cursor:pointer;transition:.2s}
.btn.outline.sm:hover{border-color:var(--gold);color:var(--gold)}
.toast-msg{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1a1512;color:#fff;padding:.8rem 1.8rem;border-radius:99px;font-size:.85rem;z-index:9999;opacity:0;transition:opacity .4s ease;box-shadow:0 8px 25px rgba(0,0,0,0.2)}
.toast-msg.show{opacity:1}
</style>
</head>
<body>

<!-- ═══ TOAST ═══ -->
<div class="toast-msg" id="toastMsg"></div>

<div class="wrap">
  <div class="mo-top">
    <h1>📦 طلباتي</h1>
    <div style="display:flex;gap:.5rem;flex-wrap:wrap">
      <a class="btn ghost sm" href="index.html">↩ المتجر</a>
    </div>
  </div>

  <div class="mo-wrap" id="ordersContainer">
    <div class="loading">⏳ جاري التحميل...</div>
  </div>
</div>

<script src="data.js"></script>
<script type="module" src="firebase.js"></script>
<script type="module" src="auth.js"></script>

<script>
(function(){
"use strict";

// ═══ دوال المساعدة ═══
function toast(msg){
  const el=document.getElementById('toastMsg');
  if(!el) return;
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer=setTimeout(()=>el.classList.remove('show'),3500);
}

// ═══ دالة إلغاء الطلب (العميل يلغي طلبه قبل التأكيد) ═══
window.cancelOrder = async function(orderId) {
  if(!orderId) return;
  if(!confirm('⚠️ هل أنت متأكد من إلغاء هذا الطلب؟ لا يمكن التراجع بعد الإلغاء.')) return;
  
  const btn = document.querySelector(`[data-cancel="${orderId}"]`);
  if(btn) { btn.disabled = true; btn.textContent = '⏳ جاري...'; }
  
  try {
    // ⭐ إضافة سجل في تاريخ الحالات
    const orderDoc = await window.FB.get('orders', orderId);
    const currentStatus = Number(orderDoc?.status || 0);
    const history = orderDoc?.statusHistory || [];
    history.push({
      from: currentStatus,
      to: 4,
      changedAt: Date.now(),
      changedBy: 'customer'
    });

    await window.FB.update('orders', orderId, { 
      status: 4,
      statusHistory: history,
      updatedAt: Date.now()
    });
    toast('✅ تم إلغاء الطلب بنجاح');
    const user = window.FB.auth.currentUser;
    if(user) await loadOrders(user);
    else location.reload();
  } catch(e) {
    console.error(e);
    toast('⚠️ فشل إلغاء الطلب، حاول مرة أخرى');
    if(btn) { btn.disabled = false; btn.textContent = '🗑️ إلغاء الطلب'; }
  }
};

// ═══ المتغيرات والتهيئة ═══
// ═══ الحالات مع الألوان المناسبة ═══
const STATUS_AR = ["قيد المراجعة", "قيد التجهيز", "تم التجهيز", "تم الشحن", "ملغي", "مكتمل"];
const STATUS_CLS = ["st-review", "st-prep", "st-ready", "st-ship", "st-cancel", "st-done"];

// ═══ حالات الدفع ═══
const PAYMENT_STATUS = {
  pending: 'قيد الانتظار',
  paid: 'تم الدفع',
  failed: 'فشل الدفع',
  refunded: 'تم الاسترجاع'
};

const box = document.getElementById("ordersContainer");

let started = false;
function tryStart(){ if(started)return; if(window.FB&&window.FB.auth){started=true;init();} }
tryStart();
window.addEventListener("fb-ready",tryStart);
let tries=0;
const poll=setInterval(()=>{tries++;tryStart();if(started||tries>30)clearInterval(poll);},400);

function init(){
  window.FB.auth.onAuthStateChanged(user=>{
    if(user){ loadOrders(user); }
    else{ showLogin(); }
  });
}

function showLogin(){
  box.innerHTML=`
    <div class="login-card">
      <h2>🔐 سجّل الدخول أولاً</h2>
      <p style="color:var(--mut);font-size:.88rem;margin-bottom:1.2rem">عشان تشوف طلباتك، لازم تسجّل الدخول بحسابك.</p>
      <button class="btn" style="width:100%" onclick="if(window.openAuthModal)openAuthModal();else location.href='index.html'">👤 تسجيل الدخول</button>
    </div>`;
}

async function loadOrders(user){
  box.innerHTML='<div class="loading">⏳ جاري تحميل طلباتك...</div>';
  try{
    const all = await window.FB.list("orders");
    
    // ⭐ التصفية: الطلبات الخاصة بالمستخدم الحالي
    const mine = (all||[]).filter(o => {
      const matchUserId = o.userId === user.uid;
      const matchEmail = o.userEmail && o.userEmail === user.email;
      const matchCustomerEmail = o.customer && o.customer.email && o.customer.email === user.email;
      const matchPhone = o.phone && user.phone && o.phone === user.phone;
      return matchUserId || matchEmail || matchCustomerEmail || matchPhone;
    });
    
    // ⭐ استبعاد الطلبات المكتملة أو الملغية (نعرض فقط النشطة)
    const activeOrders = mine.filter(o => {
      const status = Number(o.status || 0);
      // نعرض: قيد المراجعة (0)، قيد التجهيز (1)، تم التجهيز (2)، تم الشحن (3)
      // نستبعد: ملغي (4)، مكتمل (5)
      return status >= 0 && status <= 3;
    });
    
    // ترتيب تنازلي (الأحدث أولاً)
    activeOrders.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
    
    if(!activeOrders.length){
      box.innerHTML=`<div class="empty">🕯️ ليس لديك طلبات نشطة حالياً.<br><br><a class="btn" href="index.html#products">🛍️ ابدأ التسوق</a></div>`;
      return;
    }
    box.innerHTML = activeOrders.map(o => orderCard(o, user)).join("");
  }catch(e){
    console.error(e);
    box.innerHTML='<div class="error">⚠️ تعذر تحميل الطلبات. جرب تاني.</div>';
  }
}

function orderCard(o, user){
  const idx = Number(o.status||0);
  const isCancelled = (idx === 4);
  const date = o.createdAt ? new Date(o.createdAt).toLocaleDateString("ar-EG", {year:"numeric", month:"long", day:"numeric"}) : "-";
  
  let itemsHtml = "";
  const itemsList = o.products || o.items || [];
  if(itemsList.length){
    itemsHtml = itemsList.map(it => {
      const name = it.name || it.title || "منتج";
      const qty = it.quantity || it.qty || 1;
      const scent = (it.scentName || it.scent) ? ` (${it.scentName || it.scent})` : "";
      return `<li>🕯️ ${name}${scent} × ${qty}</li>`;
    }).join("");
  } else {
    itemsHtml = "<li>منتجات متعددة</li>";
  }

  // ═══ زر إلغاء الطلب (يظهر فقط للطلبات غير الملغية وقيد المراجعة أو التجهيز) ═══
  let cancelBtn = '';
  // يسمح بالإلغاء إذا كان الطلب قيد المراجعة (0) أو قيد التجهيز (1)
  if((idx === 0 || idx === 1) && !isCancelled) {
    cancelBtn = `<button class="btn danger sm" data-cancel="${o.id}" onclick="window.cancelOrder('${o.id}')">🗑️ إلغاء الطلب</button>`;
  }

  // ═══ عرض حالة الدفع (إن وجدت) ═══
  let paymentStatusText = '';
  if(o.paymentStatus) {
    const ps = PAYMENT_STATUS[o.paymentStatus] || o.paymentStatus;
    paymentStatusText = `<div class="payment-status">💳 حالة الدفع: ${ps}</div>`;
  }

  const cardClass = isCancelled ? 'order-card cancelled' : 'order-card';
  const statusText = STATUS_AR[idx] || "قيد المراجعة";
  const statusClass = STATUS_CLS[idx] || "st-review";

  return `
  <div class="${cardClass}">
    <div class="order-head">
      <div><b class="oid">📋 ${o.orderId || o.id || "-"}</b> <small class="odate">📅 ${date}</small></div>
      <span class="status-badge ${statusClass}">${statusText}</span>
    </div>
    <ul class="order-items">${itemsHtml}</ul>
    <div class="order-foot"><span>💰 الإجمالي</span><b>${o.total || 0} جنيه</b></div>
    ${paymentStatusText}
    <div class="order-actions">
      <a class="btn ghost sm" href="index.html#products">🛍️ تسوق المزيد</a>
      ${cancelBtn}
      ${isCancelled ? '<span style="font-size:.7rem;color:var(--dim);">❌ تم الإلغاء</span>' : ''}
    </div>
  </div>`;
}

// ═══ تصدير دوال للنطاق العام ═══
window.loadOrders = loadOrders;

})();
</script>
</body>
</html>
