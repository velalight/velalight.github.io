<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>منتج | VelaLight</title>
<meta name="description" content="منتج من VelaLight — شموع يدوية فاخرة">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=El+Messiri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VelaLight — premium product presentation only. Firebase / data / reviews logic untouched. */
.pd-page{max-width:1240px;margin:0 auto}
.pd-grid{align-items:center;gap:clamp(2rem,5vw,5rem);padding-top:.6rem}
.pd-img{position:relative;background:#f6efe5;border:1px solid rgba(151,103,42,.20);box-shadow:0 24px 70px rgba(72,49,27,.14);border-radius:28px;overflow:hidden}
.pd-img:after{content:"";position:absolute;inset:0;pointer-events:none;border:1px solid rgba(255,255,255,.48);border-radius:inherit}
.pd-img img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;transition:transform .65s cubic-bezier(.2,.7,.2,1)}
.pd-img:hover img{transform:scale(1.018)}
.pd-thumbs{display:flex;gap:.55rem;margin-top:.7rem;flex-wrap:wrap}
.pd-thumbs img{width:58px;height:58px;border-radius:11px;object-fit:cover;border:1px solid rgba(151,103,42,.18);cursor:pointer;transition:.22s;box-shadow:0 4px 14px rgba(72,49,27,.06)}
.pd-thumbs img:hover,.pd-thumbs img.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(151,103,42,.10)}
.pd-info{padding:.2rem 0;max-width:570px}
#pdBadge{min-height:0;margin:0 0 .55rem}
#pdName{margin:0 0 .18rem;font-size:clamp(1.9rem,3.5vw,3.05rem);line-height:1.18;letter-spacing:-.035em;color:#241b14}
.pd-price{display:flex;align-items:baseline;gap:.42rem;margin:.1rem 0 .95rem;font-size:1.28rem;font-weight:800;color:#946226}
.pd-price del{font-size:.82rem;opacity:.48;font-weight:500;color:#6d6258}
.pd-price small{font-size:.72rem;font-weight:700;color:#8b7a69}
.opt-t{margin:.62rem 0 .28rem;font-size:.78rem;font-weight:800;color:#946226;letter-spacing:.01em}
.pd-scent-select{appearance:none;-webkit-appearance:none;width:235px;height:43px;padding:0 2.35rem 0 .85rem;border:1px solid rgba(151,103,42,.30);border-radius:12px;background-color:#fffdf9;color:#3a2b1d;font-family:inherit;font-size:.88rem;font-weight:600;outline:none;box-shadow:0 7px 22px rgba(72,49,27,.055);transition:.2s;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,#9a6b2d 50%),linear-gradient(135deg,#9a6b2d 50%,transparent 50%);background-position:calc(100% - 16px) 18px,calc(100% - 11px) 18px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.pd-scent-select:hover{border-color:rgba(151,103,42,.55);box-shadow:0 9px 25px rgba(72,49,27,.08)}
.pd-scent-select:focus{border-color:#b47b32;box-shadow:0 0 0 3px rgba(180,123,50,.10),0 9px 25px rgba(72,49,27,.08)}
.pd-scent-select option{background:#fffdf9;color:#3a2b1d;font-weight:500}
.qty{display:inline-flex!important;align-items:center;gap:0!important;width:max-content!important;height:38px;border:1px solid rgba(151,103,42,.24);border-radius:11px;overflow:hidden;margin:.05rem 0 .55rem;background:#fffdf9;box-shadow:0 5px 18px rgba(72,49,27,.045)}
.qty button{width:34px!important;height:36px!important;min-width:34px!important;padding:0!important;border:0!important;background:transparent!important;color:#815823!important;font-size:1rem!important;font-weight:700}
.qty button:hover{background:#f6eee3!important}
.qty b{width:34px;text-align:center;font-size:.86rem;color:#35271b}
.pd-actions{margin:.05rem 0 .7rem}
.pd-actions .btn{width:235px;min-height:43px;border-radius:12px;font-size:.9rem;font-weight:800;box-shadow:0 10px 24px rgba(151,103,42,.16)}
#pdDesc{max-width:570px;margin:.9rem 0 0!important;padding-top:.9rem;border-top:1px solid rgba(151,103,42,.13);font-size:1rem;line-height:2!important;color:#67584b}
.share-row{margin-top:1rem!important;display:flex;gap:.45rem;flex-wrap:wrap}
.share-row a{padding:.42rem .68rem;border:1px solid rgba(151,103,42,.15);border-radius:9px;font-size:.76rem;background:rgba(255,255,255,.35)}
section[style*="margin-top:3rem"]{margin-top:2.5rem!important}
#revList{display:grid;gap:.7rem}
.rv-item{padding:1rem 1.1rem;border:1px solid rgba(151,103,42,.13);border-radius:14px;background:rgba(255,255,255,.34);box-shadow:0 6px 20px rgba(72,49,27,.035)}
.rv-item .stars{margin-inline-start:.35rem}
.rv-item p{margin:.4rem 0 0!important;line-height:1.8}
.rv-photo{display:block;max-width:180px;max-height:180px;object-fit:cover;border-radius:10px;margin-top:.65rem}
@media(max-width:760px){
  .pd-page{padding-inline:1rem!important}
  .pd-grid{grid-template-columns:1fr!important;gap:1.15rem!important;padding-top:.2rem}
  .pd-img{border-radius:18px}
  #pdName{font-size:1.65rem;line-height:1.25}
  .pd-price{font-size:1.12rem;margin-bottom:.65rem}
  .pd-scent-select{width:210px;height:41px}
  .pd-actions .btn{width:210px;min-height:42px}
  #pdDesc{font-size:.94rem;line-height:1.9!important;margin-top:.7rem!important;padding-top:.7rem}
  .pd-thumbs img{width:50px;height:50px}
}
@media(max-width:420px){
  .pd-scent-select,.pd-actions .btn{width:100%}
}
</style>
</head>
<body>

<header>
<div class="wrap hrow">
<a class="logo" href="index.html"><span class="flame"></span><div><b>VelaLight</b><small>Luxury Candle Studio</small></div></a>
<div class="hact">
<button class="langbtn" id="langBtn">EN</button>
<a class="icobtn" href="index.html?cart=1">🛍️<span class="badge" id="cartCount">0</span></a>
</div>
</div>
</header>

<div class="wrap pd-page" style="padding-top:1.25rem;padding-bottom:3rem">
<div class="crumb"><a href="index.html" data-i18n="crumb_home">الرئيسية</a> › <span id="crumbName">...</span></div>
<div id="pdLoading" style="text-align:center;padding:3rem;color:var(--dim)">⏳ ...</div>

<div id="pdWrap" class="hidden">
<div class="pd-grid">
<div>
<div class="pd-img"><img id="pdImg" src="" alt=""></div>
<div class="pd-thumbs" id="pdThumbs"></div>
</div>
<div class="pd-info">
<h1 id="pdName"></h1>
<div id="pdBadge"></div>
<div class="pd-price"><span id="pdPrice"></span> <del id="pdOld"></del> <small data-i18n="egp">ج.م</small></div>
<div class="opt-t" data-i18n="pd_scent_t">🌸 اختاري العطر:</div>
<select class="pd-scent-select" id="pdScentSelect" aria-label="Scent">
<option value="">اختاري العطر</option>
</select>

<div class="opt-t" data-i18n="pd_qty_t">الكمية:</div>
<div class="qty">
<button id="qMinus">−</button>
<b id="qVal">1</b>
<button id="qPlus">+</button>
</div>

<div class="pd-actions">
<button class="btn" id="addBtn" data-i18n="pd_add">🛍️ أضيفي للسلة</button>
</div>


<p style="color:var(--mut);margin-top:1rem;line-height:1.9" id="pdDesc"></p>

<div class="share-row" id="shareRow"></div>
</div>
</div>

<section style="margin-top:3rem">
<h2 class="fd" data-i18n="pd_rev_h2">مراجعات المنتج</h2>
<div id="revList"></div>
<div class="rv-form">
<h3 style="color:var(--gold2);margin-bottom:1rem" data-i18n="pd_form_t">ضيفي مراجعتك ⭐</h3>
<div class="row">
<input id="rvName" data-i18n-ph="pd_name_ph" placeholder="اسمك">
<div class="starpick" id="starPick"></div>
</div>
<textarea id="rvText" rows="3" data-i18n-ph="pd_text_ph" placeholder="اكتبي رأيك..."></textarea>
<input id="rvPhoto" data-i18n-ph="pd_photo_ph" placeholder="رابط صورة (اختياري)" style="margin-top:.5rem">
<button class="btn sm" id="rvSubmit" style="margin-top:.8rem" data-i18n="pd_submit">إرسال</button>
<p style="color:var(--dim);font-size:.75rem;margin-top:.5rem" data-i18n="pd_note">المراجعة بتظهر بعد الموافقة</p>
</div>
</section>

<section style="margin-top:3rem">
<h2 class="fd" data-i18n="pd_rel_h2">منتجات هتعجبك</h2>
<div class="rel-grid" id="relGrid"></div>
</section>
</div>

<div id="pdNotFound" class="hidden" style="text-align:center;padding:4rem">
<p style="font-size:1.2rem" data-i18n="pd_notfound">😕 المنتج مش موجود</p>
<a class="btn" href="index.html" style="margin-top:1rem" data-i18n="nav_home">الرئيسية</a>
</div>
</div>

<footer>
<div class="wrap">
<div class="fbot">
<span data-i18n="foot_rights">© 2026 - 2030 VelaLight — جميع الحقوق محفوظة</span>
<div>
<a href="track.html" data-i18n="mn_track">📦 تتبع الطلب</a> ·
<a href="exchange-policy.html" data-i18n="foot_exchange">سياسة الاستبدال</a>
</div>
</div>
</div>
</footer>

<div id="toasts"></div>

<script src="data.js"></script>
<script type="module" src="firebase.js"></script>
<script>
(function(){
"use strict";

let P=null,qty=1,selScent="",selRating=5;

document.addEventListener("DOMContentLoaded",()=>{
initLang();
cartBadge();
buildStars();
const pid=new URLSearchParams(location.search).get("p");
if(!pid){showNotFound();return}
loadAll().then(()=>{
P=ALL_PRODUCTS.find(x=>x.id===pid);
if(!P){showNotFound();return}
render();
});
});

function initLang(){
applyI18n();
$("#langBtn")?.addEventListener("click",()=>{
LANG=LANG==="ar"?"en":"ar";
localStorage.setItem("vl_lang",LANG);
document.documentElement.dir=LANG==="ar"?"rtl":"ltr";
applyI18n();
if(P)render();
});
}
function applyI18n(){
$$("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
$$("[data-i18n-ph]").forEach(el=>el.placeholder=t(el.dataset.i18nPh));
}

function showNotFound(){
$("#pdLoading").classList.add("hidden");
$("#pdNotFound").classList.remove("hidden");
}

function render(){
$("#pdLoading").classList.add("hidden");
$("#pdWrap").classList.remove("hidden");

document.title=pname(P)+" | VelaLight";
$("#crumbName").textContent=pname(P);
$("#pdName").textContent=pname(P);
$("#pdDesc").textContent=pdesc(P);
$("#pdImg").src=imgOf(P);
$("#pdImg").alt=pname(P);

const badge=pbadge(P);
$("#pdBadge").innerHTML=badge?`<span class="p-badge" style="position:static;display:inline-block">${badge}</span>`:"";

$("#pdPrice").textContent=money(P.price);
$("#pdOld").textContent=P.old>P.price?money(P.old):"";
$("#pdOld").style.display=P.old>P.price?"inline":"none";


renderThumbs();
renderScents();
renderReviews();
renderRelated();
renderShare();
bindEvents();
}

function renderThumbs(){
const imgs=imgsOf(P);
const w=$("#pdThumbs");
if(imgs.length<=1){w.innerHTML="";return}
w.innerHTML=imgs.map((u,i)=>`<img src="${CDN(u)}" class="${i===0?'on':''}" data-i="${i}">`).join("");
w.querySelectorAll("img").forEach(im=>im.addEventListener("click",()=>{
$("#pdImg").src=im.src;
w.querySelectorAll("img").forEach(x=>x.classList.remove("on"));
im.classList.add("on");
}));
}

function renderScents(){
const select=$("#pdScentSelect");
if(!select)return;
selScent="";
const scents=Array.isArray(P?.scents)&&P.scents.length?P.scents:SCENTS;
select.innerHTML=`<option value="">${LANG==="ar"?"🌸 اختاري العطر":"🌸 Choose a scent"}</option>`+
scents.map(s=>{
const value=Array.isArray(s)?s[0]:String(s);
const label=Array.isArray(s)?(LANG==="en"?(s[1]||s[0]):s[0]):String(s);
return `<option value="${String(value).replace(/"/g,"&quot;")}">${String(label).replace(/</g,"&lt;").replace(/>/g,"&gt;")}</option>`;
}).join("");
select.value="";
select.onchange=()=>{selScent=select.value;select.classList.remove("scent-error")};
}

function bindEvents(){
$("#qMinus").addEventListener("click",()=>{if(qty>1)qty--;$("#qVal").textContent=qty});
$("#qPlus").addEventListener("click",()=>{qty++;$("#qVal").textContent=qty});

$("#addBtn").addEventListener("click",()=>{
if(!selScent){toast(t("t_scentwarn"));return}
addToCart(P,{scent:selScent,qty});
});


$("#rvSubmit").addEventListener("click",()=>{
const name=$("#rvName").value.trim();
const text=$("#rvText").value.trim();
const photo=$("#rvPhoto").value.trim();
if(!name||!text){toast(t("t_revwarn"));return}
DB.add("reviews",{
productSlug:P.id,pid:P.id,name,text,photo,
rating:selRating,approved:false,createdAt:Date.now()
}).then(()=>{
toast(t("t_revok"));
$("#rvName").value="";$("#rvText").value="";$("#rvPhoto").value="";
}).catch(e=>{console.warn(e);toast("⚠️")});
});
}

function buildStars(){
const w=$("#starPick");
for(let i=1;i<=5;i++){
const b=document.createElement("button");
b.textContent="★";
b.dataset.v=i;
if(i===5)b.classList.add("lit");
b.addEventListener("click",()=>{
selRating=i;
w.querySelectorAll("button").forEach(x=>x.classList.toggle("lit",+x.dataset.v<=i));
});
w.appendChild(b);
}
}

function renderReviews(){
const list=prodReviews(P.id);
const w=$("#revList");
if(!list.length){
w.innerHTML=`<p style="color:var(--dim);padding:1rem 0">${t("pd_first")}</p>`;
return;
}
w.innerHTML=list.map(r=>`<div class="rv-item">
<b>${r.name||"-"}</b> <span class="stars">${"★".repeat(r.rating||5)}</span>
<p style="color:var(--mut);margin-top:.3rem">${r.text||""}</p>
${r.photo?`<img class="rv-photo" src="${r.photo}">`:""}
</div>`).join("");
}

function renderRelated(){
const rel=ALL_PRODUCTS.filter(x=>x.cat===P.cat&&x.id!==P.id).slice(0,4);
$("#relGrid").innerHTML=rel.map(p=>`<a class="p-card" href="product.html?p=${p.id}">
<div class="p-media"><img src="${imgOf(p)}" alt="${pname(p)}" loading="lazy"></div>
<div class="p-body"><h3>${pname(p)}</h3><div class="p-price">${money(p.price)}</div></div>
</a>`).join("");
}

function renderShare(){
const url=location.href;
const txt=encodeURIComponent(pname(P)+" | VelaLight");
$("#shareRow").innerHTML=`
<a href="https://wa.me/?text=${txt}%20${url}" target="_blank">واتساب</a>
<a href="https://www.facebook.com/sharer/sharer.php?u=${url}" target="_blank">فيسبوك</a>
<a href="javascript:void(0)" id="copyLink">نسخ الرابط</a>`;
$("#copyLink")?.addEventListener("click",()=>{
navigator.clipboard.writeText(url).then(()=>toast(t("t_saved")));
});
}

})();
</script>
</body>
</html>
