<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منتج | VelaLight</title>
<meta name="description" id="metaDesc" content="">
<link rel="canonical" id="canonical" href="https://velalight.github.io/product.html">
<meta property="og:type" content="product">
<meta property="og:title" id="ogTitle" content="VelaLight">
<meta property="og:description" id="ogDesc" content="">
<meta property="og:image" id="ogImg" content="">
<meta property="og:url" id="ogUrl" content="">
<meta name="theme-color" content="#0e0b09">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;500;600;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.pd-gallery{display:flex;flex-direction:column;gap:.8rem}
.pd-thumbs{display:flex;gap:.55rem;overflow-x:auto;padding:.15rem}
.pd-thumbs button{flex:0 0 72px;width:72px;height:72px;border:1px solid var(--line);border-radius:10px;overflow:hidden;padding:0;background:transparent}
.pd-thumbs button.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(217,171,95,.15)}
.pd-thumbs img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>

<header id="hdr">
 <div class="wrap hrow">
  <a class="logo" href="index.html"><span class="flame"></span><span><b>VelaLight</b><small>Luxury Candle Studio</small></span></a>
  <div class="hact">
    <button class="langbtn" id="langBtn">EN</button>
    <a class="icobtn" href="index.html?cart=1">🛍️<span class="badge" id="cartCount">0</span></a>
  </div>
 </div>
</header>

<main><div class="wrap" style="padding:2.5rem 0" id="pdWrap"><div class="empty">⏳ ...</div></div></main>

<footer style="margin-top:0">
 <div class="wrap fbot">
  <span data-i18n="foot_rights">© 2026 - 2030 VelaLight — جميع الحقوق محفوظة</span>
  <span><a href="track.html" data-i18n="mn_track">📦 تتبع الطلب</a> · <a href="exchange-policy.html" data-i18n="foot_exchange">سياسة الاستبدال</a></span>
 </div>
</footer>
<div id="toasts"></div>

<script src="data.js"></script>
<script type="module" src="firebase.js"></script>
<script>
const PID=new URLSearchParams(location.search).get("id");
let P=null;
async function init(){
 await loadAll();
 P=ALL_PRODUCTS.find(x=>x.id===PID);
 if(!P){$("#pdWrap").innerHTML=`<div class="empty">${t("pd_notfound")}<br><br><a class="btn sm" href="index.html">${t("crumb_home")}</a></div>`;return}
 render();
 track("view_item",{items:[{item_id:P.id,item_name:P.name,price:P.price}]});
}
function render(){
 const rt=ratingOf(P.id),rvs=prodReviews(P.id),rel=ALL_PRODUCTS.filter(x=>x.cat===P.cat&&x.id!==P.id).slice(0,4);
 const sc=(P.scents&&P.scents.length?P.scents:[SCENTS[0][0]]);
 /* SEO ديناميكي حسب المنتج */
 const url=`https://velalight.github.io/product.html?id=${P.id}`;
 document.title=`${pname(P)} | ${cat(P.cat)} — VelaLight`;
 $("#metaDesc").setAttribute("content",(pdesc(P)||"").slice(0,155));
 $("#canonical").href=url;
 $("#ogTitle").content=pname(P);$("#ogDesc").content=(pdesc(P)||"").slice(0,155);
 $("#ogImg").content=imgOf(P).startsWith("data:")?"https://velalight.github.io/RR.jpg":imgOf(P);
 $("#ogUrl").content=url;
 /* Schema ديناميكي */
 const ld={"@context":"https://schema.org","@type":"Product","name":P.name,"alternateName":P.nameEn,"description":P.desc,"image":imgOf(P).startsWith("data:")?"https://velalight.github.io/RR.jpg":imgOf(P),"brand":{"@type":"Brand","name":"VelaLight"},"sku":P.id,
  "offers":{"@type":"Offer","url":url,"priceCurrency":"EGP","price":P.price,"availability":"https://schema.org/InStock","areaServed":"EG"}};
 if(rt)ld.aggregateRating={"@type":"AggregateRating","ratingValue":rt.avg,"reviewCount":rt.count,"bestRating":5};
 const s1=document.createElement("script");s1.type="application/ld+json";s1.textContent=JSON.stringify(ld);document.head.appendChild(s1);
 const bc={"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[
  {"@type":"ListItem","position":1,"name":"VelaLight","item":"https://velalight.github.io/"},
  {"@type":"ListItem","position":2,"name":cat(P.cat),"item":"https://velalight.github.io/index.html#products"},
  {"@type":"ListItem","position":3,"name":pname(P),"item":url}]};
 const s2=document.createElement("script");s2.type="application/ld+json";s2.textContent=JSON.stringify(bc);document.head.appendChild(s2);

 $("#pdWrap").innerHTML=`
  <div class="crumb"><a href="index.html">${t("crumb_home")}</a> ‹ <a href="index.html#products">${cat(P.cat)}</a> ‹ <span style="color:var(--gold2)">${pname(P)}</span></div>
  <div class="pd-grid">
   <div class="pd-gallery">
     <div class="pd-img"><img id="pdMainImg" src="${imgOf(P)}" alt="${pname(P)}" width="800" height="800"></div>
     ${imgsOf(P).length>1?`<div class="pd-thumbs">${imgsOf(P).map((s,i)=>`<button type="button" data-pimg="${i}" class="${i===0?"on":""}"><img src="${CDN(s)}" alt="${pname(P)} — ${i+1}" loading="lazy"></button>`).join("")}</div>`:""}
   </div>
   <div class="pd-info">
    <span class="kick">${cat(P.cat)}</span>
    <h1>${pname(P)} ${pbadge(P)?`<span class="p-badge" style="position:static;display:inline-block;vertical-align:middle;font-size:.65rem">${pbadge(P)}</span>`:""}</h1>
    <small dir="ltr" style="display:block">${LANG==="en"?P.name:P.nameEn}</small>
    ${rt?`<div class="stars" style="margin-top:.4rem">${"★".repeat(Math.round(rt.avg))}${"☆".repeat(5-Math.round(rt.avg))} <small>${rt.avg}/5 — ${rt.count}</small></div>`:""}
    ${P.sold?`<small style="color:var(--ok)">🔥 ${t("pd_sold")} ${P.sold}+ ${t("pd_times")}</small>`:""}
    <div class="pd-price">${P.price} <small>${t("egp")}</small>${P.old?`<del>${P.old} ${t("egp")}</del>`:""}</div>
    <p style="color:var(--mut)">${pdesc(P)}</p>
    <div class="opt-t">${t("pd_scent_t")}</div>
    <div class="scents-pick" id="pdScents">${sc.map((s,i)=>`<button class="chip ${i===0?"on":""}" data-s="${s}">${scentTr(s)}</button>`).join("")}</div>
    <div class="opt-t">${t("pd_qty_t")}</div>
    <div class="qty"><button id="pdMinus">−</button><b id="pdQty">1</b><button id="pdPlus">+</button></div>
    <div class="pd-actions">
     <button class="btn" id="pdAdd">${t("pd_add")}</button>
     <button class="btn wa" id="pdBuy">${t("pd_buy")}</button>
    </div>
    <div class="pd-meta">
     <span>⏳ <b>${t("pd_hours")}</b> ${phours(P)}</span>
     <span>🌿 <b>${t("pd_materials")}</b> ${t("pd_materials_v")}</span>
     <span>🚚 <b>${t("pd_ship")}</b> ${t("pd_ship_v")}</span>
     <span>🎁 <b>${t("pd_gift")}</b> ${t("pd_gift_v")}</span>
     <span>🔁 <b>${t("pd_exchange")}</b> ${t("pd_exchange_v")}</span>
    </div>
    <div class="share-row"><span style="font-size:.78rem;color:var(--dim)">${t("pd_share")}</span>
     <a href="https://wa.me/?text=${encodeURIComponent(pname(P)+" — "+url)}" target="_blank">WhatsApp</a>
     <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}" target="_blank">Facebook</a>
     <a href="https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(pname(P))}" target="_blank">Telegram</a>
    </div>
   </div>
  </div>
  <div class="sec" style="padding:3.5rem 0 0">
   <div class="sec-head"><span class="kick">Reviews</span><h2 style="font-size:1.5rem">${t("pd_rev_h2")} (${rt?rt.count:0})</h2></div>
   <div>${rvs.length?rvs.map(r=>`<div class="rv-item"><b>${r.name}</b> <span class="stars">${"★".repeat(r.rating||0)}${"☆".repeat(5-(r.rating||0))}</span><p style="color:var(--mut);font-size:.9rem;margin-top:.3rem">${r.text}</p>${r.photo?`<img class="rv-photo" src="${r.photo}" alt="review photo" loading="lazy">`:""}</div>`).join(""):`<div class="empty">${t("pd_first")}</div>`}</div>
   <div class="rv-form">
    <b class="fd" style="color:var(--gold2)">${t("pd_form_t")}</b>
    <div class="row" style="margin-top:.8rem">
     <input id="prName" placeholder="${t("pd_name_ph")}">
     <div class="starpick" id="prStars">${[1,2,3,4,5].map(n=>`<button data-n="${n}">★</button>`).join("")}</div>
    </div>
    <textarea id="prText" rows="2" placeholder="${t("pd_text_ph")}" style="margin-bottom:.8rem"></textarea>
    <input id="prPhoto" placeholder="${t("pd_photo_ph")}" dir="ltr" style="margin-bottom:.8rem">
    <button class="btn sm" id="prSubmit">${t("pd_submit")}</button>
    <small style="display:block;margin-top:.4rem">${t("pd_note")}</small>
   </div>
  </div>
  ${rel.length?`<div class="sec" style="padding:3rem 0 0"><div class="sec-head"><span class="kick">You may also like</span><h2 style="font-size:1.5rem">${t("pd_rel_h2")}</h2></div><div class="rel-grid">${rel.map(cardMini).join("")}</div></div>`:""}`;

 const galleryImages=imgsOf(P);
 $$("#pdWrap [data-pimg]").forEach(b=>b.onclick=()=>{
  const i=+b.dataset.pimg,main=$("#pdMainImg");
  if(main)main.src=CDN(galleryImages[i]);
  $$("#pdWrap [data-pimg]").forEach(x=>x.classList.toggle("on",x===b));
 });
 let sel=sc[0],qty=1;
 $$("#pdScents .chip").forEach(c=>c.onclick=()=>{$$("#pdScents .chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");sel=c.dataset.s});
 $("#pdMinus").onclick=()=>{qty=Math.max(1,qty-1);$("#pdQty").textContent=qty};
 $("#pdPlus").onclick=()=>{qty++;$("#pdQty").textContent=qty};
 $("#pdAdd").onclick=()=>{addToCart(P,{scent:sel,qty});toast(t("t_go_cart"))};
 $("#pdBuy").onclick=()=>{
  let msg=`${t("wa_head")}\n${t("wa_item")} ${pname(P)}\n${t("wa_scent")}: ${scentTr(sel)}\n${t("pd_qty_t")} ${qty}\n${t("wa_total")} ${money(P.price*qty+CFG.SHIPPING)}\n${t("wa_insta")} *${CFG.INSTAPAY}*`;
  window.open(`https://wa.me/${CFG.WHATSAPP}?text=${encodeURIComponent(msg)}`,"_blank");
  track("begin_checkout",{value:P.price*qty});
 };
 let pr=5;const lit=()=>{$$("#prStars button").forEach((b,i)=>b.classList.toggle("lit",i<pr))};lit();
 $$("#prStars button").forEach(b=>b.onclick=()=>{pr=+b.dataset.n;lit()});
 $("#prSubmit").onclick=async()=>{
  const n=$("#prName").value.trim(),tx=$("#prText").value.trim(),pho=$("#prPhoto").value.trim();
  if(!n||!tx)return toast(t("t_revwarn"));
  try{await DB.add("reviews",{productSlug:P.id,name:n,rating:pr,text:tx,photo:pho,approved:false,createdAt:Date.now()});toast(t("t_revok"));$("#prName").value="";$("#prText").value="";$("#prPhoto").value=""}catch(e){toast("Error")}
 };
}
function cardMini(p){const b=pbadge(p);return `<article class="p-card rv on"><a class="p-media" href="product.html?id=${p.id}"><img src="${imgOf(p)}" alt="${pname(p)}" loading="lazy" width="600" height="600">${b?`<span class="p-badge">${b}</span>`:""}</a><div class="p-body"><span class="p-cat">${cat(p.cat)}</span><h3><a href="product.html?id=${p.id}">${pname(p)}</a></h3><div class="p-foot"><div class="p-price">${p.price} <small>${t("egp")}</small></div><button class="p-add" data-add="${p.id}">${t("add_cart")}</button></div></div></article>`}
document.addEventListener("click",e=>{const a=e.target.closest("[data-add]");if(a){const p=ALL_PRODUCTS.find(x=>x.id===a.dataset.add);p&&addToCart(p)}});
$("#langBtn").onclick=()=>{LANG=LANG==="ar"?"en":"ar";localStorage.setItem("vl_lang",LANG);location.reload()};
document.addEventListener("DOMContentLoaded",()=>{cartBadge();init()});
window.addEventListener("data-refresh",()=>{init()});
</script>
</body>
</html>
