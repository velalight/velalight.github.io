<style>


:root{

--cream:#F6EDE0;
--ivory:#FFFBF3;
--cocoa:#2B1B12;
--espresso:#4A2E1E;
--brass:#B8874A;
--brass-light:#D9AE71;
--line:rgba(43,27,18,.12);

}


*{

margin:0;
padding:0;
box-sizing:border-box;

}


html{

scroll-behavior:smooth;

}


body{

font-family:'Tajawal',sans-serif;
background:var(--cream);
color:var(--cocoa);
line-height:1.9;
overflow-x:hidden;

}


h1,h2,h3{

font-family:'Amiri',serif;

}


img{

max-width:100%;
display:block;

}


a{

text-decoration:none;
color:inherit;

}


button{

font-family:'Tajawal',sans-serif;

}


.wrap{

max-width:1120px;
margin:auto;
padding:0 24px;

}



/* HEADER */


header{

background:rgba(246,237,224,.95);
backdrop-filter:blur(10px);
border-bottom:1px solid rgba(184,135,74,.25);
position:sticky;
top:0;
z-index:1000;

}



.nav{

min-height:75px;
display:flex;
align-items:center;
justify-content:space-between;

}



.logo{

font-size:32px;
font-family:'Amiri',serif;
font-weight:bold;
color:var(--espresso);

}



.flame{

display:inline-block;
width:15px;
height:20px;
background:var(--brass);
border-radius:50% 50% 50% 0;
transform:rotate(-45deg);
margin:0 5px;

}




.nav-buttons{

display:flex;
gap:12px;
align-items:center;

}



.nav-cta,
.btn-glow{

padding:13px 28px;
border-radius:30px;
background:linear-gradient(
135deg,
var(--brass),
var(--brass-light)
);

font-weight:bold;

}




.cart-open-btn{

background:var(--espresso);
color:white;
border:none;
padding:11px 20px;
border-radius:30px;
cursor:pointer;
font-weight:bold;
display:flex;
gap:8px;
align-items:center;

}



#cartCount{

background:white;
color:var(--espresso);
width:24px;
height:24px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:13px;

}



/* CART */


.cart-panel{

position:fixed;
top:0;
right:-430px;
width:390px;
max-width:95%;
height:100vh;
background:var(--ivory);
z-index:9999;
padding:25px;
box-shadow:-10px 0 30px rgba(0,0,0,.25);
transition:.4s;
overflow:auto;

}



.cart-panel.active{

right:0;

}



.cart-title{

display:flex;
justify-content:space-between;
align-items:center;

}



.close-cart{

background:var(--cocoa);
color:white;
border:none;
width:35px;
height:35px;
border-radius:50%;

}



.cart-item{

padding:15px 0;
border-bottom:1px solid var(--line);

}



.qty-btn{

background:var(--espresso);
color:white;
border:none;
width:30px;
height:30px;
border-radius:50%;
cursor:pointer;

}



.cart-total{

font-size:22px;
font-weight:bold;
margin:20px 0;

}



.checkout-btn{

width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#25D366;
color:white;
font-weight:bold;
cursor:pointer;

}



/* HERO */


.hero{

padding:70px 0;
text-align:center;

background:

radial-gradient(
circle at top,
rgba(217,174,113,.25),
transparent 45%
);

}



.eyebrow{

color:var(--brass);
font-size:18px;
font-weight:bold;

}



.hero h1{

font-size:55px;
line-height:1.4;

}



.hero .sub{

max-width:700px;
margin:25px auto;
font-size:20px;
color:var(--espresso);

}



.hero-img{

width:420px;
height:420px;
object-fit:cover;
border-radius:30px;
margin:40px auto 0;

box-shadow:

0 25px 50px rgba(43,27,18,.25);

}

/* ===== الأقسام العامة ===== */


section{

padding:70px 0;

}



.section-head{

text-align:center;
margin-bottom:45px;

}



.section-head h2{

font-size:42px;
color:var(--espresso);

}



.section-head p{

color:#6b5140;
font-size:18px;

}



/* ===== المنتجات ===== */


.grid-products{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:25px;

}



.card{

background:var(--ivory);
border-radius:20px;
overflow:hidden;
border:1px solid rgba(184,135,74,.2);
transition:.3s;

}



.card:hover{

transform:translateY(-8px);

box-shadow:

0 20px 40px rgba(43,27,18,.15);

}



.card-img{

height:300px;
overflow:hidden;

}



.card-img img{

width:100%;
height:100%;
object-fit:cover;

}



.card-body{

padding:22px;

}



.card-body h3{

font-size:25px;

}



.card-body p{

color:#6b5140;
min-height:70px;

}



.price{

font-size:23px;
font-weight:bold;
color:var(--brass);
margin:15px 0;

}



.product-actions{

display:flex;
gap:10px;
align-items:center;

}



.product-qty{

width:70px;
padding:12px;
border-radius:25px;
border:1px solid var(--brass);
text-align:center;

}



.order-btn{

flex:1;
padding:13px;
border:none;
border-radius:30px;
background:var(--espresso);
color:white;
cursor:pointer;
font-weight:bold;

}



/* ===== لماذا VelaLight ===== */


.grid-why{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:25px;

}



.why-item{

background:var(--ivory);
padding:25px;
border-radius:18px;
text-align:center;

}



.icon{

font-size:40px;
margin-bottom:15px;

}



/* ===== من نحن ===== */


.about-box{

background:var(--ivory);
padding:35px;
border-radius:25px;
text-align:center;

}



.about-box h2{

font-size:42px;
margin-bottom:20px;

}



.about-box p{

font-size:19px;
color:#6b5140;

}



/* ===== العطور ===== */


.scent-groups{

display:grid;
grid-template-columns:repeat(3,1fr);
gap:25px;

}



.scent-group{

background:var(--ivory);
padding:25px;
border-radius:20px;

}



.scent-group h3{

color:var(--espresso);
margin-bottom:15px;

}



.scent-item{

display:flex;
justify-content:space-between;
background:white;
padding:12px;
margin-bottom:8px;
border-radius:10px;

}



.name{

font-weight:bold;

}



.desc{

font-size:14px;
color:#806654;

}



/* ===== المناسبات والهدايا ===== */


.grid-occ,
.grid-gift{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:25px;

}



.occ-card,
.gift-item{

background:var(--ivory);
padding:25px;
border-radius:18px;
text-align:center;

}



/* ===== آراء العملاء ===== */


.polaroid-row{

display:grid;
grid-template-columns:repeat(5,1fr);
gap:15px;

}



.polaroid{

background:white;
padding:10px;
border-radius:10px;

}



.polaroid img{

height:220px;
width:100%;
object-fit:cover;
border-radius:8px;

}



/* ===== السوشيال والفوتر ===== */


.social-links{

display:flex;
justify-content:center;
gap:15px;
margin-top:20px;

}



.social-links a{

background:var(--espresso);
color:white;
padding:10px 20px;
border-radius:30px;

}



footer{

padding:40px 0;
background:var(--espresso);
color:white;
text-align:center;

}



/* ===== أزرار عائمة ===== */


.wa-float{

position:fixed;
bottom:25px;
left:25px;
width:60px;
height:60px;
border-radius:50%;
background:#25D366;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
z-index:900;

}



.floating-cart{

position:fixed;
bottom:95px;
right:25px;
width:60px;
height:60px;
border-radius:50%;
border:none;
background:linear-gradient(
135deg,
var(--brass),
var(--espresso)
);
color:white;
font-size:25px;
cursor:pointer;
z-index:900;

}



/* ===== الموبايل ===== */


@media(max-width:900px){

.grid-products,
.grid-why,
.grid-occ,
.grid-gift{

grid-template-columns:repeat(2,1fr);

}


.scent-groups{

grid-template-columns:1fr;

}


.polaroid-row{

grid-template-columns:repeat(2,1fr);

}


.hero h1{

font-size:38px;

}

}



@media(max-width:600px){

.wrap{

padding:0 15px;

}


.nav{

flex-direction:column;
gap:15px;
padding:15px 0;

}


.grid-products,
.grid-why,
.grid-occ,
.grid-gift{

grid-template-columns:1fr;

}


.hero-img{

width:100%;
height:auto;

}

}
