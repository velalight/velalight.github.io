<style>
:root{
--cream:#F6EDE0;
--ivory:#FFFBF3;
--cocoa:#2B1B12;
--espresso:#4A2E1E;
--brass:#B8874A;
--brass-light:#D9AE71;
--line:rgba(43,27,18,.12);
--gold:#C9A15A;
--green:#25D366;
--red:#c0392b;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
overflow-x:hidden;
width:100%;
scroll-padding-top:90px;
}

body{
font-family:'Tajawal',sans-serif;
background:var(--cream);
color:var(--cocoa);
line-height:1.9;
overflow-x:hidden;
width:100%;
}

h1,h2,h3,h4{
font-family:'Cormorant Garamond','Amiri',serif;
font-weight:600;
letter-spacing:.3px;
}

img{
max-width:100%;
display:block;
}

a{
color:inherit;
text-decoration:none;
}

button{
font-family:'Tajawal',sans-serif;
}

.wrap{
max-width:1120px;
margin:auto;
padding:0 24px;
}

::selection{
background:var(--brass);
color:white;
}

/* Accessibility */
a:focus-visible,
button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
[tabindex]:focus-visible{
outline:3px solid var(--brass);
outline-offset:3px;
border-radius:6px;
}

@media(prefers-reduced-motion: reduce){
*{
animation-duration:.001s !important;
transition-duration:.001s !important;
}
}

.reveal{
opacity:0;
transform:translateY(30px);
transition:opacity .7s ease, transform .7s ease;
}

.reveal.active{
opacity:1;
transform:translateY(0);
}

@keyframes flashHighlight{
0%{ box-shadow:0 0 0 0 rgba(184,135,74,.7); }
100%{ box-shadow:0 0 0 18px rgba(184,135,74,0); }
}

.flash{
animation:flashHighlight 1s ease-out;
}

/* ===== HEADER ===== */
header{
background:rgba(246,237,224,.92);
backdrop-filter:blur(14px);
-webkit-backdrop-filter:blur(14px);
border-bottom:1px solid rgba(184,135,74,.25);
position:sticky;
top:0;
z-index:1000;
}

.nav{
min-height:62px;
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
padding:10px 0;
}

.logo{
font-size:26px;
font-family:'Cormorant Garamond','Amiri',serif;
font-weight:700;
color:var(--espresso);
display:flex;
align-items:center;
gap:8px;
letter-spacing:1px;
}

.logo small{
display:block;
font-family:'Tajawal',sans-serif;
font-size:9px;
letter-spacing:2.5px;
font-weight:500;
opacity:.65;
text-transform:uppercase;
}

.flame{
display:inline-block;
width:15px;
height:20px;
background:var(--brass);
border-radius:50% 50% 50% 0;
transform:rotate(-45deg);
margin:0 5px;
transform-origin:bottom center;
animation:flicker 2.4s ease-in-out infinite;
}

@keyframes flicker{
0%,100%{ transform:rotate(-45deg) scale(1); }
25%{ transform:rotate(-38deg) scale(1.06); }
50%{ transform:rotate(-50deg) scale(.94); }
75%{ transform:rotate(-40deg) scale(1.03); }
}

/* زر الهامبرجر */
.hamburger-btn{
width:44px;
height:44px;
border-radius:50%;
border:1px solid rgba(184,135,74,.3);
background:var(--ivory);
cursor:pointer;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:4px;
padding:0;
transition:.3s;
}

.hamburger-btn:hover{
background:var(--espresso);
}

.hamburger-btn:hover .hb-line{
background:var(--brass-light);
}

.hb-line{
width:18px;
height:2px;
background:var(--espresso);
border-radius:2px;
transition:.3s;
}

.nav-buttons{
display:flex;
gap:10px;
align-items:center;
}

.cart-open-btn,
.account-open-btn,
.wishlist-open-btn{
position:relative;
font-size:0;
width:44px;
height:44px;
padding:0;
justify-content:center;
border-radius:50%;
background:var(--ivory);
border:1px solid rgba(184,135,74,.3);
cursor:pointer;
display:flex;
align-items:center;
transition:.25s;
}

.cart-open-btn:hover,
.account-open-btn:hover,
.wishlist-open-btn:hover{
background:var(--espresso);
color:var(--brass-light);
}

.cart-open-btn::before{
content:"🛒";
font-size:18px;
}

.account-open-btn::before{
content:"👤";
font-size:17px;
}

.account-open-btn.logged-in{
background:linear-gradient(135deg,var(--brass),var(--brass-light));
border-color:transparent;
color:var(--cocoa);
}

.wishlist-open-btn::before{
content:"🤍";
font-size:17px;
}

.wishlist-open-btn.has-items::before{
content:"❤️";
}

#cartCount,
#wishlistCount{
position:absolute;
top:-5px;
left:-5px;
background:var(--espresso);
color:white;
min-width:19px;
height:19px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:11px;
font-weight:bold;
padding:0 4px;
}

@keyframes bump{
0%{ transform:scale(1); }
35%{ transform:scale(1.5); }
65%{ transform:scale(.9); }
100%{ transform:scale(1); }
}

.bump{
animation:bump .45s ease;
}

/* ===== القائمة الجانبية (Slide-in Menu) ===== */
.side-menu-overlay{
position:fixed;
inset:0;
background:rgba(20,14,10,.55);
backdrop-filter:blur(8px);
-webkit-backdrop-filter:blur(8px);
z-index:1998;
opacity:0;
pointer-events:none;
transition:.4s;
}

.side-menu-overlay.active{
opacity:1;
pointer-events:auto;
}

.side-menu{
position:fixed;
top:0;
right:-380px;
width:min(380px,85vw);
height:100vh;
background:var(--ivory);
z-index:1999;
padding:30px 24px;
box-shadow:-20px 0 50px rgba(0,0,0,.2);
transition:right .45s cubic-bezier(.4,0,.2,1);
overflow-y:auto;
display:flex;
flex-direction:column;
}

.side-menu.active{
right:0;
}

.side-menu-header{
display:flex;
justify-content:space-between;
align-items:center;
padding-bottom:20px;
border-bottom:1px solid var(--line);
margin-bottom:20px;
}

.side-menu-header .logo{
font-size:22px;
}

.close-menu-btn{
width:36px;
height:36px;
border-radius:50%;
border:1px solid var(--line);
background:transparent;
color:var(--espresso);
font-size:18px;
cursor:pointer;
transition:.2s;
}

.close-menu-btn:hover{
background:var(--espresso);
color:var(--ivory);
}

.menu-category{
font-size:11px;
letter-spacing:2px;
color:var(--brass);
font-weight:700;
text-transform:uppercase;
margin:18px 0 10px;
}

.menu-links{
list-style:none;
display:flex;
flex-direction:column;
gap:2px;
}

.menu-links a,
.menu-links button{
display:flex;
align-items:center;
gap:12px;
padding:12px 14px;
border-radius:12px;
color:var(--cocoa);
font-weight:500;
font-size:15px;
transition:.25s;
background:transparent;
border:none;
width:100%;
text-align:right;
cursor:pointer;
font-family:inherit;
}

.menu-links a:hover,
.menu-links button:hover{
background:rgba(184,135,74,.1);
color:var(--espresso);
transform:translateX(-4px);
}

.menu-links i{
width:22px;
color:var(--brass);
font-size:14px;
}

.menu-social{
margin-top:auto;
padding-top:20px;
border-top:1px solid var(--line);
display:flex;
justify-content:center;
gap:10px;
}

.menu-social a{
width:42px;
height:42px;
border-radius:50%;
background:var(--espresso);
color:var(--ivory);
display:flex;
align-items:center;
justify-content:center;
transition:.3s;
}

.menu-social a:hover{
background:var(--brass);
transform:translateY(-3px);
}

/* ===== HERO - فخامة حقيقية ===== */
.hero{
position:relative;
min-height:78vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
overflow:hidden;
padding:60px 0;
}

.hero-bg{
position:absolute;
inset:0;
background-image:url('https://velalight.github.io/eeeee.jpg');
background-size:cover;
background-position:center;
filter:blur(2px) brightness(.55);
transform:scale(1.08);
animation:heroBreath 18s ease-in-out infinite;
z-index:0;
}

@keyframes heroBreath{
0%,100%{ transform:scale(1.08); }
50%{ transform:scale(1.14); }
}

.hero-overlay{
position:absolute;
inset:0;
background:linear-gradient(180deg,rgba(20,14,10,.5) 0%,rgba(20,14,10,.72) 100%);
z-index:1;
}

.hero-content{
position:relative;
z-index:2;
color:var(--ivory);
max-width:780px;
padding:0 24px;
}

.hero-eyebrow{
color:var(--brass-light);
font-size:13px;
letter-spacing:4px;
font-weight:500;
text-transform:uppercase;
margin-bottom:18px;
opacity:.9;
}

.hero h1{
font-size:clamp(34px,6vw,64px);
line-height:1.15;
color:var(--ivory);
margin-bottom:22px;
font-weight:500;
}

.hero h1 span{
color:var(--brass-light);
font-style:italic;
}

.hero-sub{
font-size:clamp(15px,2vw,19px);
color:rgba(255,251,243,.85);
max-width:580px;
margin:0 auto 36px;
line-height:1.8;
}

.hero-cta-row{
display:flex;
gap:14px;
justify-content:center;
flex-wrap:wrap;
}

.hero-cta{
display:inline-flex;
align-items:center;
gap:10px;
padding:16px 36px;
border-radius:999px;
background:linear-gradient(135deg,var(--brass),var(--brass-light));
color:var(--cocoa);
font-weight:700;
font-size:16px;
letter-spacing:.5px;
transition:.35s;
border:none;
cursor:pointer;
text-decoration:none;
