<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VelaLight - الشموع المصنوعة يدوياً</title>
  
  <style>
    /* ==========================================================================
       1. VARS & RESET
       ========================================================================== */
    :root {
      --bg: #faf7f2;
      --card-bg: #ffffff;
      --brass: #c5a059;
      --brass-dark: #a38141;
      --text: #2c2523;
      --text-light: #6b5140;
      --red: #d9534f;
      --border: #e8e1d7;
      --shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); direction: rtl; line-height: 1.5; padding-bottom: 40px; }

    /* ==========================================================================
       2. HEADER & CAROUSEL STRIPS
       ========================================================================== */
    .site-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 25px; background: var(--card-bg); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow);
    }
    .logo { font-size: 22px; font-weight: bold; color: var(--text); }
    .search-bar input { padding: 10px 15px; border: 1px solid var(--border); border-radius: 20px; width: 250px; outline: none; }
    .header-actions button {
      margin-right: 8px; padding: 8px 14px; cursor: pointer; border-radius: 6px;
      border: 1px solid var(--border); background: white; font-weight: bold; transition: 0.2s;
    }
    .header-actions button:hover { background: var(--bg); }
    .header-actions button.logged-in { border-color: var(--brass); color: var(--brass-dark); }
    .header-actions button.has-items { border-color: var(--red); color: var(--red); }

    .mini-carousel-section { overflow: hidden; background: #f3ece1; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .mini-carousel-track { display: flex; gap: 15px; animation: scrollTrack 25s linear infinite; width: max-content; }
    .mini-carousel-item { display: flex; align-items: center; gap: 8px; background: white; padding: 5px 12px; border-radius: 15px; cursor: pointer; font-size: 13px; }
    .mini-carousel-item img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
    @keyframes scrollTrack { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

    .recent-strip-section { padding: 15px 25px; background: #fff; border-bottom: 1px solid var(--border); }
    .viewed-mini-row { display: flex; gap: 12px; overflow-x: auto; padding-top: 10px; }
    .viewed-mini { text-align: center; cursor: pointer; min-width: 70px; }
    .viewed-mini img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; }
    .viewed-mini span { display: block; font-size: 11px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70px; }

    .controls-bar { display: flex; justify-content: flex-end; align-items: center; padding: 15px 25px; gap: 10px; }
    .controls-bar select { padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); outline: none; }

    /* ==========================================================================
       3. PRODUCTS GRID & CARD
       ========================================================================== */
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; padding: 25px; }
    .product-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); transition: transform 0.2s;
    }
    .product-card:hover { transform: translateY(-3px); }
    .product-card.flash { animation: highlightFlash 1.2s ease; }
    @keyframes highlightFlash { 0%, 100% { box-shadow: var(--shadow); } 50% { box-shadow: 0 0 20px var(--brass); } }

    .card-slider { position: relative; width: 100%; height: 220px; overflow: hidden; background: #eee; }
    .slider-track { display: flex; height: 100%; transition: transform 0.3s ease; }
    .slider-track img { width: 100%; height: 100%; object-fit: cover; flex-shrink: 0; cursor: pointer; }
    .slider-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.7); border: none; padding: 8px; cursor: pointer; border-radius: 50%; }
    .slider-arrow.prev { right: 8px; } .slider-arrow.next { left: 8px; }
    .slider-dots { position: absolute; bottom: 8px; width: 100%; display: flex; justify-content: center; gap: 5px; }
    .slider-dots span { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.5); }
    .slider-dots span.active { background: var(--brass); }

    .wishlist-btn { position: absolute; top: 10px; left: 10px; background: white; border: none; padding: 6px; border-radius: 50%; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    .quickview-trigger { width: 100%; padding: 6px; background: #f0e6d2; border: none; font-size: 12px; cursor: pointer; color: var(--text-light); }

    .card-body { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-body h3 { font-size: 16px; margin-bottom: 5px; }
    .rating-row { font-size: 12px; color: #8a725c; margin-bottom: 8px; display: flex; gap: 5px; align-items: center; }
    .stars { color: #f5a623; }
    .desc { font-size: 13px; color: var(--text-light); margin-bottom: 12px; flex-grow: 1; }
    
    .field-label { font-size: 12px; font-weight: bold; margin-top: 5px; }
    .customer-input { width: 100%; padding: 8px 10px; margin: 4px 0; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; }
    .stock-tag { font-size: 11px; margin-bottom: 5px; font-weight: bold; }
    .stock-tag.in { color: green; } .stock-tag.out { color: var(--red); }
    .price-tag { font-size: 16px; font-weight: bold; color: var(--brass-dark); margin-bottom: 10px; }

    .product-actions { display: flex; gap: 8px; margin-bottom: 6px; }
    .product-qty { width: 50px; text-align: center; border: 1px solid var(--border); border-radius: 6px; }
    .order-btn { flex: 1; background: var(--brass); color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .buy-now-btn { width: 100%; background: #4a3b32; color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 10px; }

    .reviews-list { font-size: 12px; border-top: 1px solid var(--border); padding-top: 8px; display: none; }
    .reviews-list.open { display: block; }
    .related-row { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
    .related-row span { font-size: 11px; color: var(--text-light); }

    /* ==========================================================================
       4. SIDE PANELS, MODALS & UTILS
       ========================================================================== */
    .side-panel {
      position: fixed; top: 0; left: -360px; width: 320px; height: 100%; background: white;
      box-shadow: 2px 0 15px rgba(0,0,0,0.15); transition: left 0.3s ease; z-index: 1000; display: flex; flex-direction: column;
    }
    .side-panel.active { left: 0; }
    .panel-header { padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .panel-header button { background: none; border: none; font-size: 18px; cursor: pointer; }
    .panel-body { padding: 15px; flex-grow: 1; overflow-y: auto; }
    .panel-footer { padding: 15px; border-top: 1px solid var(--border); background: #faf8f5; }

    .cart-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999; }
    .cart-overlay.active { display: block; }

    .cart-item { display: flex; gap: 10px; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .cart-thumb { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; }
    .cart-item-body { flex-grow: 1; }
    .qty-btn { padding: 2px 8px; border: 1px solid var(--border); background: white; cursor: pointer; border-radius: 4px; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1001; justify-content: center; align-items: center; }
    .modal.active { display: flex; }
    .modal-content { background: white; padding: 20px; border-radius: 12px; max-width: 450px; width: 90%; position: relative; max-height: 90vh; overflow-y: auto; }
    .close-modal { position: absolute; top: 10px; left: 10px; background: none; border: none; font-size: 18px; cursor: pointer; }

    .toast { position: fixed; bottom: -50px; right: 20px; background: var(--text); color: white; padding: 10px 20px; border-radius: 20px; font-size: 13px; transition: bottom 0.3s; z-index: 2000; }
    .toast.show { bottom: 20px; }

    #topBtn { display: none; position: fixed; bottom: 20px; left: 20px; padding: 10px 14px; background: var(--brass); color: white; border: none; border-radius: 50%; cursor: pointer; z-index: 100; }

    .image-viewer { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 3000; justify-content: center; align-items: center; }
    .image-viewer img { max-width: 90%; max-height: 80vh; border-radius: 8px; }
    .close-viewer { position: absolute; top: 20px; right: 20px; color: white; font-size: 30px; cursor: pointer; }
    .viewer-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2); color: white; border: none; padding: 15px; cursor: pointer; font-size: 20px; border-radius: 50%; }
    .viewer-nav.prev { right: 20px; } .viewer-nav.next { left: 20px; }
    .viewer-counter { position: absolute; bottom: 20px; color: white; font-size: 14px; }

    .account-tabs { display: flex; gap: 5px; margin-bottom: 15px; border-bottom: 1px solid var(--border); }
    .account-tab-btn { flex: 1; padding: 8px; background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; font-size: 12px; }
    .account-tab-btn.active { border-bottom-color: var(--brass); font-weight: bold; color: var(--brass-dark); }
    .account-panel-view { display: none; }
    .account-panel-view.active { display: block; }
    .order-history-item { background: #fcfbfa; border: 1px solid var(--border); padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 12px; }
  </style>
</head>
<body>

  <!-- الهيدر -->
  <header class="site-header">
    <div class="logo">🕯️ VelaLight</div>
    <div class="search-bar">
      <input type="text" id="headerSearch" placeholder="ابحث عن شمعتك المفضلة...">
    </div>
    <div class="header-actions">
      <button id="accountOpenBtn" onclick="openAccount()">الحساب 👤</button>
      <button id="wishlistOpenBtn" onclick="openWishlist()">الأمنيات <span id="wishlistCount">0</span> 🤍</button>
      <button id="cartOpenBtn" onclick="openCart()">السلة <span id="cartCount">0</span> 🛒</button>
    </div>
  </header>

  <!-- الشريط المتحرك -->
  <section class="mini-carousel-section">
    <div class="mini-carousel-track" id="miniCarouselTrack"></div>
  </section>

  <!-- المشاهدة مؤخراً -->
  <section id="recentStripSection" style="display:none;" class="recent-strip-section">
    <h4 style="font-size:13px; color:var(--text-light);">شاهدتها مؤخراً 👁️</h4>
    <div id="homeRecentStrip" class="viewed-mini-row"></div>
  </section>

  <!-- الترتيب والفلترة -->
  <div class="controls-bar">
    <label for="sortSelect" style="font-size:13px;">ترتيب حسب:</label>
    <select id="sortSelect">
      <option value="default">الافتراضي</option>
      <option value="price-low">السعر: من الأقل للأعلى</option>
      <option value="price-high">السعر: من الأعلى للأقل</option>
      <option value="rating">الأعلى تقييماً</option>
    </select>
  </div>

  <!-- شبكة المنتجات -->
  <main class="products-grid" id="productsGrid"></main>

  <button id="topBtn" onclick="goTop()">⬆</button>
  <div id="toast" class="toast"></div>
  <div id="cartOverlay" class="cart-overlay" onclick="closeCart(); closeWishlist(); closeAccount();"></div>

  <!-- لوحة السلة -->
  <aside id="cartPanel" class="side-panel">
    <div class="panel-header">
      <h3>سلة التسوق 🛒</h3>
      <button onclick="closeCart()">✖</button>
    </div>
    <div id="cartItems" class="panel-body"></div>
    <div class="panel-footer">
      <div style="font-weight:bold; margin-bottom:10px;">الإجمالي: <span id="cartTotal">0</span> جنيه</div>
      <hr style="margin-bottom:10px; border:none; border-top:1px solid var(--border);">
      <h4 style="font-size:13px; margin-bottom:6px;">بيانات الشحن والدفع 🚚</h4>
      <input type="text" id="customerName" class="customer-input" placeholder="الاسم بالكامل">
      <input type="tel" id="customerPhone" class="customer-input" placeholder="رقم الهاتف">
      <textarea id="customerAddress" class="customer-input" placeholder="عنوان التسليم بالتفصيل" rows="2"></textarea>
      
      <label class="field-label">طريقة الدفع:</label>
      <select id="paymentMethod" class="customer-input">
        <option value="InstaPay">InstaPay (مقدمًا)</option>
        <option value="Vodafone Cash">فودافون كاش (مقدمًا)</option>
      </select>
      
      <input type="text" id="customDetails" class="customer-input" placeholder="تفاصيل خاصة (اختياري)">
      <textarea id="customerNote" class="customer-input" placeholder="ملاحظات إضافية" rows="1"></textarea>
      
      <button class="buy-now-btn" style="background:#25D366; margin-top:10px;" onclick="sendWhatsApp()">إرسال الطلب عبر واتساب 💬</button>
    </div>
  </aside>

  <!-- لوحة قائمة الأمنيات -->
  <aside id="wishlistPanel" class="side-panel">
    <div class="panel-header">
      <h3>قائمة الأمنيات 🤍</h3>
      <button onclick="closeWishlist()">✖</button>
    </div>
    <div id="wishlistItems" class="panel-body"></div>
  </aside>

  <!-- لوحة الحساب -->
  <aside id="accountPanel" class="side-panel">
    <div class="panel-header">
      <h3>حسابي 👤</h3>
      <button onclick="closeAccount()">✖</button>
    </div>
    <div class="panel-body">
      <div id="accountLoggedOutView">
        <p style="font-size:13px; margin-bottom:10px;">يرجى إدخال بياناتك لتسهيل الطلبات القادمة:</p>
        <input type="text" id="accName" class="customer-input" placeholder="الاسم">
        <input type="tel" id="accPhone" class="customer-input" placeholder="رقم الهاتف">
        <textarea id="accAddress" class="customer-input" placeholder="العنوان المفضّل"></textarea>
        <button class="order-btn" style="width:100%; margin-top:10px;" onclick="saveAccount()">حفظ البيانات 💾</button>
      </div>

      <div id="accountLoggedInView" style="display:none;">
        <h4 style="margin-bottom:10px;">أهلاً بك، <span id="accGreetName"></span> ✨</h4>
        <div class="account-tabs">
          <button class="account-tab-btn active" data-view="accOrdersView">طلباتي السابقة</button>
          <button class="account-tab-btn" data-view="accViewedView">منتجات شاهدتها</button>
        </div>
        
        <div id="accOrdersView" class="account-panel-view active">
          <div id="ordersList"></div>
        </div>
        
        <div id="accViewedView" class="account-panel-view">
          <h5 style="font-size:12px; margin-bottom:5px;">شاهدتها مؤخراً:</h5>
          <div id="viewedList"></div>
          <h5 style="font-size:12px; margin:15px 0 5px;">مقترحات لك:</h5>
          <div id="recommendList"></div>
        </div>

        <button onclick="logoutAccount()" style="margin-top:20px; background:none; border:none; color:var(--red); cursor:pointer; font-size:12px;">تسجيل الخروج ✖</button>
      </div>
    </div>
  </aside>

  <!-- مودال المعاينة السريعة -->
  <div id="quickViewModal" class="modal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeQuickView()">✖</button>
      <div id="quickViewContent"></div>
    </div>
  </div>

  <!-- عارض الصور المكبرة -->
  <div id="imageViewer" class="image-viewer" onclick="closeImage()">
    <span class="close-viewer">&times;</span>
    <button class="viewer-nav prev" onclick="event.stopPropagation(); viewerNav(-1);">&#10094;</button>
    <img id="bigImage" src="" alt="صورة مكبرة">
    <button class="viewer-nav next" onclick="event.stopPropagation(); viewerNav(1);">&#10095;</button>
    <div id="viewerCounter" class="viewer-counter"></div>
  </div>

  <!-- مودال الخروج -->
  <div id="exitModal" class="modal">
    <div class="modal-content" style="text-align:center;">
      <button class="close-modal" onclick="closeExitModal()">✖</button>
      <h3>انتظر! 🕯️</h3>
      <p style="font-size:13px; margin:10px 0;">لديك منتجات في السلة، هل تريد إتمام طلبك الآن قبل النفاد؟</p>
      <button class="order-btn" style="width:100%;" onclick="closeExitModal(); openCart();">الذهاب للسلة 🛒</button>
    </div>
  </div>

  <!-- ==========================================================================
     5. JAVASCRIPT LOGIC
     ========================================================================== -->
  <script>
    const PRODUCTS = [
      {
        id: 1,
        name: "شمعة اللافندر العطرية",
        price: 150,
        inStock: true,
        stockCount: 5,
        rating: 4.8,
        reviewsCount: 12,
        desc: "شمعة مصنوعة يدوياً من صويا طبيعية 100% برائحة اللافندر الصافي المهدئة للأعصاب.",
        images: ["https://picsum.photos/400/300?random=1", "https://picsum.photos/400/300?random=11"],
        scents: ["لافندر صافي", "لافندر مع بابونج", "لافندر مع فانيليا"],
        reviews: ["رائحة ممتازة جداً وتدوم طويلاً!", "التغليف رائع والمنتج أصلـي."],
        relatedIds: [2]
      },
      {
        id: 2,
        name: "شمعة الفانيليا والدارسين",
        price: 180,
        inStock: true,
        stockCount: 2,
        rating: 4.9,
        reviewsCount: 8,
        desc: "توليفة دافئة تجمع بين حلاوة الفانيليا ولمسة القرفة اللطيفة لأجواء دافئة.",
        images: ["https://picsum.photos/400/300?random=2", "https://picsum.photos/400/300?random=22"],
        scents: ["فانيليا قرفة", "فانيليا كراميل"],
        reviews: ["أفضل شمعة للشتاء بلا منازع."],
        relatedIds: [1]
      }
    ];

    let sliderState = {};
    let currentQuery = "";
    let currentSort = "default";

    function starsHTML(rating) {
      let full = Math.floor(rating);
      let str = "";
      for(let i=0; i<full; i++) str += "★";
      if(rating % 1 !== 0) str += "½";
      return str;
    }

    function scentOptionsHTML(p) {
      return p.scents.map(function(s){
        return '<option value="' + s + '">' + s + '</option>';
      }).join("");
    }

    function priceHTML(p) {
      return '<div class="price-tag">' + p.price + ' جنيه</div>';
    }

    function stockHTML(p) {
      if(!p.inStock) return '<div class="stock-tag out">غير متوفر حالياً ❌</div>';
      if(p.stockCount <= 3) return '<div class="stock-tag out">متبقي ' + p.stockCount + ' قطع فقط! ⏳</div>';
      return '<div class="stock-tag in">متوفر في المخزون ✔</div>';
    }

    function reviewsHTML(p) {
      if(!p.reviews || p.reviews.length === 0) return "";
      let items = p.reviews.map(function(r){ return '<li style="margin-bottom:4px;">"' + r + '"</li>'; }).join("");
      return '<button class="quickview-trigger" style="margin-top:8px;" data-action="toggle-reviews" data-id="' + p.id + '">آراء العملاء (' + p.reviews.length + ') 👇</button>' +
             '<ul class="reviews-list" id="reviews-' + p.id + '">' + items + '</ul>';
    }

    function relatedHTML(p) {
      if(!p.relatedIds || p.relatedIds.length === 0) return "";
      let links = p.relatedIds.map(function(relId){
        let rel = PRODUCTS.find(function(x){ return x.id === relId; });
        return rel ? '<a href="#" data-action="goto" data-id="' + rel.id + '" style="color:var(--brass-dark);margin-left:8px;">' + rel.name + '</a>' : "";
      }).join("");
      return '<div class="related-row"><span>منتجات ترشيحات:</span> ' + links + '</div>';
    }

    function sliderHTML(p) {
      let imgs = p.images.map(function(src, idx){
        return '<img src="' + src + '" alt="' + p.name + '" data-action="zoom" data-id="' + p.id + '" data-idx="' + idx + '" loading="lazy">';
      }).join("");

      let dots = p.images.map(function(_, idx){
        return '<span class="' + (idx === 0 ? 'active' : '') + '"></span>';
      }).join("");

      let arrows = p.images.length > 1 ?
        '<button class="slider-arrow prev" data-action="slide" data-id="' + p.id + '" data-dir="-1">&#10095;</button>' +
        '<button class="slider-arrow next" data-action="slide" data-id="' + p.id + '" data-dir="1">&#10094;</button>' : '';

      let isWish = velaWishlist.indexOf(p.id) !== -1;

      return '<div class="card-slider" id="slider-' + p.id + '">' +
        '<div class="slider-track" id="track-' + p.id + '">' + imgs + '</div>' +
        arrows +
        '<div class="slider-dots">' + dots + '</div>' +
        '<button class="wishlist-btn" data-action="wishlist" data-id="' + p.id + '">' + (isWish ? '❤️' : '🤍') + '</button>' +
        '</div>';
    }

    function getVisibleProducts(){
      let list = PRODUCTS.filter(function(p){
        return p.name.includes(currentQuery) || p.desc.includes(currentQuery);
      });

      if(currentSort === "price-low") list.sort((a,b) => a.price - b.price);
      else if(currentSort === "price-high") list.sort((a,b) => b.price - a.price);
      else if(currentSort === "rating") list.sort((a,b) => b.rating - a.rating);

      return list;
    }

    function cardHTML(p) {
      let disabled = !p.inStock ? "disabled" : "";
      let btnLabel = p.inStock ? "أضف للسلة 🛒" : "نفدت الكمية ❌";
      let buyLabel = p.inStock ? "شراء الآن ⚡" : "غير متوفر";

      return '<div class="product-card" id="prod-' + p.id + '">' +
        sliderHTML(p) +
        '<button class="quickview-trigger" data-action="quickview" data-id="' + p.id + '">معاينة سريعة 👁️</button>' +
        '<div class="card-body">' +
        '<h3>' + p.name + '</h3>' +
        '<div class="rating-row"><span class="stars">' + starsHTML(p.rating) + '</span><span>(' + p.rating + ')</span></div>' +
        '<p class="desc">' + p.desc + '</p>' +
        '<div class="field-label">اختاري العطر المفضّل:</div>' +
        '<select class="customer-input" id="scent-' + p.id + '" ' + disabled + '>' + scentOptionsHTML(p) + '</select>' +
        stockHTML(p) + priceHTML(p) +
        '<div class="product-actions">' +
        '<input type="number" class="product-qty" id="qty-' + p.id + '" value="1" min="1" max="10" ' + disabled + '>' +
        '<button class="order-btn" data-action="add-cart" data-id="' + p.id + '" ' + disabled + '>' + btnLabel + '</button>' +
        '</div>' +
        '<button class="buy-now-btn" data-action="buy-now" data-id="' + p.id + '" ' + disabled + '>' + buyLabel + '</button>' +
        reviewsHTML(p) + relatedHTML(p) +
        '</div></div>';
    }

    function renderProducts(){
      let container = document.getElementById("productsGrid");
      let list = getVisibleProducts();
      if(list.length === 0){
        container.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:40px;">عذرًا، لم نجد نتائج تطابق بحثك 🕯️</div>';
        return;
      }
      let html = "";
      list.forEach(function(p){
        html += cardHTML(p);
        if(!sliderState[p.id]) sliderState[p.id] = { current: 0, count: p.images.length };
      });
      container.innerHTML = html;
    }

    function renderMiniCarousel(){
      let track = document.getElementById("miniCarouselTrack");
      if(!track) return;
      let items = PRODUCTS.concat(PRODUCTS); 
      track.innerHTML = items.map(function(p){
        return '<div class="mini-carousel-item" data-action="goto" data-id="' + p.id + '">' +
          '<img src="' + p.images[0] + '" alt="' + p.name + '">' +
          '<span>' + p.name + '</span></div>';
      }).join("");
    }

    /* Global State & LocalStorage */
    let velaCart = JSON.parse(localStorage.getItem("velaCart") || "[]");
    let velaWishlist = JSON.parse(localStorage.getItem("velaWishlist") || "[]");
    let velaAccount = JSON.parse(localStorage.getItem("velaAccount") || "null");
    let velaRecentViews = JSON.parse(localStorage.getItem("velaRecentViews") || "[]");
    let velaOrders = JSON.parse(localStorage.getItem("velaOrders") || "[]");

    let currentGalleryImages = [];
    let currentGalleryIndex = 0;

    function updateCartUI(){
      document.getElementById("cartCount").innerText = velaCart.reduce((a, b) => a + b.qty, 0);
      let itemsContainer = document.getElementById("cartItems");
      let totalContainer = document.getElementById("cartTotal");

      if(velaCart.length === 0){
        itemsContainer.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-light);">السلة فارغة حاليًا 🕯️</div>';
        totalContainer.innerText = "0";
        return;
      }

      let totalPrice = 0;
      itemsContainer.innerHTML = velaCart.map(function(item, index){
        let itemTotal = item.price * item.qty;
        totalPrice += itemTotal;
        return '<div class="cart-item">' +
          '<img src="' + item.image + '" class="cart-thumb" alt="' + item.name + '">' +
          '<div class="cart-item-body">' +
          '<strong>' + item.name + '</strong>' +
          '<div style="font-size:11px;color:#8a725c;">العطر: ' + (item.scent || "لم يحدد") + '</div>' +
          '<div style="font-size:13px;color:var(--brass-dark);font-weight:bold;">' + item.price + ' جنيه</div>' +
          '<div>' +
          '<button class="qty-btn" onclick="updateQty(' + index + ', -1)">-</button>' +
          '<span style="font-weight:bold;margin:0 6px;">' + item.qty + '</span>' +
          '<button class="qty-btn" onclick="updateQty(' + index + ', 1)">+</button>' +
          '<button onclick="removeCartItem(' + index + ')" style="background:none;border:none;color:var(--red);cursor:pointer;margin-right:10px;font-size:11px;">إزالة ✖</button>' +
          '</div></div></div>';
      }).join("");
      totalContainer.innerText = totalPrice;
      localStorage.setItem("velaCart", JSON.stringify(velaCart));
    }

    function updateWishlistUI(){
      let btn = document.getElementById("wishlistOpenBtn");
      document.getElementById("wishlistCount").innerText = velaWishlist.length;
      if(velaWishlist.length > 0) btn.classList.add("has-items");
      else btn.classList.remove("has-items");

      let container = document.getElementById("wishlistItems");
      if(velaWishlist.length === 0){
        container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-light);">قائمة الأمنيات فارغة 🤍</div>';
        return;
      }

      container.innerHTML = velaWishlist.map(function(id){
        let p = PRODUCTS.find(x => x.id === id);
        return p ? '<div class="cart-item">' +
          '<img src="' + p.images[0] + '" class="cart-thumb" alt="' + p.name + '">' +
          '<div class="cart-item-body"><strong>' + p.name + '</strong>' +
          '<div style="font-size:13px;color:var(--brass-dark);font-weight:bold;">' + p.price + ' جنيه</div>' +
          '<button class="order-btn" style="padding:2px 8px;font-size:11px;margin-top:4px;" onclick="addWishlistToCart(' + p.id + ')">أضف للسلة 🛒</button>' +
          '<button onclick="toggleWishlist(' + p.id + ')" style="background:none;border:none;color:var(--red);cursor:pointer;margin-right:8px;font-size:11px;">حذف ✖</button>' +
          '</div></div>' : "";
      }).join("");
      localStorage.setItem("velaWishlist", JSON.stringify(velaWishlist));
    }

    function addWishlistToCart(id){
      addToCart(id, 1, "");
      toggleWishlist(id);
      openCart();
    }

    function addToCart(id, qty, scent){
      let p = PRODUCTS.find(x => x.id === id);
      if(!p) return;
      let existing = velaCart.find(item => item.id === id && item.scent === scent);
      if(existing) existing.qty += qty;
      else velaCart.push({ id: p.id, name: p.name, price: p.price, image: p.images[0], qty: qty, scent: scent });
      
      showToast("تمت إضافتها للسلة بنجاح! 🛒");
      updateCartUI();
    }

    function updateQty(index, change){
      if(velaCart[index]){
        velaCart[index].qty += change;
        if(velaCart[index].qty <= 0) velaCart.splice(index, 1);
        updateCartUI();
      }
    }

    function removeCartItem(index){ velaCart.splice(index, 1); updateCartUI(); }
    function clearCart(){ velaCart = []; updateCartUI(); }

    function toggleWishlist(id){
      let idx = velaWishlist.indexOf(id);
      if(idx === -1){ velaWishlist.push(id); showToast("تمت الإضافة لقائمة الأمنيات 🤍"); }
      else { velaWishlist.splice(idx, 1); showToast("تمت الإزالة من قائمة الأمنيات"); }
      updateWishlistUI(); renderProducts();
    }

    function showToast(msg){
      let t = document.getElementById("toast");
      t.innerText = msg; t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2500);
    }

    function openCart(){ document.getElementById("cartPanel").classList.add("active"); document.getElementById("cartOverlay").classList.add("active"); }
    function closeCart(){ document.getElementById("cartPanel").classList.remove("active"); document.getElementById("cartOverlay").classList.remove("active"); }
    function openWishlist(){ document.getElementById("wishlistPanel").classList.add("active"); document.getElementById("cartOverlay").classList.add("active"); updateWishlistUI(); }
    function closeWishlist(){ document.getElementById("wishlistPanel").classList.remove("active"); document.getElementById("cartOverlay").classList.remove("active"); }
    function openAccount(){ document.getElementById("accountPanel").classList.add("active"); document.getElementById("cartOverlay").classList.add("active"); renderAccountUI(); }
    function closeAccount(){ document.getElementById("accountPanel").classList.remove("active"); document.getElementById("cartOverlay").classList.remove("active"); }

    function renderAccountUI(){
      let loggedOut = document.getElementById("accountLoggedOutView");
      let loggedIn = document.getElementById("accountLoggedInView");
      let accBtn = document.getElementById("accountOpenBtn");

      if(velaAccount){
        loggedOut.style.display = "none"; loggedIn.style.display = "block"; accBtn.classList.add("logged-in");
        document.getElementById("accGreetName").innerText = velaAccount.name;
        document.getElementById("customerName").value = velaAccount.name || "";
        document.getElementById("customerPhone").value = velaAccount.phone || "";
        document.getElementById("customerAddress").value = velaAccount.address || "";
        renderOrdersList(); renderViewedList();
      } else {
        loggedOut.style.display = "block"; loggedIn.style.display = "none"; accBtn.classList.remove("logged-in");
      }
    }

    function saveAccount(){
      let name = document.getElementById("accName").value.trim();
      let phone = document.getElementById("accPhone").value.trim();
      let address = document.getElementById("accAddress").value.trim();
      if(!name || !phone){ alert("يرجى كتابة الاسم ورقم الهاتف على الأقل 🙏"); return; }
      velaAccount = { name: name, phone: phone, address: address };
      localStorage.setItem("velaAccount", JSON.stringify(velaAccount));
      showToast("تم تسجيل بياناتك بنجاح ✨"); renderAccountUI();
    }

    function logoutAccount(){ velaAccount = null; localStorage.removeItem("velaAccount"); renderAccountUI(); }

    function renderOrdersList(){
      let container = document.getElementById("ordersList");
      if(velaOrders.length === 0){ container.innerHTML = '<div style="text-align:center;color:var(--text-light);padding:10px;">لا توجد طلبات سابقة بعد 🕯️</div>'; return; }
      container.innerHTML = velaOrders.map(o => `
        <div class="order-history-item">
          <div>📅 ${o.date}</div>
          <div>${o.items.map(i => i.name + ' (' + i.qty + ')').join('<br>')}</div>
          <strong>الإجمالي: ${o.total} جنيه</strong>
        </div>
      `).join('');
    }

    function renderViewedList(){
      let container = document.getElementById("viewedList");
      let recContainer = document.getElementById("recommendList");
      if(velaRecentViews.length === 0){ container.innerHTML = '<div style="text-align:center;color:var(--text-light);">لم تشاهد منتجات بعد</div>'; }
      else {
        container.innerHTML = '<div class="viewed-mini-row">' + velaRecentViews.map(id => {
          let p = PRODUCTS.find(x => x.id === id);
          return p ? '<div class="viewed-mini" data-action="goto" data-id="' + p.id + '"><img src="' + p.images[0] + '"><span>' + p.name + '</span></div>' : '';
        }).join('') + '</div>';
      }
      let unviewed = PRODUCTS.filter(x => velaRecentViews.indexOf(x.id) === -1).slice(0, 3);
      recContainer.innerHTML = unviewed.map(p => '<div class="viewed-mini" data-action="goto" data-id="' + p.id + '"><img src="' + p.images[0] + '"><span>' + p.name + '</span></div>').join('');
    }

    function trackProductView(id){
      let idx = velaRecentViews.indexOf(id);
      if(idx !== -1) velaRecentViews.splice(idx, 1);
      velaRecentViews.unshift(id);
      if(velaRecentViews.length > 6) velaRecentViews.pop();
      localStorage.setItem("velaRecentViews", JSON.stringify(velaRecentViews));
      updateRecentStripUI();
    }

    function updateRecentStripUI(){
      let stripSec = document.getElementById("recentStripSection");
      let container = document.getElementById("homeRecentStrip");
      if(velaRecentViews.length === 0){ stripSec.style.display = "none"; return; }
      stripSec.style.display = "block";
      container.innerHTML = velaRecentViews.map(id => {
        let p = PRODUCTS.find(x => x.id === id);
        return p ? '<div class="viewed-mini" data-action="goto" data-id="' + p.id + '"><img src="' + p.images[0] + '"><span>' + p.name + '</span></div>' : '';
      }).join('');
    }

    function sendWhatsApp(){
      if(velaCart.length === 0){ alert("السلة فارغة، أضف بعض الشموع أولاً 🕯️"); return; }
      let name = document.getElementById("customerName").value.trim();
      let phone = document.getElementById("customerPhone").value.trim();
      let address = document.getElementById("customerAddress").value.trim();
      let payMethod = document.getElementById("paymentMethod").value;
      let customDetails = document.getElementById("customDetails").value.trim();
      let note = document.getElementById("customerNote").value.trim();

      if(!name || !phone || !address){ alert("برجاء ملء البيانات الأساسية (الاسم، الهاتف، العنوان) 🙏"); return; }

      let msg = "أهلاً VelaLight 🕯️، حابب أعمل أوردر جديد:\n\n";
      let total = 0;
      velaCart.forEach(function(item, i){
        let lineTotal = item.price * item.qty;
        total += lineTotal;
        msg += (i+1) + ". " + item.name + " (العدد: " + item.qty + ")" + (item.scent ? " - " + item.scent : "") + " = " + lineTotal + " ج.م\n";
      });

      msg += "\n💰 إجمالي المنتجات: " + total + " جنيه";
      msg += "\n💳 طريقة الدفع: " + payMethod;
      msg += "\n\n👤 البيانات:";
      msg += "\nالاسم: " + name + "\nالهاتف: " + phone + "\nالعنوان: " + address;
      if(customDetails) msg += "\n✨ تفاصيل خاصة: " + customDetails;
      if(note) msg += "\n📝 ملاحظات: " + note;

      velaOrders.unshift({ id: Date.now(), date: new Date().toLocaleDateString('ar-EG'), items: velaCart.slice(), total: total });
      localStorage.setItem("velaOrders", JSON.stringify(velaOrders));
      velaAccount = { name: name, phone: phone, address: address };
      localStorage.setItem("velaAccount", JSON.stringify(velaAccount));

      clearCart(); closeCart();
      window.open("https://wa.me/201223526105?text=" + encodeURIComponent(msg), "_blank");
    }

    function openImageGallery(imgs, startIndex){
      currentGalleryImages = imgs; currentGalleryIndex = startIndex || 0;
      let viewer = document.getElementById("imageViewer");
      document.getElementById("bigImage").src = currentGalleryImages[currentGalleryIndex];
      updateViewerCounter(); viewer.style.display = "flex";
    }
    function closeImage(){ document.getElementById("imageViewer").style.display = "none"; }
    function viewerNav(dir){
      currentGalleryIndex = (currentGalleryIndex + dir + currentGalleryImages.length) % currentGalleryImages.length;
      document.getElementById("bigImage").src = currentGalleryImages[currentGalleryIndex];
      updateViewerCounter();
    }
    function updateViewerCounter(){
      let counter = document.getElementById("viewerCounter");
      if(currentGalleryImages.length > 1){ counter.style.display = "block"; counter.innerText = (currentGalleryIndex + 1) + " / " + currentGalleryImages.length; }
      else { counter.style.display = "none"; }
    }

    function openQuickView(id){
      let p = PRODUCTS.find(x => x.id === id);
      if(!p) return;
      trackProductView(p.id);
      document.getElementById("quickViewContent").innerHTML = `
        <img src="${p.images[0]}" style="width:100%; border-radius:8px; margin-bottom:10px;">
        <h3>${p.name}</h3>
        <p style="font-size:13px; color:var(--text-light); margin:5px 0;">${p.desc}</p>
        ${priceHTML(p)}
        <select class="customer-input" id="qv-scent-${p.id}">${scentOptionsHTML(p)}</select>
        <button class="order-btn" style="width:100%; margin-top:10px;" onclick="addToCart(${p.id}, 1, document.getElementById('qv-scent-${p.id}').value); closeQuickView();">أضف للسلة 🛒</button>
      `;
      document.getElementById("quickViewModal").classList.add("active");
    }
    function closeQuickView(){ document.getElementById("quickViewModal").classList.remove("active"); }

    function goTop(){ window.scrollTo({ top: 0, behavior: 'smooth' }); }
    window.onscroll = function(){
      document.getElementById("topBtn").style.display = (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) ? "block" : "none";
    };

    /* Events Delegation */
    document.addEventListener("click", function(e){
      let target = e.target;
      let actionBtn = target.closest("[data-action]");
      if(actionBtn){
        let action = actionBtn.getAttribute("data-action");
        let id = parseInt(actionBtn.getAttribute("data-id"));

        if(action === "slide"){
          let dir = parseInt(actionBtn.getAttribute("data-dir"));
          let state = sliderState[id];
          if(state){
            state.current = (state.current + dir + state.count) % state.count;
            document.getElementById("track-" + id).style.transform = "translateX(-" + (state.current * 100) + "%)";
            let dots = document.querySelectorAll("#slider-" + id + " .slider-dots span");
            dots.forEach((dot, idx) => dot.classList.toggle("active", idx === state.current));
          }
          return;
        }
        if(action === "zoom"){ openImageGallery(PRODUCTS.find(x => x.id === id).images, parseInt(actionBtn.getAttribute("data-idx"))||0); return; }
        if(action === "add-cart"){
          let scent = document.getElementById("scent-" + id) ? document.getElementById("scent-" + id).value : "";
          let qty = document.getElementById("qty-" + id) ? parseInt(document.getElementById("qty-" + id).value) || 1 : 1;
          addToCart(id, qty, scent); trackProductView(id); return;
        }
        if(action === "buy-now"){
          let scent = document.getElementById("scent-" + id) ? document.getElementById("scent-" + id).value : "";
          addToCart(id, 1, scent); trackProductView(id); openCart(); return;
        }
        if(action === "toggle-reviews"){ document.getElementById("reviews-" + id).classList.toggle("open"); return; }
        if(action === "wishlist"){ toggleWishlist(id); return; }
        if(action === "quickview"){ openQuickView(id); return; }
        if(action === "goto"){
          let el = document.getElementById("prod-" + id);
          if(el){ el.scrollIntoView({ behavior: "smooth", block: "center" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1200); trackProductView(id); }
          return;
        }
      }

      if(target.classList.contains("account-tab-btn")){
        let parent = target.closest(".account-tabs");
        parent.querySelectorAll(".account-tab-btn").forEach(b => b.classList.remove("active"));
        target.classList.add("active");
        document.querySelectorAll(".account-panel-view").forEach(v => v.classList.remove("active"));
        document.getElementById(target.getAttribute("data-view")).classList.add("active");
      }
    });

    document.getElementById("headerSearch").addEventListener("input", function(e){ currentQuery = e.target.value; renderProducts(); });
    document.getElementById("sortSelect").addEventListener("change", function(e){ currentSort = e.target.value; renderProducts(); });

    let exitShown = false;
    document.addEventListener("mouseleave", function(e){
      if(e.clientY < 10 && !exitShown && velaCart.length > 0){
        exitShown = true; document.getElementById("exitModal").classList.add("active");
      }
    });
    function closeExitModal(){ document.getElementById("exitModal").classList.remove("active"); }

    /* Initialization */
    window.addEventListener("DOMContentLoaded", function(){
      renderProducts(); renderMiniCarousel(); updateCartUI(); updateWishlistUI(); updateRecentStripUI();
    });
  </script>
</body>
</html>
