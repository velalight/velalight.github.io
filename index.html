<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="docTitle">VelaLight | شموع يدوية فاخرة</title>
<meta name="description" id="docDesc" content="VelaLight — شموع يدوية فاخرة بعطور مميزة وتوصيل لكل مصر">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120d0a;--card:#1c1410;--card2:#241a13;--gold:#e9c87a;--gold2:#cbb287;--txt:#f5ede0;--mut:#b8a488;--line:#33261a;--red:#d98a7e}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:'Cairo',sans-serif;line-height:1.7}
img{max-width:100%}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.container{max-width:1200px;margin:0 auto;padding:0 20px}
.btn{background:linear-gradient(135deg,#e9c87a,#c9a24d);color:#1c1208;border:0;padding:13px 28px;border-radius:12px;font-weight:700;font-size:15px;transition:.25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(233,200,122,.25)}
.btn.sm{padding:8px 16px;font-size:13px;border-radius:9px}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--line)}
h1,h2,h3{font-weight:900}
.kick{color:var(--gold);font-size:13px;letter-spacing:2px;font-weight:700;text-transform:uppercase}
.h2{font-size:clamp(26px,4vw,38px);margin:8px 0 6px}
.sub{color:var(--mut);max-width:600px;margin:0 auto}
section{padding:70px 0}
.center{text-align:center}

/* Marquee */
.marquee{background:#1a110b;border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;padding:8px 0;font-size:13px;color:var(--gold2)}
.mq-track{display:inline-block;animation:mq 30s linear infinite}
.mq{margin:0 30px}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* Header */
header{position:sticky;top:0;z-index:50;background:rgba(18,13,10,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hwrap{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 20px;max-width:1200px;margin:auto}
.logo b{font-family:'Playfair Display',serif;font-size:22px;color:var(--gold);display:block;line-height:1.1}
.logo span{font-size:11px;color:var(--mut);letter-spacing:2px}
nav.mainnav{display:flex;gap:22px;align-items:center}
nav.mainnav a{font-size:14px;font-weight:600;color:var(--txt);transition:.2s}
nav.mainnav a:hover{color:var(--gold)}
.dd{position:relative}
.dd-menu{position:absolute;top:130%;right:0;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:190px;display:none;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.dd:hover .dd-menu{display:block}
.dd-menu a{display:block;padding:8px 12px;border-radius:8px;font-size:13px}
.dd-menu a:hover{background:var(--card)}
.hicons{display:flex;gap:10px;align-items:center}
.iconbtn{background:var(--card2);border:1px solid var(--line);color:var(--txt);width:42px;height:42px;border-radius:12px;font-size:17px;position:relative}
.iconbtn:hover{border-color:var(--gold)}
.cartN{position:absolute;top:-6px;left:-6px;background:var(--gold);color:#1c1208;font-size:11px;font-weight:800;min-width:19px;height:19px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.burger{display:none}

/* Hero */
.hero{padding:90px 0 70px;background:radial-gradient(ellipse at 50% -20%,#33261a 0%,var(--bg) 60%)}
.hgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(34px,5.5vw,58px);line-height:1.25;margin:14px 0}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{color:var(--mut);max-width:520px;margin-bottom:26px}
.hbtns{display:flex;gap:12px;flex-wrap:wrap}
.himg{border-radius:26px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 70px rgba(0,0,0,.5)}
.himg img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:60px}
.trust div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:center;font-size:13.5px;font-weight:600}

/* Filters */
.filters{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:26px 0}
.chip{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:9px 18px;border-radius:99px;font-size:13.5px;font-weight:600;transition:.2s}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--gold);color:#1c1208;border-color:var(--gold)}
.filters2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:30px}
.filters2 input,.filters2 select{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:9px 14px;border-radius:10px;font-family:inherit;font-size:13px;width:130px}

/* Products grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:22px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:.25s}
.pcard:hover{transform:translateY(-5px);border-color:#4a3a26;box-shadow:0 18px 44px rgba(0,0,0,.45)}
.pimg{position:relative;display:block;overflow:hidden}
.pimg img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;transition:.4s}
.pcard:hover .pimg img{transform:scale(1.05)}
.badge{position:absolute;top:12px;right:12px;background:var(--gold);color:#1c1208;font-size:11.5px;font-weight:800;padding:5px 12px;border-radius:99px}
.disc{position:absolute;top:12px;left:12px;background:var(--red);color:#fff;font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:99px}
.pinfo{padding:16px}
.pinfo h3{font-size:16px;margin-bottom:4px}
.pmeta{color:var(--mut);font-size:12.5px;margin-bottom:10px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pprice{font-weight:800;color:var(--gold);font-size:16px}
.pprice s{color:var(--mut);font-weight:400;font-size:12.5px;margin-inline-start:6px}

/* About */
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.agrid img{border-radius:24px;border:1px solid var(--line)}
.stats{display:flex;gap:26px;margin-top:26px;flex-wrap:wrap}
.stats div b{font-size:26px;color:var(--gold);display:block}
.stats div span{font-size:13px;color:var(--mut)}

/* Scents */
.sgrid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:28px}
.scent{background:var(--card);border:1px solid var(--line);padding:10px 18px;border-radius:99px;font-size:13.5px}

/* Occasions */
.ogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:30px}
.ocard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;position:relative}
.ocard i{font-family:'Playfair Display',serif;font-style:normal;font-size:34px;color:var(--gold);opacity:.5}
.ocard h3{margin:8px 0 6px;font-size:17px}
.ocard p{color:var(--mut);font-size:13.5px}

/* Features */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:30px}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.fcard b{color:var(--gold);font-size:15px;display:block;margin-bottom:6px}
.fcard p{color:var(--mut);font-size:13.5px}

/* FAQ */
.faq{max-width:760px;margin:26px auto 0}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:18px 20px}
summary{font-weight:700;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
details p{color:var(--mut);margin-top:10px;font-size:14px}

/* Reviews */
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:30px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.rcard .stars{color:var(--gold);margin-bottom:8px}
.rcard p{font-size:13.5px;color:var(--txt)}
.rcard b{display:block;margin-top:12px;font-size:13px;color:var(--gold2)}

/* Footer */
footer{background:#0d0906;border-top:1px solid var(--line);padding:56px 0 22px;margin-top:40px}
.fcols{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.2fr;gap:30px}
footer h4{color:var(--gold);margin-bottom:12px;font-size:15px}
footer a,footer p,footer span{display:block;color:var(--mut);font-size:13.5px;margin-bottom:8px}
footer a:hover{color:var(--gold)}
.rights{text-align:center;color:var(--mut);font-size:12.5px;margin-top:36px;padding-top:18px;border-top:1px solid var(--line)}
.paybox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.paybox b{color:var(--gold);font-size:13.5px}
.paybox p{margin:6px 0 0;font-size:12.5px}

/* Drawer / Modals */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;display:none;backdrop-filter:blur(3px)}
.overlay.on{display:block}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(430px,100%);background:#171009;border-right:1px solid var(--line);z-index:100;transform:translateX(-105%);transition:.3s;overflow-y:auto}
[dir="ltr"] .drawer{left:auto;right:0;border-right:0;border-left:1px solid var(--line);transform:translateX(105%)}
.drawer.on{transform:translateX(0)}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#171009;z-index:2}
.dhead button{background:none;border:0;color:var(--mut);font-size:18px}
.ditems{padding:16px 20px}
.citem{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.citem img{width:64px;height:64px;border-radius:10px;object-fit:cover}
.citem .ci{flex:1}
.citem h4{font-size:13.5px}
.citem small{color:var(--mut);font-size:12px;display:block}
.citem .price{color:var(--gold);font-weight:700;font-size:13.5px}
.qty{display:flex;align-items:center;gap:8px;margin-top:6px}
.qty button{width:26px;height:26px;border-radius:8px;background:var(--card2);border:1px solid var(--line);color:var(--txt)}
.qty button:hover{border-color:var(--gold)}
.citem .rm{background:none;border:0;color:var(--red);font-size:15px}
.dform{padding:6px 20px 30px}
.dform h4{margin:14px 0 10px;font-size:14px;color:var(--gold)}
.dform input,.dform select,.dform textarea{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:12px 14px;font-family:inherit;font-size:13.5px;margin-bottom:10px}
.dform textarea{min-height:64px;resize:vertical}
.paynote{background:var(--card);border:1px dashed var(--gold2);border-radius:11px;padding:12px;font-size:12.5px;color:var(--mut);margin-bottom:12px}
.totals{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;font-size:14px}
.totals div{display:flex;justify-content:space-between;margin-bottom:5px}
.totals div:last-child{color:var(--gold);font-weight:800;border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.modal{position:fixed;inset:0;z-index:110;display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.mbox{background:#171009;border:1px solid var(--line);border-radius:20px;width:min(560px,100%);max-height:85vh;overflow-y:auto;padding:24px}
.mbox .dhead{position:static;background:none;border-bottom:1px solid var(--line);padding:0 0 14px;margin-bottom:14px}

/* Search */
.searchwrap input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:14px;font-family:inherit;font-size:15px}
.searchwrap small{color:var(--mut);display:block;margin-top:10px;font-size:12px}

/* Chat */
.chat-fab{position:fixed;bottom:22px;left:22px;z-index:80;width:58px;height:58px;border-radius:99px;background:linear-gradient(135deg,#e9c87a,#c9a24d);color:#1c1208;border:0;font-size:24px;box-shadow:0 10px 30px rgba(233,200,122,.35)}
[dir="ltr"] .chat-fab{left:auto;right:22px}
.chat-box{position:fixed;bottom:92px;left:22px;z-index:85;width:min(360px,calc(100vw - 44px));background:#171009;border:1px solid var(--line);border-radius:20px;display:none;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.55)}
[dir="ltr"] .chat-box{left:auto;right:22px}
.chat-box.on{display:flex}
.chat-head{padding:14px 16px;background:var(--card2);display:flex;justify-content:space-between;align-items:center}
.chat-head b{color:var(--gold);font-size:14px;display:block}
.chat-head span{font-size:11px;color:var(--mut)}
.chat-head button{background:none;border:0;color:var(--mut)}
.chat-msgs{padding:14px;height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:9px 13px;border-radius:14px;font-size:13px;white-space:pre-line}
.msg.bot{background:var(--card);border:1px solid var(--line);align-self:flex-start}
.msg.user{background:var(--gold);color:#1c1208;align-self:flex-end;font-weight:600}
.chat-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.chat-chips button{background:var(--card);border:1px solid var(--line);color:var(--gold2);font-size:11.5px;padding:6px 10px;border-radius:99px}
.chat-input{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.chat-input input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:13px}
.chat-input button{background:var(--gold);border:0;color:#1c1208;border-radius:10px;width:44px;font-size:16px}

/* Toasts */
#toasts{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--card2);border:1px solid var(--gold);color:var(--txt);padding:12px 18px;border-radius:12px;font-size:13.5px;animation:tin .3s;box-shadow:0 10px 30px rgba(0,0,0,.4)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media(max-width:900px){
 nav.mainnav{display:none}
 .burger{display:block}
 .hgrid,.agrid,.fcols{grid-template-columns:1fr}
 .trust{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<!-- الشريط المتحرك -->
<div class="marquee"><div class="mq-track">
<span class="mq"></span><span class="mq"></span><span class="mq"></span><span class="mq"></span><span class="mq"></span><span class="mq"></span>
</div></div>

<!-- الهيدر -->
<header>
 <div class="hwrap">
  <a class="logo" href="index.html"><b>VelaLight</b><span>Luxury Candle Studio</span></a>
  <nav class="mainnav">
   <a href="index.html" data-i18n="nav_home"></a>
   <div class="dd">
    <a href="#products" data-i18n="nav_shop"></a>
    <div class="dd-menu" id="navCats"></div>
   </div>
   <a href="#about-us" data-i18n="nav_about"></a>
   <a href="#faq-section" data-i18n="nav_faq"></a>
   <a href="contact.html" data-i18n="nav_contact"></a>
  </nav>
  <div class="hicons">
   <button class="iconbtn" onclick="openSearch()">🔍</button>
   <button class="iconbtn" onclick="openAccount()">👤</button>
   <button class="iconbtn" onclick="openCart()">🛍️<span class="cartN" id="cartCount">0</span></button>
   <button class="iconbtn" id="langBtn" onclick="toggleLang()">EN</button>
  </div>
 </div>
</header>

<!-- الهيرو -->
<div class="hero">
 <div class="container">
  <div class="hgrid">
   <div>
    <div class="kick" data-i18n="hero_kick"></div>
    <h1><span data-i18n="hero_a"></span><br><em data-i18n="hero_b"></em></h1>
    <p data-i18n="hero_lead"></p>
    <div class="hbtns">
     <a href="#products" class="btn" data-i18n="cta_shop"></a>
     <a href="#about-us" class="btn ghost" data-i18n="cta_story"></a>
    </div>
   </div>
   <div class="himg"><img id="heroImg" src="" alt="VelaLight"></div>
  </div>
  <div class="trust">
   <div>🚚 <span data-i18n="trust1"></span></div>
   <div>🤲 <span data-i18n="trust2"></span></div>
   <div>🎁 <span data-i18n="trust3"></span></div>
   <div>🔁 <span data-i18n="trust4"></span></div>
  </div>
 </div>
</div>

<!-- المنتجات -->
<section id="products">
 <div class="container center">
  <div class="kick">The Collection</div>
  <h2 class="h2" data-i18n="prod_h2"></h2>
  <div class="filters" id="catChips"></div>
  <div class="filters2">
   <input type="number" id="priceFrom" data-i18n-ph="from_ph" oninput="renderProducts()">
   <input type="number" id="priceTo" data-i18n-ph="to_ph" oninput="renderProducts()">
   <select id="sortSel" onchange="renderProducts()"></select>
  </div>
  <div class="pgrid" id="gridProducts" style="text-align:initial"></div>
 </div>
</section>

<!-- من نحن -->
<section id="about-us" style="background:#0f0a07">
 <div class="container">
  <div class="agrid">
   <div><img id="aboutImg" src="" alt="Our Story" onerror="this.style.display='none'"></div>
   <div>
    <div class="kick">Our Story</div>
    <h2 class="h2" data-i18n="about_h2"></h2>
    <p style="color:var(--mut);margin-bottom:12px" data-i18n="about_p1"></p>
    <p style="color:var(--mut)" data-i18n="about_p2"></p>
    <div class="stats">
     <div><b>+500</b><span data-i18n="stat_clients"></span></div>
     <div><b>19</b><span data-i18n="stat_scents"></span></div>
     <div><b>100%</b><span data-i18n="stat_hand"></span></div>
    </div>
   </div>
  </div>
 </div>
</section>

<!-- العطور -->
<section id="scents" class="center">
 <div class="container">
  <div class="kick">Signature Scents</div>
  <h2 class="h2" data-i18n="scents_h2"></h2>
  <p class="sub" data-i18n="scents_sub"></p>
  <div class="sgrid" id="scentGrid"></div>
 </div>
</section>

<!-- المناسبات -->
<section id="occasions" style="background:#0f0a07" class="center">
 <div class="container">
  <div class="kick">Gifts & Occasions</div>
  <h2 class="h2" data-i18n="occ_h2"></h2>
  <div class="ogrid" style="text-align:initial">
   <div class="ocard"><i>01</i><h3 data-i18n="occ1t"></h3><p data-i18n="occ1d"></p></div>
   <div class="ocard"><i>02</i><h3 data-i18n="occ2t"></h3><p data-i18n="occ2d"></p></div>
   <div class="ocard"><i>03</i><h3 data-i18n="occ3t"></h3><p data-i18n="occ3d"></p></div>
   <div class="ocard"><i>04</i><h3 data-i18n="occ4t"></h3><p data-i18n="occ4d"></p></div>
  </div>
 </div>

<!-- لماذا VelaLight -->
<section id="features" class="center">
 <div class="container">
  <div class="kick">Why VelaLight?</div>
  <h2 class="h2" data-i18n="feat_h2"></h2>
  <div class="fgrid" style="text-align:initial">
   <div class="fcard"><b data-i18n="feat1t"></b><p data-i18n="feat1d"></p></div>
   <div class="fcard"><b data-i18n="feat2t"></b><p data-i18n="feat2d"></p></div>
   <div class="fcard"><b data-i18n="feat3t"></b><p data-i18n="feat3d"></p></div>
   <div class="fcard"><b data-i18n="feat4t"></b><p data-i18n="feat4d"></p></div>
   <div class="fcard"><b data-i18n="feat5t"></b><p data-i18n="feat5d"></p></div>
   <div class="fcard"><b data-i18n="feat6t"></b><p data-i18n="feat6d"></p></div>
  </div>
 </div>
</section>

<!-- الأسئلة الشائعة -->
<section id="faq-section" style="background:#0f0a07" class="center">
 <div class="container">
  <div class="kick">FAQs</div>
  <h2 class="h2" data-i18n="faq_h2"></h2>
  <div class="faq" style="text-align:initial" id="faqList"></div>
 </div>
</section>

<!-- آراء العملاء -->
<section id="reviews" class="center">
 <div class="container">
  <div class="kick">Testimonials</div>
  <h2 class="h2" data-i18n="rev_h2"></h2>
  <p class="sub" data-i18n="rev_sub"></p>
  <div class="rgrid" style="text-align:initial" id="revGrid"></div>
 </div>
</section>

<!-- الفوتر -->
<footer>
 <div class="container">
  <div class="fcols">
   <div>

<!-- السلة -->
<div class="overlay" id="overlay" onclick="closeAll()"></div>
<aside class="drawer" id="cartDrawer">
 <div class="dhead"><b data-i18n="cart_title"></b><button onclick="closeAll()">✕</button></div>
 <div class="ditems" id="cartItems"></div>
 <div class="dform">
  <h4 data-i18n="delivery_h"></h4>
  <input id="dName" data-i18n-ph="ph_name">
  <input id="dPhone" data-i18n-ph="ph_phone" type="tel">
  <select id="dCity"></select>
  <textarea id="dAddr" data-i18n-ph="ph_addr"></textarea>
  <textarea id="dNotes" data-i18n-ph="ph_notes"></textarea>
  <h4 data-i18n="paymethod_h"></h4>
  <div class="paynote" data-i18n="paymethod_d"></div>
  <div class="totals">
   <div><span data-i18n="subtotal"></span><span id="subT"></span></div>
   <div><span data-i18n="shipping"></span><span id="shipT"></span></div>
   <div><span data-i18n="total"></span><span id="totT"></span></div>
  </div>
  <button class="btn full" onclick="checkout()" data-i18n="checkout_wa"></button>
  <button class="btn ghost full" style="margin-top:8px" onclick="emptyCart()" data-i18n="empty_cart"></button>
 </div>
</aside>

<!-- حسابي -->
<div class="modal" id="accModal">
 <div class="mbox">
  <div class="dhead"><b data-i18n="acc_title"></b><button onclick="closeAll()">✕</button></div>
  <p style="color:var(--mut);font-size:13.5px;margin-bottom:14px" data-i18n="acc_sub"></p>
  <div class="dform" style="padding:0">
   <input id="aName" data-i18n-ph="ph_name">
   <input id="aPhone" data-i18n-ph="ph_phone" type="tel">
   <select id="aCity"></select>
   <textarea id="aAddr" data-i18n-ph="ph_addr"></textarea>
   <button class="btn full" onclick="saveAccount()" data-i18n="save_acc"></button>
   <p style="margin-top:14px;font-size:13.5px;color:var(--gold)" id="accOrders"></p>
  </div>
 </div>
</div>

<!-- البحث -->
<div class="modal" id="searchModal">
 <div class="mbox searchwrap">
  <div class="dhead"><b data-i18n="search_title"></b><button onclick="closeAll()">✕</button></div>
  <input id="searchIn" data-i18n-ph="search_ph" onkeydown="if(event.key==='Enter')doSearch()">
  <small data-i18n="search_help"></small>
  <button class="btn full" style="margin-top:14px" onclick="doSearch()">🔍</button>
 </div>
</div>

<!-- الشات -->
<button class="chat-fab" onclick="toggleChat()">💬</button>
<div class="chat-box" id="chatBox">
 <div class="chat-head">
  <div><b data-i18n="chat_name"></b><span data-i18n="chat_sub"></span></div>
  <button onclick="toggleChat()">✕</button>
 </div>
 <div class="chat-msgs" id="chatMsgs"></div>
 <div class="chat-chips">
  <button onclick="chatAsk('q_gift')" data-i18n="q_gift"></button>
  <button onclick="chatAsk('q_relax')" data-i18n="q_relax"></button>
  <button onclick="chatAsk('q_scents')" data-i18n="q_scents"></button>
  <button onclick="chatAsk('q_ship')" data-i18n="q_ship"></button>
  <button onclick="chatAsk('q_bride')" data-i18n="q_bride"></button>
 </div>
 <div class="chat-input">
  <input id="chatIn" onkeydown="if(event.key==='Enter')sendChat()">
  <button onclick="sendChat()">➤</button>
 </div>

<div id="toasts"></div>

<script src="data.js"></script>
<script type="module" src="firebase.js"></script>
<script>
/* ═══════ الحالة ═══════ */
let curCat="all",searchQ="",curSort="new";

/* ═══════ اللغة ═══════ */
function applyLang(){
 document.documentElement.lang=LANG;
 document.documentElement.dir=LANG==="en"?"ltr":"rtl";
 document.title=t("docTitle");
 const md=$("#docDesc");if(md)md.content=t("docDesc");
 $("#langBtn").textContent=LANG==="ar"?"EN":"عربي";
 $$("[data-i18n]").forEach(el=>{el.textContent=t(el.dataset.i18n)});
 $$("[data-i18n-ph]").forEach(el=>{el.placeholder=t(el.dataset.i18nPh)});
 $$(".mq").forEach(el=>el.textContent=t("mq"));
 $("#heroImg").src=CDN("RR.jpg");
 $("#aboutImg").src=CDN("heart2.jpg");
 renderNavCats();renderFootCats();renderChips();renderSort();renderScents();renderGovs();renderFaq();renderReviews();renderProducts();renderCart();
}
function toggleLang(){LANG=LANG==="ar"?"en":"ar";localStorage.setItem("vl_lang",LANG);applyLang()}

/* ═══════ التصنيفات ═══════ */
function renderNavCats(){$("#navCats").innerHTML=Object.keys(CATS[LANG]).map(k=>`<a href="#products" onclick="setCat('${k}')">${CATS[LANG][k]}</a>`).join("")}
function renderFootCats(){$("#footCats").innerHTML=Object.keys(CATS[LANG]).filter(k=>k!=="all").map(k=>`<a href="#products" onclick="setCat('${k}')">${CATS[LANG][k]}</a>`).join("")}
function renderChips(){$("#catChips").innerHTML=Object.keys(CATS[LANG]).map(k=>`<button class="chip ${curCat===k?'on':''}" onclick="setCat('${k}')">${CATS[LANG][k]}</button>`).join("")}
function setCat(k){curCat=k;searchQ="";renderChips();renderProducts()}

/* ═══════ الترتيب ═══════ */
function renderSort(){
 const s=$("#sortSel");const v=s.value||curSort;
 s.innerHTML=`
 <option value="new">${t("sort_new")}</option>
 <option value="asc">${t("sort_asc")}</option>
 <option value="desc">${t("sort_desc")}</option>
 <option value="rating">${t("sort_rating")}</option>
 <option value="best">${t("sort_best")}</option>
 <option value="disc">${t("sort_disc")}</option>`;
 s.value=v;curSort=v;
}

/* ═══════ المنتجات (من data.js — نفس مصدر الأدمن بالظبط) ═══════ */
function renderProducts(){
 curSort=$("#sortSel").value||curSort;
 let list=[...ALL_PRODUCTS];
 if(curCat!=="all")list=list.filter(p=>p.cat===curCat);
 const fMin=parseFloat($("#priceFrom").value)||0,fMax=parseFloat($("#priceTo").value)||Infinity;
 list=list.filter(p=>p.price>=fMin&&p.price<=fMax);
 if(searchQ){
  const q=searchQ.toLowerCase();
  list=list.filter(p=>[p.name,p.nameEn,p.desc,p.descEn,CATS.ar[p.cat],CATS.en[p.cat],...(p.scents||[])].join(" ").toLowerCase().includes(q));
 }
 const rOf=p=>{const r=ratingOf(p.id);return r?r.avg:0};
 const sorts={new:(a,b)=>(b.createdAt||0)-(a.createdAt||0),asc:(a,b)=>a.price-b.price,desc:(a,b)=>b.price-a.price,rating:(a,b)=>rOf(b)-rOf(a),best:(a,b)=>(b.sold||0)-(a.sold||0),disc:(a,b)=>((b.old?1-b.price/b.old:0)-(a.old?1-a.price/a.old:0))};
 list.sort(sorts[curSort]||sorts.new);
 $("#gridProducts").innerHTML=list.length?list.map(card).join(""):`<p style="grid-column:1/-1;text-align:center;color:var(--mut);padding:40px">${t("no_products")}</p>`;
}
function card(p){
 const r=ratingOf(p.id);
 const disc=p.old&&p.old>p.price?Math.round((1-p.price/p.old)*100):0;
 return `<div class="pcard">
  <a class="pimg" href="product.html?id=${p.id}">
   <img src="${imgOf(p)}" alt="${pname(p)}" loading="lazy">
   ${pbadge(p)?`<span class="badge">${pbadge(p)}</span>`:""}
   ${disc?`<span class="disc">-${disc}%</span>`:""}
  </a>
  <div class="pinfo">
   <h3>${pname(p)}</h3>
   <div class="pmeta">🕯️ ${phours(p)}${r?` &nbsp;·&nbsp; ⭐ ${r.avg} (${r.count})`:""}</div>
   <div class="prow">
    <div class="pprice">${money(p.price)}${p.old>p.price?`<s>${money(p.old)}</s>`:""}</div>
    <button class="btn sm" onclick="addById('${p.id}')">${t("add_cart")}</button>
   </div>
  </div>
 </div>`;
}
function addById(id){const p=ALL_PRODUCTS.find(x=>x.id===id);if(p)addToCart(p);track("add_to_cart",{items:[{item_id:id}]})}

/* ═══════ العطور ═══════ */
function renderScents(){$("#scentGrid").innerHTML=SCENTS.map(s=>`<div class="scent">🌸 ${LANG==="ar"?s[0]:s[1]}</div>`).join("")}

/* ═══════ المحافظات ═══════ */
function renderGovs(){
 const gs=LANG==="ar"?GOVS:GOVS_EN;
 const opt=`<option value="">${LANG==="ar"?"اختاري المحافظة":"Choose governorate"}</option>`+gs.map(g=>`<option>${g}</option>`).join("");
 $("#dCity").innerHTML=opt;$("#aCity").innerHTML=opt;
}

/* ═══════ الأسئلة الشائعة ═══════ */
function renderFaq(){$("#faqList").innerHTML=[1,2,3,4,5,6].map(i=>`<details><summary>${t("faq"+i+"q")}</summary><p>${t("faq"+i+"a")} ${i===3?`<a href="exchange-policy.html" style="color:var(--gold)">${t("foot_exchange")}</a>`:""}</p></details>`).join("")}

/* ═══════ المراجعات ═══════ */
function renderReviews(){
 const rs=ALL_REVIEWS.filter(r=>r.approved!==false).slice(0,6);
 $("#revGrid").innerHTML=rs.map(r=>`<div class="rcard">
  <div class="stars">${"★".repeat(+r.rating||5)}${"☆".repeat(5-(+r.rating||5))}</div>
  <p>${r.text||""}</p>
  <b>${r.name||""} — ${t("rev_verified")}</b>
 </div>`).join("");
}

/* ═══════ السلة ═══════ */
function openCart(){renderCart();$("#cartDrawer").classList.add("on");$("#overlay").classList.add("on")}
function openAccount(){
 const u=JSON.parse(localStorage.getItem("vl_user")||"null");
 if(u){$("#aName").value=u.name||"";$("#aPhone").value=u.phone||"";$("#aAddr").value=u.address||"";
  setTimeout(()=>{if(u.city)$("#aCity").value=u.city},50);}
 const my=JSON.parse(localStorage.getItem("vl_my_orders")||"[]");
 $("#accOrders").textContent=t("orders_count")+" "+my.length;
 $("#accModal").classList.add("on");$("#overlay").classList.add("on");
}
function openSearch(){$("#searchModal").classList.add("on");$("#overlay").classList.add("on");setTimeout(()=>$("#searchIn").focus(),100)}
function closeAll(){$("#cartDrawer").classList.remove("on");$("#overlay").classList.remove("on");$("#accModal").classList.remove("on");$("#searchModal").classList.remove("on")}
function renderCart(){
 const c=getCart();
 $("#cartItems").innerHTML=c.length?c.map((i,x)=>`<div class="citem">
   <img src="${i.img}" alt="">
   <div class="ci">
    <h4>${LANG==="en"?(i.nameEn||i.name):i.name}</h4>
    <small>${t("scent_lbl")} ${i.scent}</small>
    <div class="qty">
     <button onclick="chQty(${x},-1)">−</button><span>${i.qty}</span><button onclick="chQty(${x},1)">+</button>
     <span class="price">${money(i.price*i.qty)}</span>
    </div>
   </div>
   <button class="rm" onclick="rmItem(${x})">🗑️</button>
  </div>`).join("")
  :`<p style="text-align:center;color:var(--mut);padding:30px 0">${t("cart_empty")}<br><small>${t("cart_empty_sub")}</small></p>`;
 const sub=c.reduce((a,i)=>a+i.price*i.qty,0);
 $("#subT").textContent=money(sub);
 $("#shipT").textContent=money(CFG.SHIPPING)+" "+t("ship_all");
 $("#totT").textContent=money(sub+(c.length?CFG.SHIPPING:0));
 cartBadge();
}
function chQty(x,d){const c=getCart();c[x].qty+=d;if(c[x].qty<1)c.splice(x,1);saveCart(c);renderCart()}
function rmItem(x){const c=getCart();c.splice(x,1);saveCart(c);renderCart()}
function emptyCart(){if(confirm(t("t_confirm_empty"))){saveCart([]);renderCart()}}
function saveAccount(){
 const u={name:$("#aName").value.trim(),phone:$("#aPhone").value.trim(),city:$("#aCity").value,address:$("#aAddr").value.trim()};
 localStorage.setItem("vl_user",JSON.stringify(u));
 $("#dName").value=u.name;$("#dPhone").value=u.phone;$("#dAddr").value=u.address;
 setTimeout(()=>{if(u.city)$("#dCity").value=u.city},50);
 toast(t("t_saved"));closeAll();
}

/* ═══════ الدفع ═══════ */
async function checkout(){
 const name=$("#dName").value.trim(),phone=$("#dPhone").value.trim(),city=$("#dCity").value,addr=$("#dAddr").value.trim(),notes=$("#dNotes").value.trim();
 if(!name||!phone||!addr){toast(t("t_fill"));return}
 const c=getCart();if(!c.length){toast(t("t_empty"));return}
 const sub=c.reduce((a,i)=>a+i.price*i.qty,0),total=sub+CFG.SHIPPING;
 const orderId="VL-"+Math.floor(100000+Math.random()*900000);
 const order={id:orderId,name,phone,city,address:addr,notes,items:c,subtotal:sub,shipping:CFG.SHIPPING,total,status:"قيد المراجعة",createdAt:Date.now()};
 try{await DB.add("orders",order)}catch(e){console.warn(e)}
 const my=JSON.parse(localStorage.getItem("vl_my_orders")||"[]");my.push(orderId);
 localStorage.setItem("vl_my_orders",JSON.stringify(my));
 localStorage.setItem("vl_user",JSON.stringify({name,phone,city,address:addr}));
 let msg=t("wa_head")+"\n"+t("wa_order")+orderId+"\n";
 c.forEach(i=>{msg+="\n"+t("wa_item")+(LANG==="en"?(i.nameEn||i.name):i.name)+" ×"+i.qty+" — "+t("wa_scent")+" "+i.scent});
 msg+="\n\n"+t("wa_total")+" "+money(total);
 msg+="\n"+t("wa_ship")+" "+money(CFG.SHIPPING)+" "+t("wa_cod");
 msg+="\n"+t("wa_insta")+" "+CFG.INSTAPAY.trim();
 msg+="\n\n"+t("wa_name")+" "+name+"\n"+t("wa_phone")+" "+phone+"\n"+t("wa_city")+" "+city+"\n"+t("wa_addr")+" "+addr;
 if(notes)msg+="\n"+t("wa_notes")+" "+notes;
 window.open("https://wa.me/"+String(CFG.WHATSAPP).replace(/\D/g,"")+"?text="+encodeURIComponent(msg));
 track("purchase",{value:total});
 saveCart([]);renderCart();closeAll();toast(t("t_order"));
}

/* ═══════ البحث ═══════ */
function doSearch(){
 searchQ=$("#searchIn").value.trim();closeAll();
 curCat="all";renderChips();renderProducts();
 document.getElementById("products").scrollIntoView({behavior:"smooth"});
}

/* ═══════ الشات ═══════ */
function toggleChat(){
 const b=$("#chatBox");b.classList.toggle("on");
 if(b.classList.contains("on")&&!$("#chatMsgs").children.length)addMsg(t("chat_welcome"),"bot");
}
function addMsg(txt,who){const d=document.createElement("div");d.className="msg "+who;d.textContent=txt;$("#chatMsgs").appendChild(d);$("#chatMsgs").scrollTop=1e6}
function chatAsk(k){addMsg(t(k),"user");setTimeout(()=>addMsg(t(k.replace("q_","a_")),"bot"),450)}
function sendChat(){
 const txt=$("#chatIn").value.trim();if(!txt)return;
 addMsg(txt,"user");$("#chatIn").value="";
 const s=txt.toLowerCase();let a;
 if(/هدي|هدية|gift|مناسب|عيد/.test(s))a=t("a_gift");
 else if(/استرخ|مساج|relax|spa|راحة/.test(s))a=t("a_relax");
 else if(/عطر|عطور|scent|ريح/.test(s))a=t("a_scents");
 else if(/توصيل|شحن|deliver|ship|يوصل/.test(s))a=t("a_ship");
 else if(/عروس|bride|فرح|جواز/.test(s))a=t("a_bride");
 else a=t("a_gift");
 setTimeout(()=>addMsg(a,"bot"),450);
}

/* ═══════ التشغيل ═══════ */
async function init(){
 const u=JSON.parse(localStorage.getItem("vl_user")||"null");
 if(u){$("#dName").value=u.name||"";$("#dPhone").value=u.phone||"";$("#dAddr").value=u.address||"";
  setTimeout(()=>{if(u.city)$("#dCity").value=u.city},100);}
 await loadAll();
 applyLang();
 track("view_item_list");
}
window.addEventListener("data-refresh",async()=>{await loadAll();applyLang()});
init();
</script>
</body>
