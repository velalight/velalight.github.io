<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>صفحة غير موجودة | VelaLight</title>
<meta name="theme-color" content="#faf6f0">
<link rel="stylesheet" href="style.css">
<style>
  .nf-wrap{
    min-height:80vh;
    display:grid;
    place-items:center;
    text-align:center;
    padding:2rem;
  }
  .nf-candle{
    font-size:5rem;
    animation:flick 1.7s ease-in-out infinite alternate;
    margin-bottom:1rem;
  }
  .nf-title{
    font-family:var(--fd);
    font-size:clamp(2rem,5vw,3.5rem);
    color:var(--gold2);
    margin-bottom:.5rem;
  }
  @keyframes flick{
    0%{transform:scaleY(1) rotate(-2deg)}
    50%{transform:scaleY(1.12) rotate(2deg)}
    100%{transform:scaleY(.94) rotate(-1deg)}
  }
</style>
</head>
<body>
<div class="nf-wrap">
  <div>
    <div class="nf-candle">🕯️</div>
    <h1 class="nf-title">أوبس! الشمعة انطفأت</h1>
    <p style="color:var(--mut);margin-bottom:1.5rem">
      الصفحة اللي بتدور عليها مش موجودة، بس عندنا شموع تانية هتنورلك يومك
    </p>
    <a href="/" class="btn">🏠 ارجع للرئيسية</a>
  </div>
</div>
</body>
</html>
