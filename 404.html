<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصفحة غير موجودة | VelaLight</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
--cream:#F6EDE0;
--espresso:#4A2E1E;
--brass:#B8874A;
--brass-light:#D9AE71;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
font-family:'Tajawal',sans-serif;
background:var(--cream);
color:var(--espresso);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
}
.box{ max-width:500px; }
.flame{
display:inline-block;
width:16px;
height:22px;
background:var(--brass);
border-radius:50% 50% 50% 0;
transform:rotate(-45deg);
margin-bottom:20px;
}
h1{
font-family:'Amiri',serif;
font-size:70px;
margin-bottom:10px;
}
h2{
font-family:'Amiri',serif;
font-size:26px;
margin-bottom:14px;
}
p{
color:#6b5140;
font-size:16px;
margin-bottom:26px;
line-height:1.8;
}
a{
display:inline-block;
padding:14px 30px;
border-radius:30px;
background:linear-gradient(135deg,var(--brass),var(--brass-light));
color:var(--espresso);
text-decoration:none;
font-weight:bold;
}
</style>
</head>
<body>

<div class="box">
<span class="flame"></span>
<h1>404</h1>
<h2>الصفحة اللي بتدوري عليها مش موجودة 🕯️</h2>
<p>يمكن الرابط اتغير أو الصفحة اتنقلت. ارجعي للصفحة الرئيسية وشوفي أحدث الشموع والعروض.</p>
<a href="/">الرجوع للصفحة الرئيسية</a>
</div>

</body>
</html>
