<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💛 آراء عملائنا | VelaLight</title>
  <meta name="description" content="شاهدي تجارب وآراء عملاء VelaLight الحقيقية">
  <link rel="stylesheet" href="style.css">
  
  <!-- Lightbox2 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox-plus-jquery.min.js"></script>

  <!-- AOS -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=El+Messiri:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    .reviews-page { min-height: 100vh; }
    .rev-hero { background: linear-gradient(160deg, #fcf7f0 0%, #f5ede2 100%); padding: 3.5rem 1rem 2.5rem; text-align: center; border-bottom: 1px solid var(--line); position: relative; overflow: hidden; }
    .rev-hero::after { content: '🕯️'; position: absolute; font-size: 10rem; opacity: .04; bottom: -40px; left: 5%; transform: rotate(-15deg); pointer-events: none; }
    .rev-hero h1 { font-family: var(--fd); font-size: clamp(2rem, 5vw, 3rem); margin-bottom: .5rem; color: var(--ink); }
    .rev-hero p { color: var(--mut); max-width: 600px; margin: 0 auto; font-size: 1rem; }
    .rev-hero .back-link { display: inline-block; margin-top: 1.2rem; color: var(--gold2); font-weight: 700; text-decoration: none; font-size: .9rem; transition: .3s; }
    .rev-hero .back-link:hover { transform: translateX(-4px); }

    .rev-stats { display: flex; justify-content: center; gap: 2rem; padding: 1.5rem 1rem; background: var(--panel); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .rev-stats .stat-item { text-align: center; padding: 0 1.5rem; border-inline-start: 1px solid var(--line); }
    .rev-stats .stat-item:first-child { border-inline-start: 0; }
    .rev-stats .stat-icon { font-size: 1.8rem; display: block; }
    .rev-stats .stat-label { font-size: .75rem; color: var(--mut); margin-top: .2rem; }

    .rev-gallery { width: min(1180px, 92%); margin: 0 auto; padding: 3rem 0; }
    .rev-gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.2rem; }
    .rev-gallery-grid .gallery-item { border-radius: 16px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.05); transition: all .3s ease; background: #fff; border: 1px solid var(--line); cursor: pointer; }
    .rev-gallery-grid .gallery-item:hover { transform: translateY(-6px); box-shadow: 0 15px 40px rgba(212,175,55,0.12); border-color: rgba(212,175,55,0.3); }
    .rev-gallery-grid .gallery-item img { width: 100%; height: 260px; object-fit: cover; display: block; transition: transform .4s ease; }
    .rev-gallery-grid .gallery-item:hover img { transform: scale(1.04); }
    .rev-gallery-grid .gallery-item .item-info { padding: .6rem .8rem; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); }
    .rev-gallery-grid .gallery-item .item-info .badge { color: var(--ok); font-size: .7rem; font-weight: 700; }
    .rev-gallery-grid .gallery-item .item-info .stars { color: var(--gold); font-size: .7rem; letter-spacing: 1px; }

    .rev-cta { text-align: center; padding: 3rem 1rem; background: linear-gradient(135deg, rgba(217,171,95,.08), transparent); border-top: 1px solid var(--line); }
    .rev-cta h2 { font-family: var(--fd); font-size: clamp(1.4rem, 3vw, 2rem); margin-bottom: .5rem; }
    .rev-cta p { color: var(--mut); margin-bottom: 1.5rem; }
    .rev-cta .btn { padding: .9rem 2.5rem; font-size: 1rem; }

    @media (max-width: 600px) {
      .rev-hero { padding: 2rem 1rem; }
      .rev-stats { gap: 0.5rem; padding: 1rem .5rem; }
      .rev-stats .stat-item { padding: 0 .5rem; }
      .rev-stats .stat-icon { font-size: 1.3rem; }
      .rev-stats .stat-label { font-size: .6rem; }
      .rev-gallery-grid { grid-template-columns: repeat(2, 1fr); gap: .7rem; }
      .rev-gallery-grid .gallery-item img { height: 180px; }
    }
    @media (max-width: 400px) {
      .rev-gallery-grid .gallery-item img { height: 140px; }
    }
  </style>
</head>

<body>

<main class="reviews-page">

  <section class="rev-hero" data-aos="fade-down" data-aos-duration="800">
    <h1>💛 آراء عملائنا</h1>
    <p>كل صورة هي قصة… كل قصة هي تجربة حقيقية من عميلة من عملائنا.</p>
    <a href="index.html" class="back-link">← الرجوع للرئيسية</a>
  </section>

  <section class="rev-stats" data-aos="fade-up" data-aos-delay="100">
    <div class="stat-item"><span class="stat-icon">💛</span><span class="stat-label">ثقة تتجدد</span></div>
    <div class="stat-item"><span class="stat-icon">★★★★★</span><span class="stat-label">تقييم العملاء</span></div>
    <div class="stat-item"><span class="stat-icon">🕯️</span><span class="stat-label">لحظات لا تُنسى</span></div>
  </section>

  <section class="rev-gallery" data-aos="fade-up" data-aos-delay="200">
    <div class="rev-gallery-grid" id="galleryGrid"></div>
  </section>

  <section class="rev-cta" data-aos="fade-up" data-aos-delay="300">
    <h2>🎁 جربي سحر VelaLight بنفسك</h2>
    <p>اختاري شمعتك الفاخرة واصنعي لحظتك الخاصة</p>
    <a href="index.html#products" class="btn">تسوقي الآن 🛍️</a>
  </section>

</main>

<script src="data.js"></script>
<script>
(function() {
  const grid = document.getElementById('galleryGrid');
  function renderGallery() {
    if (!grid) return;
    const images = typeof REVIEWS_IMAGES !== 'undefined' && Array.isArray(REVIEWS_IMAGES) ? REVIEWS_IMAGES : [];
    if (!images.length) {
      grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:2rem; color:var(--dim);">🕯️ لا توجد تجارب للعرض حالياً</div>`;
      return;
    }
    let html = '';
    images.forEach(function(name) {
      const url = typeof CDN === 'function' ? CDN('testimonials/' + name) : 'https://velalight.github.io/testimonials/' + encodeURIComponent(name);
      html += `
        <div class="gallery-item">
          <a href="${url}" data-lightbox="reviews-all" data-title="💛 تجربة عميلة VelaLight">
            <img src="${url}" alt="تجربة عميل VelaLight" loading="lazy">
          </a>
          <div class="item-info">
            <span class="badge">✓ عميلة موثّقة</span>
            <span class="stars">★★★★★</span>
          </div>
        </div>
      `;
    });
    grid.innerHTML = html;
    if (typeof AOS !== 'undefined') AOS.init({ duration: 800, once: true, offset: 100 });
  }
  document.addEventListener('DOMContentLoaded', renderGallery);
  const obs = new MutationObserver(renderGallery);
  obs.observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
})();
</script>

<script>
(function() {
  function applyTranslations() {
    if (typeof t !== 'function') return;
    const lang = localStorage.getItem('vl_lang') || 'ar';
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
    document.querySelectorAll('[data-i18n]').forEach(function(el) {
      const key = el.getAttribute('data-i18n');
      if (!key) return;
      const val = t(key);
      if (val && val !== key && el.textContent !== val) el.textContent = val;
    });
  }
  document.addEventListener('DOMContentLoaded', function() { setTimeout(applyTranslations, 100); });
  window.addEventListener('storage', function(e) { if (e.key === 'vl_lang') setTimeout(applyTranslations, 100); });
})();
</script>
</body>
</html>
