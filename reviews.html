  <style>
    /* ═══════════════════════════════════════════════════════
       VelaLight — REVIEWS PAGE (جدار الحب - تنسيق مضغوط)
       ═══════════════════════════════════════════════════════ */
    .reviews-page { min-height: 100vh; }

    /* ═══ الهيدر مع الإحصائيات والاقتباس في شريط واحد ═══ */
    .reviews-compact-header {
      background: radial-gradient(700px 200px at 50% -20%, rgba(217,171,95,.10), transparent 65%),
                  linear-gradient(135deg, var(--bg2) 0%, var(--bg) 100%);
      padding: 1.2rem 1rem 0.8rem;
      border-bottom: 1px solid var(--line);
      position: relative;
      overflow: hidden;
    }
    .reviews-compact-header::after {
      content: "🕯️";
      position: absolute;
      font-size: 6rem;
      opacity: .04;
      bottom: -20px;
      left: 5%;
      transform: rotate(-10deg);
      pointer-events: none;
    }

    .compact-top {
      text-align: center;
      margin-bottom: 0.4rem;
    }
    .compact-top .kick {
      display: inline-block;
      background: rgba(212,175,55,0.10);
      color: #b68d2e;
      padding: 0.15rem 0.8rem;
      border-radius: 50px;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid rgba(212,175,55,0.15);
      margin-bottom: 0.2rem;
    }
    .compact-top h1 {
      font-family: var(--fd);
      font-size: clamp(1.3rem, 3.5vw, 1.8rem);
      color: var(--ink);
      line-height: 1.2;
      margin: 0 0 0.1rem;
    }
    .compact-top p {
      color: var(--mut);
      font-size: 0.75rem;
      margin: 0;
      max-width: 480px;
      margin-inline: auto;
    }
    .compact-top .back-link {
      display: inline-block;
      margin-top: 0.3rem;
      color: var(--gold2);
      font-weight: 700;
      font-size: 0.7rem;
      text-decoration: none;
      transition: .25s;
    }
    .compact-top .back-link:hover { color: var(--gold); transform: translateX(3px); }

    /* ═══ شريط الإحصائيات والاقتباس (صف واحد) ═══ */
    .compact-stats-quote {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.4rem 1.2rem;
      padding: 0.4rem 0.5rem;
      background: rgba(255,255,255,0.5);
      backdrop-filter: blur(4px);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      margin: 0 -1rem;
      padding-inline: 1rem;
    }
    .compact-stats-quote .stat-item {
      display: flex;
      align-items: center;
      gap: 0.2rem;
      font-size: 0.7rem;
      color: var(--mut);
      white-space: nowrap;
    }
    .compact-stats-quote .stat-item .icon {
      font-size: 0.85rem;
    }
    .compact-stats-quote .stat-item .stars {
      color: var(--gold);
      font-size: 0.7rem;
      letter-spacing: 1px;
    }
    .compact-stats-quote .quote-block {
      display: flex;
      align-items: center;
      gap: 0.2rem;
      font-size: 0.7rem;
      color: var(--ink);
      font-style: italic;
      white-space: nowrap;
      border-inline-start: 1px solid var(--line);
      padding-inline-start: 0.6rem;
    }
    .compact-stats-quote .quote-block .author {
      color: var(--gold2);
      font-style: normal;
      font-weight: 600;
      font-size: 0.6rem;
    }

    /* ═══ المعرض ═══ */
    .gallery-container {
      width: min(1180px, 92%);
      margin-inline: auto;
      padding: 2rem 0;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.25rem;
    }
    .gallery-item {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 5px 16px -7px rgba(100,70,30,.12);
      transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .gallery-item:hover {
      transform: translateY(-4px);
      border-color: rgba(217,171,95,.35);
      box-shadow: 0 12px 28px -8px rgba(100,70,30,.18);
    }
    .gallery-item a {
      display: block;
      text-decoration: none;
    }
    .gallery-item img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
      background: var(--bg2);
      transition: transform .4s ease;
    }
    .gallery-item:hover img { transform: scale(1.025); }

    .gallery-item-info {
      min-height: 46px;
      padding: .5rem .7rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .4rem;
      background: var(--panel);
      border-top: 1px solid var(--line);
    }
    .gallery-item-badge {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      color: var(--ok);
      font-size: .68rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .gallery-item-stars {
      color: var(--gold);
      font-size: .7rem;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .reviews-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: var(--dim);
    }
    .reviews-empty-icon { font-size: 2rem; margin-bottom: .5rem; opacity: .7; }
    .reviews-empty p { margin: 0; font-size: .85rem; }

    .cta-section {
      text-align: center;
      padding: 2.5rem 1rem;
      background: radial-gradient(600px 200px at 50% 100%, rgba(217,171,95,.08), transparent 65%),
                  var(--bg2);
      border-top: 1px solid var(--line);
    }
    .cta-section h2 {
      font-family: var(--fd);
      font-size: clamp(1.2rem, 3vw, 1.6rem);
      color: var(--ink);
      margin-bottom: .4rem;
    }
    .cta-section p {
      color: var(--mut);
      font-size: .8rem;
      margin-bottom: 1rem;
    }
    .cta-section .btn { font-size: .9rem; padding: .7rem 1.8rem; }

    /* ═══ استجابة للشاشات الصغيرة ═══ */
    @media (max-width: 768px) {
      .reviews-compact-header { padding: 0.8rem 0.6rem 0.5rem; }
      .compact-top h1 { font-size: 1.2rem; }
      .compact-top p { font-size: 0.65rem; }
      .compact-top .back-link { font-size: 0.6rem; margin-top: 0.2rem; }
      .compact-stats-quote { gap: 0.2rem 0.6rem; padding: 0.25rem 0.3rem; flex-wrap: wrap; justify-content: center; }
      .compact-stats-quote .stat-item { font-size: 0.55rem; }
      .compact-stats-quote .stat-item .icon { font-size: 0.7rem; }
      .compact-stats-quote .stat-item .stars { font-size: 0.55rem; }
      .compact-stats-quote .quote-block { font-size: 0.55rem; padding-inline-start: 0.3rem; white-space: normal; }
      .compact-stats-quote .quote-block .author { font-size: 0.5rem; }
      .gallery-container { padding: 1.5rem 0; }
      .gallery-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7rem; }
      .gallery-item img { height: 200px; }
      .gallery-item-info { min-height: 38px; padding: .4rem .5rem; }
      .gallery-item-badge { font-size: .55rem; }
      .gallery-item-stars { font-size: .55rem; }
      .cta-section { padding: 1.8rem 1rem; }
      .cta-section h2 { font-size: 1.1rem; }
      .cta-section p { font-size: .7rem; }
    }
    @media (max-width: 400px) {
      .gallery-grid { gap: .5rem; }
      .gallery-item img { height: 150px; }
      .compact-top h1 { font-size: 1rem; }
      .compact-top p { font-size: 0.55rem; }
      .compact-stats-quote .stat-item { font-size: 0.5rem; }
      .compact-stats-quote .stat-item .icon { font-size: 0.6rem; }
      .compact-stats-quote .stat-item .stars { font-size: 0.5rem; }
      .compact-stats-quote .quote-block { font-size: 0.5rem; }
      .compact-stats-quote .quote-block .author { font-size: 0.45rem; }
      .gallery-item-info { padding: .3rem .4rem; }
      .gallery-item-badge { font-size: .5rem; }
      .gallery-item-stars { font-size: .5rem; }
    }
    @media (hover:none) and (pointer:coarse) {
      .gallery-item:hover { transform: none; box-shadow: 0 5px 16px -7px rgba(100,70,30,.12); }
      .gallery-item:hover img { transform: none; }
      .gallery-item:active { transform: scale(.985); }
    }
    @media (prefers-reduced-motion:reduce) {
      .gallery-item, .gallery-item img, .back-link { transition: none !important; }
    }
  </style>
</head>

<body>

  <main class="reviews-page">

    <!-- ═══ شريط الهيدر + الإحصائيات + الاقتباس (مضغوط جداً) ═══ -->
    <div class="reviews-compact-header">
      <div class="compact-top">
        <span class="kick">💛 ثقتكم هي تاجنا</span>
        <h1>❤️ جدار الحب</h1>
        <p>كلامكم أحلى هدية.. لقطات حقيقية من عملائنا</p>
        <a href="index.html" class="back-link">← الرجوع للرئيسية</a>
      </div>

      <div class="compact-stats-quote">
        <span class="stat-item"><span class="icon">💛</span> ثقة تتجدد</span>
        <span class="stat-item"><span class="stars">★★★★★</span> تقييم العملاء</span>
        <span class="stat-item"><span class="icon">🕯️</span> لحظات لا تُنسى</span>
        <span class="quote-block">
          “مش مجرد شمعة… دي لحظة بتتعاش!”
          <span class="author">— واحدة من عملائنا</span>
        </span>
      </div>
    </div>

    <!-- ═══ معرض الصور ═══ -->
    <section class="gallery-container" aria-label="معرض آراء العملاء">
      <div class="gallery-grid" id="galleryGrid"></div>
    </section>

    <!-- ═══ CTA ═══ -->
    <section class="cta-section">
      <h2>جاهزة تنضمي لعائلة VelaLight؟ 🕯️</h2>
      <p>اختاري شمعتك الفاخرة واصنعي لحظتك الخاصة</p>
      <a href="index.html#products" class="btn">تسوقي الآن 🛍️</a>
    </section>

  </main>

  <script src="data.js"></script>

  <script>
    (function () {
      "use strict";

      const grid = document.getElementById("galleryGrid");

      function createGalleryItem(imgName, index) {
        const imgUrl = typeof CDN === "function"
          ? CDN("testimonials/" + imgName)
          : "https://velalight.github.io/testimonials/" + encodeURIComponent(imgName);

        const item = document.createElement("article");
        item.className = "gallery-item";
        item.setAttribute("aria-label", "عميلة موثّقة " + (index + 1));

        const link = document.createElement("a");
        link.href = imgUrl;
        link.setAttribute("data-lightbox", "reviews-all");
        link.setAttribute("data-title", "💛 تجربة عميلة VelaLight");

        const img = document.createElement("img");
        img.src = imgUrl;
        img.alt = "عميلة موثّقة " + (index + 1);
        img.loading = "lazy";
        img.decoding = "async";

        const info = document.createElement("div");
        info.className = "gallery-item-info";

        const badge = document.createElement("span");
        badge.className = "gallery-item-badge";
        badge.textContent = "✓ عميلة موثّقة";

        const stars = document.createElement("span");
        stars.className = "gallery-item-stars";
        stars.textContent = "★★★★★";

        link.appendChild(img);
        item.appendChild(link);
        info.appendChild(badge);
        info.appendChild(stars);
        item.appendChild(info);

        return item;
      }

      function initGallery() {
        if (typeof REVIEWS_IMAGES === "undefined" || !Array.isArray(REVIEWS_IMAGES) || REVIEWS_IMAGES.length === 0) {
          grid.innerHTML = `
            <div class="reviews-empty">
              <div class="reviews-empty-icon">🕯️</div>
              <p>لا توجد تجارب للعرض حالياً</p>
            </div>
          `;
          return;
        }

        const fragment = document.createDocumentFragment();
        REVIEWS_IMAGES.forEach(function (imgName, index) {
          if (!imgName) return;
          fragment.appendChild(createGalleryItem(imgName, index));
        });
        grid.appendChild(fragment);
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initGallery);
      } else {
        initGallery();
      }

    })();
  </script>

  <!-- ═══ محرك الترجمة (للنصوص الثابتة) ═══ -->
  <script>
    (function() {
      "use strict";
      function applyTranslations() {
        if (typeof t !== "function") return;
        const lang = localStorage.getItem("vl_lang") || "ar";
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "en" ? "ltr" : "rtl";
        document.querySelectorAll("[data-i18n]").forEach(function(el) {
          const key = el.getAttribute("data-i18n");
          if (!key) return;
          const val = t(key);
          if (val && val !== key && el.textContent !== val) {
            el.textContent = val;
          }
        });
      }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", function() {
          setTimeout(applyTranslations, 100);
        });
      } else {
        setTimeout(applyTranslations, 100);
      }
      window.addEventListener("storage", function(e) {
        if (e.key === "vl_lang") {
          setTimeout(applyTranslations, 100);
        }
      });
    })();
  </script>

</body>
