<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آراء عملائنا | VelaLight - شموع يدوية فاخرة</title>
  <meta name="description" content="شوفي آراء عميلات VelaLight الحقيقية عن شموعنا اليدوية الفاخرة">
  
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=El+Messiri:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --c-dark: #1a1512;
      --c-gold: #d4af37;
      --c-gold2: #b68d2e;
      --c-cream: #fffcf9;
      --c-warm: #fdf5ed;
      --line: #e8e0d5;
      --mut: #6b5b4f;
      --dim: #9a8b7f;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--c-cream);
      color: var(--c-dark);
      line-height: 1.6;
    }
    
    /* Header */
    .reviews-header {
      background: linear-gradient(135deg, var(--c-warm) 0%, var(--c-cream) 100%);
      padding: 2rem 1rem 3rem;
      text-align: center;
      border-bottom: 1px solid var(--line);
    }
    
    .reviews-header h1 {
      font-family: 'El Messiri', serif;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      color: var(--c-dark);
      margin-bottom: 0.5rem;
    }
    
    .reviews-header p {
      color: var(--mut);
      font-size: 1rem;
    }
    
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 1rem;
      color: var(--c-gold2);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
    
    /* Gallery Grid */
    .gallery-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1rem;
    }
    
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    
    .gallery-item {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }
    
    .gallery-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }
    
    .gallery-item img {
      width: 100%;
      height: 350px;
      object-fit: cover;
      display: block;
    }
    
    .gallery-item-info {
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
    }
    
    .gallery-item-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.8rem;
      color: #27ae60;
      font-weight: 700;
    }
    
    .gallery-item-stars {
      color: var(--c-gold);
      font-size: 0.9rem;
    }
    
    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 10000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      cursor: zoom-out;
    }
    
    .lightbox img {
      max-width: 100%;
      max-height: 90vh;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    
    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #fff;
      border: none;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      font-size: 1.8rem;
      cursor: pointer;
      z-index: 10001;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* Stats */
    .stats-bar {
      background: #fff;
      padding: 1.5rem 1rem;
      text-align: center;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    
    .stats-grid {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      gap: 3rem;
      flex-wrap: wrap;
    }
    
    .stat-item {
      text-align: center;
    }
    
    .stat-number {
      font-size: 2rem;
      font-weight: 800;
      color: var(--c-gold2);
      display: block;
    }
    
    .stat-label {
      font-size: 0.9rem;
      color: var(--mut);
    }
    
    /* CTA Section */
    .cta-section {
      text-align: center;
      padding: 3rem 1rem;
      background: linear-gradient(135deg, var(--c-warm) 0%, var(--c-cream) 100%);
    }
    
    .cta-section h2 {
      font-family: 'El Messiri', serif;
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }
    
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--c-dark);
      color: #fff;
      padding: 14px 32px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
      transition: transform 0.3s ease;
    }
    
    .btn-primary:hover {
      transform: translateY(-3px);
    }
    
    /* Mobile */
    @media (max-width: 768px) {
      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 1rem;
      }
      
      .gallery-item img {
        height: 220px;
      }
      
      .stats-grid {
        gap: 2rem;
      }
      
      .stat-number {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="reviews-header">
    <h1>💛 آراء عملائنا</h1>
    <p>شوفي آراء عميلات VelaLight الحقيقية</p>
    <a href="index.html" class="back-link">
      ← الرجوع للرئيسية
    </a>
  </div>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stats-grid">
      <div class="stat-item">
        <span class="stat-number" id="totalReviews">0</span>
        <span class="stat-label">مراجعة موثقة</span>
      </div>
      <div class="stat-item">
        <span class="stat-number">⭐⭐⭐⭐⭐</span>
        <span class="stat-label">تقييم العملاء</span>
      </div>
      <div class="stat-item">
        <span class="stat-number">100%</span>
        <span class="stat-label">آراء حقيقية</span>
      </div>
    </div>
  </div>

  <!-- Gallery -->
  <div class="gallery-container">
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>

  <!-- CTA -->
  <div class="cta-section">
    <h2>جاهزة تنضمي لعائلتنا؟ 🕯️</h2>
    <p style="color:var(--mut); margin-bottom:1.5rem;">اطلبي شمعتك الفاخرة دلوقتي</p>
    <a href="index.html#products" class="btn-primary">
      تسوقي الآن 🛍️
    </a>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="this.style.display='none'">
    <button class="lightbox-close" onclick="document.getElementById('lightbox').style.display='none'">×</button>
    <img id="lightboxImg" src="" alt="رأي عميل">
  </div>

  <script src="data.js"></script>
  <script>
    function initGallery() {
      const grid = document.getElementById('galleryGrid');
      const totalEl = document.getElementById('totalReviews');
      
      if (typeof REVIEWS_IMAGES === 'undefined' || REVIEWS_IMAGES.length === 0) {
        grid.innerHTML = '<p style="text-align:center; color:var(--mut); grid-column:1/-1;">لا توجد آراء للعرض حالياً</p>';
        return;
      }
      
      totalEl.textContent = REVIEWS_IMAGES.length;
      
      REVIEWS_IMAGES.forEach((imgName, index) => {
        const imgUrl = typeof CDN === "function" ? CDN(`testimonials/${imgName}`) : `https://velalight.github.io/testimonials/${imgName}`;
        
        const item = document.createElement('div');
        item.className = 'gallery-item';
        item.innerHTML = `
          <img src="${imgUrl}" alt="رأي عميل #${index + 1}" loading="lazy">
          <div class="gallery-item-info">
            <span class="gallery-item-badge">✅ موثقة</span>
            <span class="gallery-item-stars">⭐⭐⭐⭐⭐</span>
          </div>
        `;
        
        item.onclick = () => {
          document.getElementById('lightbox').style.display = 'flex';
          document.getElementById('lightboxImg').src = imgUrl;
        };
        
        grid.appendChild(item);
      });
    }
    
    document.addEventListener("DOMContentLoaded", initGallery);
  </script>

</body>
</html>
