<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>آراء عملائنا | VelaLight - شموع يدوية فاخرة</title>

  <meta
    name="description"
    content="شاهدي تجارب وآراء عملاء VelaLight حول شموعنا اليدوية الفاخرة"
  >

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=El+Messiri:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    /* ═══════════════════════════════════════════════════════
       VelaLight — REVIEWS PAGE
       Uses the main site theme from style.css
       ═══════════════════════════════════════════════════════ */

    .reviews-page {
      min-height: 100vh;
    }

    /* ═══ Header ═══ */

    .reviews-header {
      background:
        radial-gradient(
          700px 300px at 50% -20%,
          rgba(217,171,95,.12),
          transparent 65%
        ),
        linear-gradient(
          135deg,
          var(--bg2) 0%,
          var(--bg) 100%
        );

      padding: 3rem 1rem 2.5rem;
      text-align: center;

      border-bottom: 1px solid var(--line);
    }

    .reviews-header h1 {
      font-family: var(--fd);
      font-size: clamp(1.7rem, 5vw, 2.5rem);
      color: var(--ink);
      line-height: 1.3;
      margin-bottom: .45rem;
    }

    .reviews-header p {
      color: var(--mut);
      font-size: .95rem;
      margin: 0;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;

      margin-top: 1rem;

      color: var(--gold2);
      font-weight: 700;
      font-size: .85rem;

      transition: .25s;

      -webkit-tap-highlight-color: transparent;
    }

    .back-link:hover {
      color: var(--gold);
      transform: translateX(3px);
    }

    /* ═══ Stats ═══ */

    .stats-bar {
      background: var(--panel);

      padding: 1.25rem 1rem;

      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .stats-grid {
      width: min(800px, 94%);
      margin: 0 auto;

      display: flex;
      justify-content: center;
      align-items: stretch;

      gap: 0;
    }

    .stat-item {
      flex: 1;
      min-width: 0;

      text-align: center;

      padding: .25rem 1.5rem;

      border-inline-start: 1px solid var(--line);
    }

    .stat-item:first-child {
      border-inline-start: 0;
    }

    .stat-number {
      display: block;

      font-family: var(--fd);
      font-size: 1.55rem;
      font-weight: 800;

      color: var(--gold2);

      line-height: 1.25;
    }

    .stat-label {
      display: block;

      margin-top: .2rem;

      color: var(--mut);
      font-size: .72rem;
    }

    /* ═══ Gallery ═══ */

    .gallery-container {
      width: min(1180px, 92%);
      margin-inline: auto;

      padding: 3rem 0;
    }

    .gallery-grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(250px, 1fr));

      gap: 1.25rem;
    }

    .gallery-item {
      position: relative;

      background: var(--panel);

      border: 1px solid var(--line);
      border-radius: 16px;

      overflow: hidden;

      box-shadow:
        0 5px 16px -7px rgba(100,70,30,.12);

      transition:
        transform .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;

      cursor: zoom-in;

      -webkit-tap-highlight-color: transparent;
    }

    .gallery-item:hover {
      transform: translateY(-4px);

      border-color: rgba(217,171,95,.35);

      box-shadow:
        0 12px 28px -8px rgba(100,70,30,.18);
    }

    .gallery-image-wrap {
      position: relative;

      background: var(--bg2);

      overflow: hidden;
    }

    .gallery-item img {
      width: 100%;
      height: 330px;

      object-fit: cover;

      display: block;

      background: var(--bg2);

      transition: transform .4s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.025);
    }

    .gallery-item-info {
      min-height: 50px;

      padding: .65rem .8rem;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: .5rem;

      background: var(--panel);

      border-top: 1px solid var(--line);
    }

    .gallery-item-badge {
      display: inline-flex;
      align-items: center;

      gap: .3rem;

      color: var(--ok);

      font-size: .72rem;
      font-weight: 700;

      white-space: nowrap;
    }

    .gallery-item-stars {
      color: var(--gold);
      font-size: .75rem;

      letter-spacing: 1px;

      white-space: nowrap;
    }

    /* ═══ Empty State ═══ */

    .reviews-empty {
      grid-column: 1 / -1;

      text-align: center;

      padding: 4rem 1rem;

      color: var(--dim);
    }

    .reviews-empty-icon {
      font-size: 2.5rem;
      margin-bottom: .7rem;
      opacity: .7;
    }

    .reviews-empty p {
      margin: 0;
      font-size: .9rem;
    }

    /* ═══ CTA ═══ */

    .cta-section {
      text-align: center;

      padding: 3.5rem 1rem;

      background:
        radial-gradient(
          600px 250px at 50% 100%,
          rgba(217,171,95,.10),
          transparent 65%
        ),
        var(--bg2);

      border-top: 1px solid var(--line);
    }

    .cta-section h2 {
      font-family: var(--fd);

      font-size: clamp(1.35rem, 4vw, 1.9rem);

      color: var(--ink);

      margin-bottom: .55rem;
    }

    .cta-section p {
      color: var(--mut);

      font-size: .85rem;

      margin-bottom: 1.25rem;
    }

    /* ═══ Lightbox ═══ */

    .lightbox {
      position: fixed;
      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 1.25rem;

      background: rgba(0,0,0,.94);

      z-index: 10000;

      cursor: zoom-out;

      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
    }

    .lightbox.open {
      display: flex;

      animation: reviewsLightboxIn .25s ease;
    }

    @keyframes reviewsLightboxIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .lightbox img {
      max-width: min(1100px, 95vw);
      max-height: 88vh;

      width: auto;
      height: auto;

      object-fit: contain;

      border-radius: 12px;

      box-shadow:
        0 20px 70px rgba(0,0,0,.55);

      cursor: default;

      user-select: none;
      -webkit-user-drag: none;

      animation: reviewsImageIn .25s ease;
    }

    @keyframes reviewsImageIn {
      from {
        opacity: 0;
        transform: scale(.97);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .lightbox-close {
      position: absolute;

      top: 18px;
      inset-inline-end: 18px;

      width: 46px;
      height: 46px;

      display: grid;
      place-items: center;

      border: 1px solid rgba(255,255,255,.25);

      border-radius: 50%;

      background: rgba(255,255,255,.12);

      color: #fff;

      font-size: 1.5rem;
      line-height: 1;

      cursor: pointer;

      transition: .25s;

      z-index: 2;
    }

    .lightbox-close:hover {
      background: rgba(255,255,255,.25);
      transform: rotate(90deg);
    }

    .lightbox-close:active {
      transform: scale(.94);
    }

    /* ═══ Mobile ═══ */

    @media(max-width:768px) {

      .reviews-header {
        padding: 2.2rem 1rem 2rem;
      }

      .reviews-header h1 {
        font-size: 1.65rem;
      }

      .reviews-header p {
        font-size: .8rem;
      }

      .back-link {
        font-size: .78rem;
      }

      .stats-bar {
        padding: 1rem .5rem;
      }

      .stats-grid {
        width: 100%;
      }

      .stat-item {
        padding: .2rem .45rem;
      }

      .stat-number {
        font-size: 1.15rem;
      }

      .stat-label {
        font-size: .6rem;
      }

      .gallery-container {
        width: 94%;
        padding: 2rem 0;
      }

      .gallery-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: .75rem;
      }

      .gallery-item {
        border-radius: 12px;
      }

      .gallery-item img {
        height: 220px;
      }

      .gallery-item-info {
        min-height: 42px;
        padding: .5rem .55rem;
      }

      .gallery-item-badge {
        font-size: .6rem;
      }

      .gallery-item-stars {
        font-size: .62rem;
        letter-spacing: .5px;
      }

      .cta-section {
        padding: 2.5rem 1rem;
      }

      .cta-section h2 {
        font-size: 1.3rem;
      }

      .cta-section p {
        font-size: .75rem;
      }

      .lightbox {
        padding: .6rem;
      }

      .lightbox img {
        max-width: 96vw;
        max-height: 84vh;
        border-radius: 9px;
      }

      .lightbox-close {
        top: 10px;
        inset-inline-end: 10px;

        width: 40px;
        height: 40px;

        font-size: 1.25rem;
      }
    }

    @media(max-width:400px) {

      .gallery-grid {
        gap: .6rem;
      }

      .gallery-item img {
        height: 190px;
      }

      .gallery-item-info {
        padding: .45rem;
      }

      .gallery-item-badge {
        font-size: .55rem;
      }

      .gallery-item-stars {
        font-size: .55rem;
      }

      .stat-number {
        font-size: 1rem;
      }

      .stat-label {
        font-size: .55rem;
      }
    }

    /* ═══ Touch ═══ */

    @media(hover:none) and (pointer:coarse) {

      .gallery-item:hover {
        transform: none;
        box-shadow:
          0 5px 16px -7px rgba(100,70,30,.12);
      }

      .gallery-item:hover img {
        transform: none;
      }

      .gallery-item:active {
        transform: scale(.985);
      }
    }

    /* ═══ Reduced Motion ═══ */

    @media(prefers-reduced-motion:reduce) {

      .gallery-item,
      .gallery-item img,
      .back-link,
      .lightbox-close {
        transition: none !important;
      }

      .lightbox.open,
      .lightbox img {
        animation: none !important;
      }
    }
  </style>
</head>

<body>

  <main class="reviews-page">

    <!-- ═══ Header ═══ -->

    <section class="reviews-header">

      <h1>💛 آراء عملائنا</h1>

      <p>
        تجارب عملاء VelaLight مع شموعنا اليدوية الفاخرة
      </p>

      <a href="index.html" class="back-link">
        ← الرجوع للرئيسية
      </a>

    </section>


    <!-- ═══ Stats ═══ -->

    <section class="stats-bar" aria-label="إحصائيات آراء العملاء">

      <div class="stats-grid">

        <div class="stat-item">

          <span
            class="stat-number"
            id="totalReviews"
          >
            0
          </span>

          <span class="stat-label">
            تجربة عميل
          </span>

        </div>


        <div class="stat-item">

          <span class="stat-number">
            ⭐⭐⭐⭐⭐
          </span>

          <span class="stat-label">
            تقييم العملاء
          </span>

        </div>


        <div class="stat-item">

          <span class="stat-number">
            VelaLight
          </span>

          <span class="stat-label">
            تجارب حقيقية من عملائنا
          </span>

        </div>

      </div>

    </section>


    <!-- ═══ Gallery ═══ -->

    <section
      class="gallery-container"
      aria-label="معرض آراء العملاء"
    >

      <div
        class="gallery-grid"
        id="galleryGrid"
      ></div>

    </section>


    <!-- ═══ CTA ═══ -->

    <section class="cta-section">

      <h2>
        جاهزة تنضمي لعائلة VelaLight؟ 🕯️
      </h2>

      <p>
        اختاري شمعتك الفاخرة واصنعي لحظتك الخاصة
      </p>

      <a
        href="index.html#products"
        class="btn"
      >
        تسوقي الآن 🛍️
      </a>

    </section>

  </main>


  <!-- ═══ Lightbox ═══ -->

  <div
    class="lightbox"
    id="lightbox"
    role="dialog"
    aria-modal="true"
    aria-label="عرض صورة رأي العميل"
  >

    <button
      type="button"
      class="lightbox-close"
      id="lightboxClose"
      aria-label="إغلاق الصورة"
    >
      ×
    </button>

    <img
      id="lightboxImg"
      src=""
      alt="رأي عميل VelaLight"
    >

  </div>


  <script src="data.js"></script>

  <script>
    (function () {

      "use strict";

      const grid = document.getElementById("galleryGrid");
      const totalEl = document.getElementById("totalReviews");

      const lightbox = document.getElementById("lightbox");
      const lightboxImg = document.getElementById("lightboxImg");
      const lightboxClose = document.getElementById("lightboxClose");


      /* ═════════════════════════════════════════════════════
         Close Lightbox
         ═════════════════════════════════════════════════════ */

      function closeLightbox() {

        lightbox.classList.remove("open");

        lightboxImg.src = "";

        document.body.style.overflow = "";

      }


      /* ═════════════════════════════════════════════════════
         Open Lightbox
         ═════════════════════════════════════════════════════ */

      function openLightbox(url, altText) {

        lightboxImg.src = url;
        lightboxImg.alt = altText || "رأي عميل VelaLight";

        lightbox.classList.add("open");

        document.body.style.overflow = "hidden";

      }


      /* ═════════════════════════════════════════════════════
         Create Gallery Item
         ═════════════════════════════════════════════════════ */

      function createGalleryItem(imgName, index) {

        const imgUrl =
          typeof CDN === "function"
            ? CDN("testimonials/" + imgName)
            : "https://velalight.github.io/testimonials/" + encodeURIComponent(imgName);


        const item = document.createElement("article");

        item.className = "gallery-item";

        item.setAttribute(
          "aria-label",
          "عرض تجربة العميل رقم " + (index + 1)
        );


        /* Image wrapper */

        const imageWrap = document.createElement("div");

        imageWrap.className = "gallery-image-wrap";


        /* Image */

        const img = document.createElement("img");

        img.src = imgUrl;

        img.alt = "تجربة عميل VelaLight رقم " + (index + 1);

        img.loading = "lazy";

        img.decoding = "async";


        /* Info */

        const info = document.createElement("div");

        info.className = "gallery-item-info";


        const badge = document.createElement("span");

        badge.className = "gallery-item-badge";

        badge.textContent = "✓ تجربة عميل";


        const stars = document.createElement("span");

        stars.className = "gallery-item-stars";

        stars.textContent = "★★★★★";


        imageWrap.appendChild(img);

        info.appendChild(badge);

        info.appendChild(stars);

        item.appendChild(imageWrap);

        item.appendChild(info);


        /* Open image */

        item.addEventListener("click", function () {

          openLightbox(
            imgUrl,
            "تجربة عميل VelaLight رقم " + (index + 1)
          );

        });


        /* Keyboard accessibility */

        item.setAttribute("tabindex", "0");

        item.addEventListener("keydown", function (event) {

          if (
            event.key === "Enter" ||
            event.key === " "
          ) {

            event.preventDefault();

            openLightbox(
              imgUrl,
              "تجربة عميل VelaLight رقم " + (index + 1)
            );

          }

        });


        return item;

      }


      /* ═════════════════════════════════════════════════════
         Initialize Gallery
         ═════════════════════════════════════════════════════ */

      function initGallery() {

        if (
          typeof REVIEWS_IMAGES === "undefined" ||
          !Array.isArray(REVIEWS_IMAGES) ||
          REVIEWS_IMAGES.length === 0
        ) {

          grid.innerHTML = `
            <div class="reviews-empty">
              <div class="reviews-empty-icon">🕯️</div>
              <p>لا توجد تجارب للعرض حالياً</p>
            </div>
          `;

          totalEl.textContent = "0";

          return;
        }


        totalEl.textContent = REVIEWS_IMAGES.length;


        const fragment = document.createDocumentFragment();


        REVIEWS_IMAGES.forEach(function (imgName, index) {

          if (!imgName) return;

          fragment.appendChild(
            createGalleryItem(imgName, index)
          );

        });


        grid.appendChild(fragment);

      }


      /* ═════════════════════════════════════════════════════
         Events
         ═════════════════════════════════════════════════════ */

      lightboxClose.addEventListener(
        "click",
        closeLightbox
      );


      lightbox.addEventListener(
        "click",
        function (event) {

          if (event.target === lightbox) {

            closeLightbox();

          }

        }
      );


      lightboxImg.addEventListener(
        "click",
        function (event) {

          event.stopPropagation();

        }
      );


      document.addEventListener(
        "keydown",
        function (event) {

          if (
            event.key === "Escape" &&
            lightbox.classList.contains("open")
          ) {

            closeLightbox();

          }

        }
      );


      /* ═════════════════════════════════════════════════════
         Init
         ═════════════════════════════════════════════════════ */

      if (document.readyState === "loading") {

        document.addEventListener(
          "DOMContentLoaded",
          initGallery
        );

      } else {

        initGallery();

      }

    })();
  </script>

</body>
</html>
